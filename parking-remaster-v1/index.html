<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a211d">
<link rel="preload" as="image" href="assets/clean_plate.webp" fetchpriority="high">
<title>Parking Remaster — Level 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111814;touch-action:manipulation;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:-40px;background:linear-gradient(#18201a,#0d120f);filter:blur(24px)}
#wrap{position:fixed;overflow:hidden;background:#111;box-shadow:0 18px 60px #0009}
#stage{position:absolute;left:0;top:0;width:941px;height:1672px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none}
#background{position:absolute;inset:0;width:941px;height:1672px;display:block;pointer-events:none}
#levelHud{position:absolute;z-index:8;left:39px;top:49px;width:284px;height:87px;border:3px solid rgba(232,226,211,.86);border-radius:25px;background:rgba(31,34,29,.96);display:flex;align-items:center;justify-content:center;color:#eee9dc;font-family:Impact,'Arial Black',system-ui,sans-serif;font-size:51px;font-weight:900;letter-spacing:1.5px;line-height:1;text-shadow:0 2px 0 #0009;box-shadow:0 4px 10px #0005;pointer-events:none}
.car{position:absolute;z-index:7;display:block;pointer-events:none;transform-origin:50% 50%;filter:drop-shadow(0 7px 6px rgba(0,0,0,.38));will-change:transform}
.hot{position:absolute;z-index:12;border:0;background:transparent;padding:0;margin:0;border-radius:26px;outline:0;cursor:pointer;touch-action:none}
#hintPulse{position:absolute;z-index:10;left:366px;top:490px;width:148px;height:268px;border-radius:42px;pointer-events:none;animation:pulse 1.55s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,208,33,0)}50%{box-shadow:0 0 0 18px rgba(255,208,33,.17)}}
#flash{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(255,45,30,0);transition:background .12s}
#clear{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(4,8,6,0);opacity:0;pointer-events:none;transition:opacity .35s,background .35s}
#clear.show{opacity:1;background:rgba(4,8,6,.28);pointer-events:auto}
#badge{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff6ac 0 8%,#ffd53d 9% 57%,#df9d00 58% 100%);box-shadow:0 20px 55px #0008,inset 0 0 0 12px #ffe88b55;transform:scale(.62);transition:transform .42s cubic-bezier(.2,1.35,.3,1);font-size:110px;font-weight:900;color:#fff;text-shadow:0 5px 0 #bd8300}
#clear.show #badge{transform:scale(1)}
#restart{position:absolute;z-index:35;left:50%;bottom:145px;transform:translateX(-50%);width:112px;height:112px;border-radius:50%;border:0;background:#f5f1e7dd;color:#1b231f;font-size:58px;font-weight:700;box-shadow:0 12px 35px #0006;opacity:0;pointer-events:none;transition:opacity .3s}
#clear.show #restart{opacity:1;pointer-events:auto}
#sound{position:absolute;z-index:36;right:28px;top:28px;width:76px;height:76px;border:0;border-radius:50%;background:rgba(8,13,10,.42);color:#fff;font-size:34px;line-height:76px;text-align:center;padding:0;opacity:.72;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#sound:active{transform:scale(.94)}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<img id="background" src="assets/clean_plate.webp" alt="" decoding="sync" fetchpriority="high">
<div id="levelHud" aria-live="polite">LEVEL 1</div>
<div id="flash"></div>
<div id="clear"><div id="badge">✓</div><button id="restart" aria-label="restart">↻</button></div>
<button id="sound" aria-label="mute sound" aria-pressed="false">🔊</button>
</div></div>
<script src="game_logic.js"></script>
<script src="levels.generated.js"></script>
<script>
(()=>{
const levels=window.__PARKING_LEVELS__,logic=window.ParkingLogic;let level=levels?.level_001;if(!level)throw new Error('Level data missing: level_001');if(!levels?.level_002)throw new Error('Level data missing: level_002');if(!logic)throw new Error('ParkingLogic missing');
const W=level.board.width,H=level.board.height,stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap');
const clear=document.querySelector('#clear'),soundBtn=document.querySelector('#sound'),levelHud=document.querySelector('#levelHud');
function fit(){const vw=innerWidth,vh=innerHeight;const s=Math.max(vw/W,vh/H);const ww=W*s,hh=H*s;Object.assign(wrap.style,{width:ww+'px',height:hh+'px',left:(vw-ww)/2+'px',top:(vh-hh)/2+'px'});stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit,{passive:true});fit();

let defs=[];
const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const baseAngle={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0};
const cars=new Map();let moved=0,hintTimer=null,transitionTimer=null;
const progressionQA={transitions:[],restarts:[]};
const startup={scriptStartMs:performance.now(),controlsReadyMs:null,firstPlayerActionMs:null};
let audioCtx=null,audioBus=null,audioResetNeeded=false,audioEnabled=true;
const audioQA={contextsCreated:0,interruptionsObserved:0,resetsRequested:0,lastState:'none',sfx:{engine:0,horn:0,win:0}};
function markSfx(name){if(audioQA.sfx[name]!==undefined)audioQA.sfx[name]++}
function hitbox(body){const [x1,y1,x2,y2]=body,cx=(x1+x2)/2,cy=(y1+y2)/2,w=Math.max(112,x2-x1),h=Math.max(112,y2-y1);return [cx-w/2,cy-h/2,cx+w/2,cy+h/2]}
function activeIds(){return [...cars.values()].filter(o=>!o.moved).map(o=>o.id)}
function blocked(c){const id=logic.blockerId(level,c.id,activeIds());return id?cars.get(id):null}
function createAudioContext(){
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
  try{
    audioCtx=new C({latencyHint:'interactive'});audioQA.contextsCreated++;
    const masterGain=audioCtx.createGain(),comp=audioCtx.createDynamicsCompressor();
    masterGain.gain.value=.72;comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.18;
    masterGain.connect(comp).connect(audioCtx.destination);audioBus=masterGain;audioResetNeeded=false;audioQA.lastState=audioCtx.state;
    audioCtx.onstatechange=()=>{audioQA.lastState=audioCtx?.state||'none';if(audioCtx?.state==='interrupted'){audioQA.interruptionsObserved++;audioResetNeeded=true}};
    return audioCtx;
  }catch(e){audioCtx=null;audioBus=null;return null}
}
function ensureAudioOnGesture(){
  if(!audioEnabled)return null;
  if(audioResetNeeded||!audioCtx||audioCtx.state==='closed'||audioCtx.state==='interrupted'){
    try{audioCtx?.close()}catch(e){} audioCtx=null;audioBus=null;audioQA.resetsRequested++;createAudioContext();
  }
  const ctx=audioCtx||createAudioContext();if(!ctx)return null;
  if(ctx.state==='suspended'||ctx.state==='interrupted'){
    ctx.resume().then(()=>{audioQA.lastState=ctx.state;if(ctx.state!=='running')audioResetNeeded=true}).catch(()=>{audioResetNeeded=true});
  }
  return ctx;
}
function withAudio(build){
  if(!audioEnabled)return;
  const ctx=ensureAudioOnGesture();if(!ctx||!audioBus)return;
  const run=()=>{if(ctx===audioCtx&&ctx.state==='running'&&audioEnabled)try{build(ctx,audioBus)}catch(e){}};
  if(ctx.state==='running')run();else ctx.resume().then(run).catch(()=>{audioResetNeeded=true});
}
function engine(){markSfx('engine');withAudio((ctx,bus)=>{const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.setValueAtTime(78,t);o.frequency.exponentialRampToValueAtTime(138,t+.52);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+.64);o.connect(g).connect(bus);o.start(t);o.stop(t+.66)})}
function horn(){markSfx('horn');withAudio((ctx,bus)=>{const t=ctx.currentTime;[0,.065].forEach((d,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=i?392:330;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.035,t+d+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d+.13);o.connect(g).connect(bus);o.start(t+d);o.stop(t+d+.14)})})}
function winSound(){markSfx('win');withAudio((ctx,bus)=>{const t=ctx.currentTime;[523,659,784].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.044,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.25);o.connect(g).connect(bus);o.start(t+i*.09);o.stop(t+i*.09+.26)})})}
function markAudioInterruption(){
  if(!audioCtx)return;
  audioResetNeeded=true;audioQA.resetsRequested++;
  if(audioCtx.state==='running')audioCtx.suspend().catch(()=>{});
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)markAudioInterruption();else if(audioCtx)audioResetNeeded=true},{passive:true});
addEventListener('pagehide',markAudioInterruption,{passive:true});
addEventListener('pageshow',()=>{if(audioCtx)audioResetNeeded=true},{passive:true});
function add(c){c={...c,moved:false,bumping:false,spriteEl:null};const [x1,y1,x2,y2]=hitbox(c.body);const b=document.createElement('button');b.className='hot';Object.assign(b.style,{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'});b.addEventListener('pointerdown',e=>{e.preventDefault();if(startup.firstPlayerActionMs===null)startup.firstPlayerActionMs=performance.now();ensureAudioOnGesture();tap(c)});stage.appendChild(b);c.hot=b;cars.set(c.id,c);sprite(c)}
function clearLevelNodes(){clearTimeout(hintTimer);hintTimer=null;clearTimeout(transitionTimer);transitionTimer=null;stage.querySelectorAll('.car,.hot,#hintPulse,.hint-ring').forEach(el=>el.remove());cars.clear();moved=0}
function mountFirstFocusHint(){const focus=level.tutorial.first_focus_vehicle;if(!focus)return;const c=cars.get(focus);if(!c)return;const [x1,y1,x2,y2]=c.sprite;const ring=document.createElement('div');ring.id='hintPulse';Object.assign(ring.style,{left:(x1-1)+'px',top:(y1-2)+'px',width:(x2-x1+2)+'px',height:(y2-y1+7)+'px'});stage.appendChild(ring)}
function loadLevel(id,{recordTransition=true}={}){const next=levels?.[id];if(!next)throw new Error('Level data missing: '+id);if(next.board.width!==W||next.board.height!==H)throw new Error('Board dimensions changed: '+id);const from=level?.id||null;clearLevelNodes();clear.classList.remove('show');level=next;defs=level.vehicles.map(c=>({...c,first:c.id===level.tutorial.first_focus_vehicle}));levelHud.textContent=`LEVEL ${level.sequence}`;document.title=`Parking Remaster — Level ${level.sequence}`;defs.forEach(add);mountFirstFocusHint();if(recordTransition&&from!==id)progressionQA.transitions.push({from,to:id,at:performance.now()});return level}
loadLevel('level_001',{recordTransition:false});startup.controlsReadyMs=performance.now();
function sprite(c){if(c.spriteEl)return c.spriteEl;const [x1,y1,x2,y2]=c.sprite;const im=document.createElement('img');im.className='car';im.src=`assets/sprites/${c.id}.webp`;im.alt='';im.decoding='async';im.draggable=false;Object.assign(im.style,{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'});stage.appendChild(im);c.spriteEl=im;return im}
function tap(c){if(c.moved||c.bumping)return;clearTimeout(hintTimer);const hit=blocked(c);if(hit){bump(c);return}exitCar(c)}
function bump(c){c.bumping=true;horn();navigator.vibrate?.(28);const s=c.spriteEl||sprite(c),[dx,dy]=v[c.dir],cleanup=()=>{s.style.transform='';c.bumping=false};s.animate([{transform:'translate3d(0,0,0)'},{transform:`translate3d(${dx*14}px,${dy*14}px,0)`},{transform:'translate3d(0,0,0)'}],{duration:330,easing:'cubic-bezier(.2,.8,.3,1)'}).finished.then(cleanup,cleanup);const f=document.querySelector('#flash');f.style.background='rgba(255,60,45,.085)';setTimeout(()=>f.style.background='rgba(255,60,45,0)',120)}
function bez(p0,p1,p2,p3,t){const q=1-t;return [q*q*q*p0[0]+3*q*q*t*p1[0]+3*q*t*t*p2[0]+t*t*t*p3[0],q*q*q*p0[1]+3*q*q*t*p1[1]+3*q*t*t*p2[1]+t*t*t*p3[1]]}
function tan(p0,p1,p2,p3,t){const q=1-t;return [3*q*q*(p1[0]-p0[0])+6*q*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]),3*q*q*(p1[1]-p0[1])+6*q*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1])]}
function exitCar(c){c.moved=true;c.hot.disabled=true;moved++;engine();navigator.vibrate?.(12);if(c.first)document.querySelector('#hintPulse')?.remove();const s=c.spriteEl||sprite(c);const [x1,y1,x2,y2]=c.sprite,w=x2-x1,h=y2-y1,p0=[x1+w/2,y1+h/2],[dx,dy]=v[c.dir];
  const lead=c.dir==='up'?125:150;const p1=[p0[0]+dx*lead,p0[1]+dy*lead];
  let p2,p3,p4;
  p2=[p1[0]+(470-p1[0])*.58,Math.max(500,p1[1]-130)];p3=[470,445];p4=[470,285];
  const duration=2450,start=performance.now();
  function frame(now){const u=Math.min(1,(now-start)/duration);let pos,tg;
    if(u<.30){const t=u/.30,q=1-Math.pow(1-t,2);pos=[p0[0]+(p1[0]-p0[0])*q,p0[1]+(p1[1]-p0[1])*q];tg=[p1[0]-p0[0],p1[1]-p0[1]]}
    else if(u<.86){const t=(u-.30)/.56;pos=bez(p1,[p1[0],p1[1]-80],[p2[0],p2[1]+70],p3,t);tg=tan(p1,[p1[0],p1[1]-80],[p2[0],p2[1]+70],p3,t)}
    else{const t=(u-.86)/.14;pos=[p3[0],p3[1]+(p4[1]-p3[1])*t];tg=[0,-1]}
    const a=Math.atan2(tg[1],tg[0])-baseAngle[c.dir],tx=pos[0]-p0[0],ty=pos[1]-p0[1];s.style.transform=`translate3d(${tx}px,${ty}px,0) rotate(${a}rad)`;if(u<1)requestAnimationFrame(frame);else{s.remove();c.spriteEl=null;if(moved===defs.length)complete();else scheduleHint()}}
  requestAnimationFrame(frame)
}
function scheduleHint(){clearTimeout(hintTimer);hintTimer=setTimeout(()=>{const c=[...cars.values()].find(x=>!x.moved&&!blocked(x));if(!c)return;const [x1,y1,x2,y2]=c.body;const ring=document.createElement('div');ring.className='hint-ring';ring.style.cssText=`position:absolute;z-index:9;left:${x1-8}px;top:${y1-8}px;width:${x2-x1+16}px;height:${y2-y1+16}px;border-radius:34px;pointer-events:none;animation:pulse 1.5s ease-in-out 2`;stage.appendChild(ring);setTimeout(()=>ring.remove(),3100)},5000)}
function complete(){const completedId=level.id;setTimeout(()=>{if(level.id!==completedId)return;clear.classList.add('show');winSound();navigator.vibrate?.([25,40,25]);if(completedId==='level_001'&&levels.level_002){transitionTimer=setTimeout(()=>{if(level.id!==completedId)return;loadLevel('level_002')},1050)}},420)}
function restartCurrentLevel(){const id=level.id;progressionQA.restarts.push({level:id,at:performance.now()});loadLevel(id,{recordTransition:false})}
document.querySelector('#restart').addEventListener('click',restartCurrentLevel);
soundBtn.addEventListener('pointerdown',e=>{
  e.preventDefault();audioEnabled=!audioEnabled;soundBtn.textContent=audioEnabled?'🔊':'🔇';soundBtn.setAttribute('aria-pressed',String(!audioEnabled));soundBtn.setAttribute('aria-label',audioEnabled?'mute sound':'unmute sound');
  if(!audioEnabled){if(audioCtx?.state==='running')audioCtx.suspend().catch(()=>{});}
  else{audioResetNeeded=true;ensureAudioOnGesture();}
});
window.__parkingStartup=startup;
window.__parkingAudioQA={stats:audioQA,state:()=>audioCtx?.state||'none',enabled:()=>audioEnabled,resetNeeded:()=>audioResetNeeded};
window.__parkingProgressQA={currentLevel:()=>level.id,history:progressionQA,hud:()=>levelHud.textContent};
window.__parkingQA={cars,blocked,tap,hitbox,activeIds,order:()=>logic.legalMoves(level,activeIds()),currentLevel:()=>level.id,loadLevel,restartCurrentLevel};
if(new URLSearchParams(location.search).get('auto')==='1'){
  const solve=()=>{const c=[...cars.values()].find(x=>!x.moved&&!blocked(x));if(!c)return;tap(c);setTimeout(solve,2650)};setTimeout(solve,800)
}
})();
</script>
<script src="iphone_qa.js"></script>
</body></html>
