<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a211d">
<title>Parking Remaster — Level 1</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111814;touch-action:manipulation;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:-40px;background:linear-gradient(#18201a,#0d120f);filter:blur(24px)}
#wrap{position:fixed;overflow:hidden;background:#111;box-shadow:0 18px 60px #0009}
#stage{position:absolute;left:0;top:0;width:941px;height:1672px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none}
#master{position:absolute;inset:0;width:941px;height:1672px;display:block;pointer-events:none}
.patch,.car{position:absolute;display:block;pointer-events:none;transform-origin:50% 50%}
.patch{z-index:4}
.car{z-index:7;filter:drop-shadow(0 7px 6px rgba(0,0,0,.38));will-change:transform}
.hot{position:absolute;z-index:12;border:0;background:transparent;padding:0;margin:0;border-radius:26px;outline:0;cursor:pointer;touch-action:none}
#hintPulse{position:absolute;z-index:10;left:366px;top:490px;width:148px;height:268px;border-radius:42px;pointer-events:none;animation:pulse 1.55s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,208,33,0)}50%{box-shadow:0 0 0 18px rgba(255,208,33,.17)}}
#flash{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(255,45,30,0);transition:background .12s}
#clear{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(4,8,6,0);opacity:0;pointer-events:none;transition:opacity .35s,background .35s}
#clear.show{opacity:1;background:rgba(4,8,6,.28);pointer-events:auto}
#badge{width:200px;height:200px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff6ac 0 8%,#ffd53d 9% 57%,#df9d00 58% 100%);box-shadow:0 20px 55px #0008,inset 0 0 0 12px #ffe88b55;transform:scale(.62);transition:transform .42s cubic-bezier(.2,1.35,.3,1);font-size:110px;font-weight:900;color:#fff;text-shadow:0 5px 0 #bd8300}
#clear.show #badge{transform:scale(1)}
#restart{position:absolute;z-index:35;left:50%;bottom:145px;transform:translateX(-50%);width:112px;height:112px;border-radius:50%;border:0;background:#f5f1e7dd;color:#1b231f;font-size:58px;font-weight:700;box-shadow:0 12px 35px #0006;opacity:0;pointer-events:none;transition:opacity .3s}
#clear.show #restart{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<img id="master" src="assets/master.webp" alt="">
<div id="flash"></div>
<div id="clear"><div id="badge">✓</div><button id="restart" aria-label="restart">↻</button></div>
</div></div>
<script>
(()=>{
const W=941,H=1672,stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap');
const master=document.querySelector('#master'),clear=document.querySelector('#clear');
function fit(){const vw=innerWidth,vh=innerHeight;const s=Math.max(vw/W,vh/H);const ww=W*s,hh=H*s;Object.assign(wrap.style,{width:ww+'px',height:hh+'px',left:(vw-ww)/2+'px',top:(vh-hh)/2+'px'});stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit,{passive:true});fit();

const defs=[
 {id:'green_tl',sprite:[112,457,243,728],body:[125,486,230,709],dir:'up'},
 {id:'red_top',sprite:[367,492,513,753],body:[383,525,487,737],dir:'up',first:true},
 {id:'blue_top',sprite:[487,587,753,738],body:[510,617,724,723],dir:'left'},
 {id:'white_tr',sprite:[722,442,878,728],body:[748,481,842,705],dir:'up'},
 {id:'black_ml',sprite:[77,727,243,1043],body:[109,759,216,1019],dir:'up'},
 {id:'yellow_mid',sprite:[367,727,658,883],body:[400,759,639,866],dir:'left'},
 {id:'silver_mid',sprite:[362,877,683,1028],body:[392,904,650,1008],dir:'left'},
 {id:'white_bl',sprite:[257,1017,413,1318],body:[285,1043,389,1284],dir:'up'},
 {id:'blue_bottom',sprite:[392,1172,653,1323],body:[424,1204,628,1299],dir:'left'},
 {id:'green_br',sprite:[617,1017,763,1318],body:[641,1054,736,1287],dir:'up'}
];
const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const baseAngle={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0};
const cars=new Map();let moved=0,audioCtx=null,hintTimer=null,firstDone=false;
function intersect(a,b){return !(a[2]<=b[0]||a[0]>=b[2]||a[3]<=b[1]||a[1]>=b[3]);}
function hitbox(body){const [x1,y1,x2,y2]=body,cx=(x1+x2)/2,cy=(y1+y2)/2,w=Math.max(112,x2-x1),h=Math.max(112,y2-y1);return [cx-w/2,cy-h/2,cx+w/2,cy+h/2]}
function blocked(c){const [dx,dy]=v[c.dir],b=c.body;let corridor;
  if(c.dir==='up')corridor=[b[0]+4,445,b[2]-4,b[1]];
  else if(c.dir==='down')corridor=[b[0]+4,b[3],b[2]-4,1310];
  else if(c.dir==='left')corridor=[90,b[1]+4,b[0],b[3]-4];
  else corridor=[b[2],b[1]+4,850,b[3]-4];
  for(const o of cars.values()){if(o===c||o.moved)continue;if(intersect(corridor,o.body))return o;}return null;
}
function audio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function engine(){try{audio();const t=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(145,t+.55);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.042,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.72);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.74)}catch(e){}}
function horn(){try{audio();const t=audioCtx.currentTime;[0,.06].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i?390:320;g.gain.setValueAtTime(.026,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+.15);o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.16)})}catch(e){}}
function winSound(){try{audio();const t=audioCtx.currentTime;[523,659,784].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.05,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.27);o.connect(g).connect(audioCtx.destination);o.start(t+i*.09);o.stop(t+i*.09+.28)})}catch(e){}}
function add(c){c={...c,moved:false,bumping:false,patch:null,spriteEl:null};const [x1,y1,x2,y2]=hitbox(c.body);const b=document.createElement('button');b.className='hot';Object.assign(b.style,{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'});b.addEventListener('pointerdown',e=>{e.preventDefault();tap(c)});stage.appendChild(b);c.hot=b;cars.set(c.id,c)}
defs.forEach(add);
function patch(c,show){if(!c.patch){const [x1,y1,x2,y2]=c.sprite;const im=document.createElement('img');im.className='patch';im.src=`assets/patches/${c.id}.webp`;Object.assign(im.style,{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px',display:'none'});stage.appendChild(im);c.patch=im}c.patch.style.display=show?'block':'none'}
function sprite(c){const [x1,y1,x2,y2]=c.sprite;const im=document.createElement('img');im.className='car';im.src=`assets/sprites/${c.id}.webp`;Object.assign(im.style,{left:x1+'px',top:y1+'px',width:(x2-x1)+'px',height:(y2-y1)+'px'});stage.appendChild(im);c.spriteEl=im;return im}
function coverTutorial(){if(firstDone)return;firstDone=true;const im=document.createElement('img');im.className='patch';im.src='assets/tutorial_cover.webp';Object.assign(im.style,{left:'330px',top:'440px',width:'220px',height:'350px',zIndex:5});stage.appendChild(im)}
function tap(c){if(c.moved||c.bumping)return;clearTimeout(hintTimer);const hit=blocked(c);if(hit){bump(c);return}exitCar(c)}
function bump(c){c.bumping=true;horn();navigator.vibrate?.(28);patch(c,true);const s=sprite(c),[dx,dy]=v[c.dir],cleanup=()=>{s.remove();c.spriteEl=null;patch(c,false);c.bumping=false};s.animate([{transform:'translate3d(0,0,0)'},{transform:`translate3d(${dx*14}px,${dy*14}px,0)`},{transform:'translate3d(0,0,0)'}],{duration:330,easing:'cubic-bezier(.2,.8,.3,1)'}).finished.then(cleanup,cleanup);const f=document.querySelector('#flash');f.style.background='rgba(255,60,45,.085)';setTimeout(()=>f.style.background='rgba(255,60,45,0)',120)}
function bez(p0,p1,p2,p3,t){const q=1-t;return [q*q*q*p0[0]+3*q*q*t*p1[0]+3*q*t*t*p2[0]+t*t*t*p3[0],q*q*q*p0[1]+3*q*q*t*p1[1]+3*q*t*t*p2[1]+t*t*t*p3[1]]}
function tan(p0,p1,p2,p3,t){const q=1-t;return [3*q*q*(p1[0]-p0[0])+6*q*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]),3*q*q*(p1[1]-p0[1])+6*q*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1])]}
function exitCar(c){c.moved=true;c.hot.disabled=true;moved++;engine();navigator.vibrate?.(12);if(c.first)coverTutorial();patch(c,true);const s=sprite(c);const [x1,y1,x2,y2]=c.sprite,w=x2-x1,h=y2-y1,p0=[x1+w/2,y1+h/2],[dx,dy]=v[c.dir];
  const lead=c.dir==='up'?125:150;const p1=[p0[0]+dx*lead,p0[1]+dy*lead];
  let p2,p3,p4;
  p2=[p1[0]+(470-p1[0])*.58,Math.max(500,p1[1]-130)];p3=[470,445];p4=[470,285];
  const duration=2450,start=performance.now();
  function frame(now){const u=Math.min(1,(now-start)/duration);let pos,tg;
    if(u<.30){const t=u/.30,q=1-Math.pow(1-t,2);pos=[p0[0]+(p1[0]-p0[0])*q,p0[1]+(p1[1]-p0[1])*q];tg=[p1[0]-p0[0],p1[1]-p0[1]]}
    else if(u<.86){const t=(u-.30)/.56;pos=bez(p1,[p1[0],p1[1]-80],[p2[0],p2[1]+70],p3,t);tg=tan(p1,[p1[0],p1[1]-80],[p2[0],p2[1]+70],p3,t)}
    else{const t=(u-.86)/.14;pos=[p3[0],p3[1]+(p4[1]-p3[1])*t];tg=[0,-1]}
    const a=Math.atan2(tg[1],tg[0])-baseAngle[c.dir],tx=pos[0]-p0[0],ty=pos[1]-p0[1];s.style.transform=`translate3d(${tx}px,${ty}px,0) rotate(${a}rad)`;if(u<1)requestAnimationFrame(frame);else{s.remove();c.spriteEl=null;if(moved===defs.length)complete();else scheduleHint()}}
  requestAnimationFrame(frame)
}
function scheduleHint(){clearTimeout(hintTimer);hintTimer=setTimeout(()=>{const c=[...cars.values()].find(x=>!x.moved&&!blocked(x));if(!c)return;const [x1,y1,x2,y2]=c.body;const ring=document.createElement('div');ring.style.cssText=`position:absolute;z-index:9;left:${x1-8}px;top:${y1-8}px;width:${x2-x1+16}px;height:${y2-y1+16}px;border-radius:34px;pointer-events:none;animation:pulse 1.5s ease-in-out 2`;stage.appendChild(ring);setTimeout(()=>ring.remove(),3100)},5000)}
function complete(){setTimeout(()=>{clear.classList.add('show');winSound();navigator.vibrate?.([25,40,25])},420)}
document.querySelector('#restart').addEventListener('click',()=>location.reload());
window.__parkingQA={cars,blocked,tap,hitbox,order:()=>[...cars.values()].filter(c=>!c.moved&&!blocked(c)).map(c=>c.id)};
if(new URLSearchParams(location.search).get('auto')==='1'){
  const solve=()=>{const c=[...cars.values()].find(x=>!x.moved&&!blocked(x));if(!c)return;tap(c);setTimeout(solve,2650)};setTimeout(solve,800)
}
})();
</script>
</body></html>
