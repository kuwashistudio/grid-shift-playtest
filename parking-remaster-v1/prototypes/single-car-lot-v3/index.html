<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#191d1b"><title>Parking Remaster — Compact J-Drift Prototype</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121513;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#shell{position:relative;width:min(100vw,calc(100vh * 420 / 680),420px);aspect-ratio:420/680;overflow:hidden;background:#202522}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#reset{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(245,245,238,.9);color:#121513;font-size:27px;font-weight:800;box-shadow:0 4px 18px #0007}#reset:active{transform:scale(.94)}#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em;pointer-events:none;transition:opacity .15s}#hint.hide{opacity:0}
</style></head><body><div id="shell"><canvas id="c" aria-label="Compact drift prototype"></canvas><button id="reset" aria-label="Reset prototype">↻</button><div id="hint">TAP THE CAR</div></div><script>
(()=>{const canvas=document.querySelector('#c'),shell=document.querySelector('#shell'),hint=document.querySelector('#hint'),ctx=canvas.getContext('2d',{alpha:false});
const WORLD={w:420,h:680},CAR={length:96,width:45,wheelbase:66},START={x:156,y:520,heading:-Math.PI/2},PHASES=['launch','flick','counter','exit'];let state,raf,last=0,history=[],marks=[],smoke=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
function reset(){cancelAnimationFrame(raf);state={x:START.x,y:START.y,heading:START.heading,vx:0,vy:0,yaw:0,steer:0,phase:0,phaseT:0,running:false,done:false,maxSlip:0,maxYaw:0,startedAt:null,completedAt:null};history=[];marks=[];smoke=[];last=0;hint.textContent='TAP THE CAR';hint.classList.remove('hide');draw()}
function resize(){const r=shell.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw()}addEventListener('resize',resize,{passive:true});
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawLot(){const g=ctx.createLinearGradient(0,0,0,WORLD.h);g.addColorStop(0,'#555c58');g.addColorStop(.52,'#424845');g.addColorStop(1,'#333835');ctx.fillStyle=g;ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.save();ctx.globalAlpha=.11;for(let i=0;i<600;i++){const x=i*83%419,y=i*149%679,v=40+(i*37%52);ctx.fillStyle=`rgb(${v},${v+2},${v+1})`;ctx.fillRect(x,y,1.1,1.1)}ctx.restore();ctx.fillStyle='#c8c2b6';ctx.fillRect(0,72,WORLD.w,18);ctx.fillStyle='#85827b';ctx.fillRect(0,90,WORLD.w,5);ctx.fillStyle='rgba(255,255,255,.03)';ctx.fillRect(0,300,WORLD.w,150);ctx.strokeStyle='rgba(244,240,220,.9)';ctx.lineWidth=4;ctx.lineCap='round';for(const x of [82,156,230,304]){ctx.beginPath();ctx.moveTo(x,445);ctx.lineTo(x,625);ctx.stroke()}ctx.beginPath();ctx.moveTo(82,445);ctx.lineTo(304,445);ctx.stroke();ctx.fillStyle='#aaa59b';for(const x of [119,193,267]){rr(x-20,590,40,8,3);ctx.fill()}ctx.strokeStyle='rgba(244,240,220,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(345,300);ctx.lineTo(345,445);ctx.stroke();ctx.fillStyle='rgba(244,240,220,.20)';for(const x of [300,348,396]){ctx.beginPath();ctx.moveTo(x+18,370);ctx.lineTo(x+3,358);ctx.lineTo(x+3,365);ctx.lineTo(x-14,365);ctx.lineTo(x-14,375);ctx.lineTo(x+3,375);ctx.lineTo(x+3,382);ctx.closePath();ctx.fill()}}
function rearWheelWorld(side){const back=CAR.wheelbase/2,lat=side*(CAR.width/2-2),a=state.heading,c=Math.cos(a),s=Math.sin(a);return{x:state.x+c*(-back)-s*lat,y:state.y+s*(-back)+c*lat}}
function addMarks(){if(state.phase!==1)return;for(const side of [-1,1]){const p=rearWheelWorld(side),prev=marks.length?marks[marks.length-1]:null;marks.push({x:p.x,y:p.y,a:.34});if(marks.length>420)marks.shift()}}
function addSmoke(){if(state.phase!==1)return;for(let i=0;i<2;i++){const p=rearWheelWorld(i?1:-1);smoke.push({x:p.x+(i?3:-3),y:p.y,r:3+((history.length+i)%4),a:.23,vx:-10+((i*7+history.length)%9),vy:-8-((history.length+i)%5)});if(smoke.length>100)smoke.shift()}}
function drawMarks(){ctx.save();ctx.fillStyle='rgba(20,20,18,.25)';for(const m of marks){ctx.beginPath();ctx.ellipse(m.x,m.y,2.2,5.5,state.heading,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawSmoke(){ctx.save();for(const s of smoke){ctx.globalAlpha=s.a;ctx.fillStyle='#d9ddd9';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawShadow(){ctx.save();ctx.translate(state.x+6,state.y+8);ctx.rotate(state.heading+Math.PI/2);ctx.filter='blur(7px)';ctx.globalAlpha=.31;ctx.fillStyle='#000';rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.restore();ctx.filter='none'}
function drawCar(){ctx.save();ctx.translate(state.x,state.y);ctx.rotate(state.heading+Math.PI/2);const axle=CAR.wheelbase/2,ww=8,wh=19;ctx.fillStyle='#111';for(const side of [-1,1]){ctx.save();ctx.translate(side*(CAR.width/2-1),-axle);ctx.rotate(state.steer);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore();ctx.save();ctx.translate(side*(CAR.width/2-1),axle);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore()}const body=ctx.createLinearGradient(-CAR.width/2,0,CAR.width/2,0);body.addColorStop(0,'#6d0a0f');body.addColorStop(.16,'#b4141b');body.addColorStop(.52,'#f03c44');body.addColorStop(.83,'#b3141a');body.addColorStop(1,'#64090e');ctx.fillStyle=body;rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.27)';ctx.lineWidth=1.2;ctx.stroke();const glass=ctx.createLinearGradient(0,-31,0,24);glass.addColorStop(0,'#bdd6da');glass.addColorStop(.43,'#657e84');glass.addColorStop(1,'#26383c');ctx.fillStyle=glass;rr(-15,-30,30,49,8);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-13,-25,26,2);ctx.strokeStyle='rgba(60,0,0,.44)';ctx.beginPath();ctx.moveTo(-17,-35);ctx.lineTo(17,-35);ctx.moveTo(-17,32);ctx.lineTo(17,32);ctx.stroke();ctx.fillStyle='#f5efd6';ctx.fillRect(-15,-CAR.length/2+4,10,4);ctx.fillRect(5,-CAR.length/2+4,10,4);ctx.fillStyle=state.phase===1?'#ff2c2c':'#8d0c10';ctx.fillRect(-15,CAR.length/2-8,10,4);ctx.fillRect(5,CAR.length/2-8,10,4);ctx.restore()}
function draw(){ctx.setTransform(canvas.width/WORLD.w,0,0,canvas.height/WORLD.h,0,0);drawLot();drawMarks();drawSmoke();drawShadow();drawCar();if(!state.running&&!state.done){ctx.strokeStyle='rgba(255,216,70,.88)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(state.x,state.y,CAR.width*.84,CAR.length*.61,0,0,Math.PI*2);ctx.stroke()}}
function slipAngle(){const sp=Math.hypot(state.vx,state.vy);if(sp<1)return 0;return Math.abs(norm(Math.atan2(state.vy,state.vx)-state.heading))}
function phaseControl(dt){state.phaseT+=dt;
 if(state.phase===0){ // violent launch straight out of bay
   state.steer=0;const thrust=850;state.vx+=Math.cos(state.heading)*thrust*dt;state.vy+=Math.sin(state.heading)*thrust*dt;const sp=Math.hypot(state.vx,state.vy);if(sp>235){state.vx*=235/sp;state.vy*=235/sp}if(state.phaseT>.36){state.phase=1;state.phaseT=0;state.yaw=3.4}
 } else if(state.phase===1){ // handbrake flick: body rotates faster than travel vector
   state.steer=-30*Math.PI/180;state.yaw+=8.0*dt;state.yaw*=Math.pow(.92,dt*60);state.heading=norm(state.heading+state.yaw*dt);
   const thrust=85;state.vx+=Math.cos(state.heading)*thrust*dt;state.vy+=Math.sin(state.heading)*thrust*dt;state.vx*=Math.pow(.997,dt*60);state.vy*=Math.pow(.997,dt*60);
   addMarks();addSmoke();if(state.heading>-0.28||state.phaseT>.42){state.phase=2;state.phaseT=0}
 } else if(state.phase===2){ // countersteer: catch rear, quickly align velocity with body
   state.steer=-30*Math.PI/180;state.yaw*=Math.pow(.72,dt*60);state.heading=norm(state.heading+state.yaw*dt);
   const sp=Math.max(190,Math.hypot(state.vx,state.vy));const tx=Math.cos(state.heading)*sp,ty=Math.sin(state.heading)*sp,align=1-Math.pow(.42,dt*60);state.vx+=(tx-state.vx)*align;state.vy+=(ty-state.vy)*align;
   state.vx+=Math.cos(state.heading)*430*dt;state.vy+=Math.sin(state.heading)*430*dt;
   if(state.phaseT>.28){state.phase=3;state.phaseT=0}
 } else { // snap straight and blast out
   state.steer*=Math.pow(.5,dt*60);state.yaw*=Math.pow(.45,dt*60);state.heading+=(0-state.heading)*(1-Math.pow(.34,dt*60));
   const tx=315,ty=0,align=1-Math.pow(.45,dt*60);state.vx+=(tx-state.vx)*align;state.vy+=(ty-state.vy)*align;
 }
}
function step(t){if(!state.running)return;if(!last)last=t;const dt=Math.min(.020,(t-last)/1000);last=t;phaseControl(dt);if(state.phase!==1)state.heading=norm(state.heading+state.yaw*dt);state.x+=state.vx*dt;state.y+=state.vy*dt;for(const s of smoke){s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=8*dt;s.a*=Math.pow(.86,dt*60)}smoke=smoke.filter(s=>s.a>.015);const slip=slipAngle();state.maxSlip=Math.max(state.maxSlip,slip);state.maxYaw=Math.max(state.maxYaw,Math.abs(state.yaw));history.push({t:+(t-state.startedAt).toFixed(1),phase:PHASES[state.phase],x:+state.x.toFixed(2),y:+state.y.toFixed(2),heading:+state.heading.toFixed(4),vx:+state.vx.toFixed(2),vy:+state.vy.toFixed(2),speed:+Math.hypot(state.vx,state.vy).toFixed(2),steer:+state.steer.toFixed(4),yaw:+state.yaw.toFixed(4),slip:+slip.toFixed(4)});if(state.phase===3&&state.x>455){state.running=false;state.done=true;state.completedAt=t;hint.classList.add('hide');draw();return}draw();raf=requestAnimationFrame(step)}
function start(){if(state.running||state.done)return;state.running=true;state.startedAt=performance.now();last=0;hint.classList.add('hide');raf=requestAnimationFrame(step)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*WORLD.w/r.width,y=(e.clientY-r.top)*WORLD.h/r.height;if(Math.hypot(x-state.x,y-state.y)<72)start()});document.querySelector('#reset').addEventListener('click',reset);
window.__driftQA={state:()=>({...state,phaseName:PHASES[state.phase],slip:slipAngle()}),history:()=>history.slice(),start,reset,constants:{WORLD,CAR,START,PHASES}};reset();resize()})();
</script></body></html>
