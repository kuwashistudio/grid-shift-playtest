*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111412;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#shell{position:relative;width:min(100vw,calc(100vh * 420 / 680),420px);aspect-ratio:420/680;overflow:hidden;background:#202522}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.56);color:#fff;font-size:13px;font-weight:800;pointer-events:none;transition:opacity .12s}#hint.hide{opacity:0}#mute,#reset{position:absolute;top:max(14px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(245,245,238,.9);color:#111;font-size:21px;font-weight:800;box-shadow:0 4px 18px #0007}#mute{left:14px}#reset{right:14px}#mute:active,#reset:active{transform:scale(.97)}
</style></head><body><div id="shell"><canvas id="c"></canvas><button id="mute" aria-label="Toggle sound">🔊</button><button id="reset" aria-label="Reset">↻</button><div id="hint">TAP THE CAR</div></div><script>
(()=>{const canvas=document.querySelector('#c'),shell=document.querySelector('#shell'),hint=document.querySelector('#hint'),muteBtn=document.querySelector('#mute'),ctx=canvas.getContext('2d',{alpha:false});
const WORLD={w:420,h:680},CAR={length:98,width:46,wheelbase:68},START={x:261,y:520,heading:-Math.PI/2},PHASES=['charge','blast','snap','reload','exit'];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),powEase=(t,p)=>Math.pow(clamp(t,0,1),p),snapEase=t=>1-Math.pow(1-clamp(t,0,1),5);
function axle(x,y,h,front=true){const d=(front?1:-1)*CAR.wheelbase/2;return{x:x+Math.cos(h)*d,y:y+Math.sin(h)*d}}function centerFromFront(p,h){return{x:p.x-Math.cos(h)*CAR.wheelbase/2,y:p.y-Math.sin(h)*CAR.wheelbase/2}}function rearWheel(side){const r=axle(state.x,state.y,state.heading,false),lat=side*(CAR.width/2-2),nx=-Math.sin(state.heading),ny=Math.cos(state.heading);return{x:r.x+nx*lat,y:r.y+ny*lat}}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function reset(){cancelAnimationFrame(raf);state={x:START.x,y:START.y,heading:START.heading,phase:0,phaseT:0,running:false,done:false,startedAt:0,completedAt:0,smokeCount:0,speed:0,blastStart:null,snapFrontStart:null,reloadStart:null,exitStart:null};history=[];smoke=[];skidL=[];skidR=[];skidPrev={L:null,R:null};last=0;hint.classList.remove('hide');draw()}
function resize(){const r=shell.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw()}addEventListener('resize',resize,{passive:true});function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawLot(){const g=ctx.createLinearGradient(0,0,0,WORLD.h);g.addColorStop(0,'#59605c');g.addColorStop(.5,'#444a47');g.addColorStop(1,'#343936');ctx.fillStyle=g;ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.save();ctx.globalAlpha=.11;for(let i=0;i<580;i++){const x=i*89%419,y=i*157%679,v=40+(i*41%52);ctx.fillStyle=`rgb(${v},${v+2},${v+1})`;ctx.fillRect(x,y,1.1,1.1)}ctx.restore();ctx.fillStyle='#c8c2b6';ctx.fillRect(0,72,WORLD.w,18);ctx.fillStyle='#85827b';ctx.fillRect(0,90,WORLD.w,5);ctx.fillStyle='rgba(255,255,255,.028)';ctx.fillRect(0,285,WORLD.w,170);ctx.strokeStyle='rgba(244,240,220,.9)';ctx.lineWidth=4;ctx.lineCap='round';for(const x of [150,224,298,372]){ctx.beginPath();ctx.moveTo(x,445);ctx.lineTo(x,625);ctx.stroke()}ctx.beginPath();ctx.moveTo(150,445);ctx.lineTo(372,445);ctx.stroke();ctx.fillStyle='#aaa59b';for(const x of [187,261,335]){rr(x-20,590,40,8,3);ctx.fill()}ctx.strokeStyle='rgba(244,240,220,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(365,285);ctx.lineTo(365,455);ctx.stroke()}
function emitSmoke(n=2,strong=1){for(let i=0;i<n;i++){const p=rearWheel(i%2?1:-1);smoke.push({x:p.x+(i%2?2:-2),y:p.y,r:5.5+((state.smokeCount+i)%5),a:.34*strong,vx:(i%2?7:-7),vy:-5-((state.smokeCount+i)%5)});state.smokeCount++;if(smoke.length>240)smoke.shift()}}
function skidSpec(){if(state.phase===1)return state.phaseT<.11?{L:{a:.16,w:2},R:{a:.16,w:2}}:{L:null,R:null};if(state.phase===2)return{L:{a:.38,w:3.2},R:{a:.13,w:1.7}};if(state.phase===4)return state.phaseT<.10?{L:{a:.14,w:1.9},R:{a:.14,w:1.9}}:{L:null,R:null};return{L:null,R:null}}
function pushSkid(arr,prev,cur,style,phase){if(!prev||!style)return;const d=dist(prev,cur);if(d<.85)return;arr.push({x1:prev.x,y1:prev.y,x2:cur.x,y2:cur.y,w:style.w,a:style.a,age:0,phase});if(arr.length>240)arr.shift()}
function updateSkids(dt){const L=rearWheel(-1),R=rearWheel(1),spec=skidSpec();pushSkid(skidL,skidPrev.L,L,spec.L,PHASES[state.phase]);pushSkid(skidR,skidPrev.R,R,spec.R,PHASES[state.phase]);skidPrev={L,R};const life=5.6;for(const arr of [skidL,skidR]){for(const s of arr)s.age+=dt;while(arr.length&&arr[0].age>life)arr.shift()}}
function drawSkids(){const life=5.6;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(const arr of [skidL,skidR])for(const s of arr){const f=1-clamp(s.age/life,0,1);ctx.strokeStyle=`rgba(18,17,15,${s.a*f})`;ctx.lineWidth=s.w*(.85+.15*f);ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke()}ctx.restore()}
function drawSmoke(){ctx.save();for(const s of smoke){ctx.globalAlpha=s.a;ctx.fillStyle='#e0e2df';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.restore()}function drawShadow(){ctx.save();ctx.translate(state.x+6,state.y+8);ctx.rotate(state.heading+Math.PI/2);ctx.filter='blur(7px)';ctx.globalAlpha=.31;ctx.fillStyle='#000';rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.restore();ctx.filter='none'}
function drawCar(){ctx.save();ctx.translate(state.x,state.y);ctx.rotate(state.heading+Math.PI/2);const axleD=CAR.wheelbase/2,ww=8,wh=19,steer=state.phase===2?.52:0;ctx.fillStyle='#111';for(const side of [-1,1]){ctx.save();ctx.translate(side*(CAR.width/2-1),-axleD);ctx.rotate(steer);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore();ctx.fillRect(side*(CAR.width/2-1)-ww/2,axleD-wh/2,ww,wh)}const body=ctx.createLinearGradient(-CAR.width/2,0,CAR.width/2,0);body.addColorStop(0,'#69090e');body.addColorStop(.16,'#b4141b');body.addColorStop(.52,'#f23f47');body.addColorStop(.83,'#ad1218');body.addColorStop(1,'#5d080c');ctx.fillStyle=body;rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.2;ctx.stroke();const glass=ctx.createLinearGradient(0,-31,0,24);glass.addColorStop(0,'#bfd8dc');glass.addColorStop(.43,'#657f85');glass.addColorStop(1,'#25373b');ctx.fillStyle=glass;rr(-15,-30,30,49,8);ctx.fill();ctx.fillStyle='#f5efd6';ctx.fillRect(-15,-CAR.length/2+4,10,4);ctx.fillRect(5,-CAR.length/2+4,10,4);ctx.fillStyle=(state.phase===0||state.phase===3)?'#ff3030':'#8d0c10';ctx.fillRect(-15,CAR.length/2-8,10,4);ctx.fillRect(5,CAR.length/2-8,10,4);ctx.restore()}
function draw(){ctx.setTransform(canvas.width/WORLD.w,0,0,canvas.height/WORLD.h,0,0);drawLot();drawSkids();drawSmoke();drawShadow();drawCar();if(!state.running&&!state.done){ctx.strokeStyle='rgba(255,216,70,.88)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(state.x,state.y,CAR.width*.84,CAR.length*.61,0,0,Math.PI*2);ctx.stroke()}}
function ensureAudio(){if(audio)return audio;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;const ac=new AC(),master=ac.createGain(),analyser=ac.createAnalyser(),comp=ac.createDynamicsCompressor();master.gain.value=.5;analyser.fftSize=512;comp.threshold.value=-26;comp.knee.value=18;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.14;master.connect(analyser);analyser.connect(comp);comp.connect(ac.destination);const engineGain=ac.createGain(),engine1=ac.createOscillator(),engine2=ac.createOscillator();engine1.type='sawtooth';engine2.type='triangle';engine1.frequency.value=78;engine2.frequency.value=156;engineGain.gain.value=0;engine1.connect(engineGain);engine2.connect(engineGain);engineGain.connect(master);engine1.start();engine2.start();const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),data=buf.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const noise=ac.createBufferSource(),bp=ac.createBiquadFilter(),noiseGain=ac.createGain();noise.buffer=buf;noise.loop=true;bp.type='bandpass';bp.frequency.value=2050;bp.Q.value=.8;noiseGain.gain.value=0;noise.connect(bp);bp.connect(noiseGain);noiseGain.connect(master);noise.start();audio={ac,master,analyser,engineGain,engine1,engine2,noiseGain,lastPhase:'charge'};return audio}
function chirp(level=.24,dur=.08){if(!audio||muted)return;const{ac,master}=audio,o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=1450;g.gain.value=.0001;o.connect(g);g.connect(master);const n=ac.currentTime;g.gain.exponentialRampToValueAtTime(level,n+.008);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.frequency.exponentialRampToValueAtTime(680,n+dur);o.start(n);o.stop(n+dur+.02)}
function updateAudio(){if(!audio)return;const a=audio,n=a.ac.currentTime,phase=PHASES[state.phase];if(muted){a.master.gain.setTargetAtTime(0,n,.015);return}else a.master.gain.setTargetAtTime(.5,n,.015);if(phase!==a.lastPhase){if(phase==='blast')chirp(.22,.09);if(phase==='snap')chirp(.30,.10);if(phase==='exit')chirp(.25,.08);a.lastPhase=phase}let hz=78,eg=.09,ng=.015;if(phase==='charge'){const t=clamp(state.phaseT/.54,0,1);hz=78+165*Math.pow(t,1.55);eg=.09+.10*t;ng=.02+.08*t}else if(phase==='blast'){hz=120+Math.min(state.speed,900)*.26;eg=.21;ng=.025+(state.phaseT<.08?.16*(1-state.phaseT/.08):0)}else if(phase==='snap'){hz=95;eg=.10;ng=.20}else if(phase==='reload'){const t=clamp(state.phaseT/.27,0,1);hz=88+135*Math.pow(t,1.45);eg=.10+.08*t;ng=.015+.055*t}else{hz=130+Math.min(state.speed,1200)*.21;eg=.24;ng=.025+(state.phaseT<.07?.17*(1-state.phaseT/.07):0)}if(!state.running&&state.done){eg=0;ng=0}lastAudioTarget={hz,engine:eg,noise:ng};a.engine1.frequency.setTargetAtTime(hz,n,.018);a.engine2.frequency.setTargetAtTime(hz*2.02,n,.018);a.engineGain.gain.setTargetAtTime(eg,n,.014);a.noiseGain.gain.setTargetAtTime(ng,n,.012)}
function audioRms(){if(!audio)return 0;const data=new Float32Array(audio.analyser.fftSize);audio.analyser.getFloatTimeDomainData(data);let s=0;for(const x of data)s+=x*x;return Math.sqrt(s/data.length)}
function enter(p){state.phase=p;state.phaseT=0;state.speed=0;if(p===1)state.blastStart={x:state.x,y:state.y};if(p===2)state.snapFrontStart=axle(state.x,state.y,state.heading,true);if(p===3)state.reloadStart={x:state.x,y:state.y,h:state.heading};if(p===4)state.exitStart={x:state.x,y:state.y}}
function animate(dt){state.phaseT+=dt;if(state.phase===0){const T=.54;state.x=START.x;state.y=START.y;state.heading=START.heading;state.speed=0;emitSmoke(5,1.55);if(state.phaseT>=T)enter(1)}else if(state.phase===1){const T=.32,D=166,p=2.35,t=clamp(state.phaseT/T,0,1),e=powEase(t,p);state.x=state.blastStart.x;state.y=state.blastStart.y-D*e;state.heading=START.heading;state.speed=(D*p/T)*Math.pow(Math.max(t,.0001),p-1);emitSmoke(t<.55?2:1,.48);if(t>=1)enter(2)}else if(state.phase===2){const T=.16,t=clamp(state.phaseT/T,0,1),e=snapEase(t),h=START.heading+(Math.PI/2)*e;const fp={x:state.snapFrontStart.x+9*e,y:state.snapFrontStart.y-5*e};Object.assign(state,centerFromFront(fp,h),{heading:h});state.speed=0;emitSmoke(2,.72);if(t>=1)enter(3)}else if(state.phase===3){const T=.27;state.x=state.reloadStart.x;state.y=state.reloadStart.y;state.heading=0;state.speed=0;emitSmoke(5,1.4);if(state.phaseT>=T)enter(4)}else{const T=.34,D=235,p=2.55,t=clamp(state.phaseT/T,0,1),e=powEase(t,p);state.x=state.exitStart.x+D*e;state.y=315;state.heading=0;state.speed=(D*p/T)*Math.pow(Math.max(t,.0001),p-1);if(t<.35)emitSmoke(2,.35);if(t>=1||state.x>458){state.running=false;state.done=true;state.completedAt=performance.now();hint.classList.add('hide')}}}
function step(t){if(!state.running&&skidL.length===0&&skidR.length===0&&smoke.length===0)return;if(!last)last=t;const dt=Math.min(.016,(t-last)/1000);last=t;if(state.running)animate(dt);for(const s of smoke){s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=16*dt;s.a*=Math.pow(.90,dt*60)}smoke=smoke.filter(s=>s.a>.012);updateSkids(dt);updateAudio();if(state.running)history.push({t:+(t-state.startedAt).toFixed(1),phase:PHASES[state.phase],x:+state.x.toFixed(2),y:+state.y.toFixed(2),heading:+state.heading.toFixed(5),speed:+state.speed.toFixed(2)});draw();if(state.running||skidL.length||skidR.length||smoke.length)raf=requestAnimationFrame(step)}
function start(){if(state.running||state.done)return;const a=ensureAudio();state.running=true;state.startedAt=performance.now();last=0;skidPrev={L:rearWheel(-1),R:rearWheel(1)};hint.classList.add('hide');if(a){const p=a.ac.resume();updateAudio();chirp(.08,.045);if(p&&p.then)p.then(()=>updateAudio()).catch(()=>{})}raf=requestAnimationFrame(step)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*WORLD.w/r.width,y=(e.clientY-r.top)*WORLD.h/r.height;if(Math.hypot(x-state.x,y-state.y)<72)start()});document.querySelector('#reset').addEventListener('click',reset);muteBtn.addEventListener('click',()=>{ensureAudio();muted=!muted;muteBtn.textContent=muted?'🔇':'🔊';if(audio&&audio.ac.state!=='running')audio.ac.resume();updateAudio()});
window.__v71QA={state:()=>({...state,phaseName:PHASES[state.phase],muted}),history:()=>history.slice(),front:()=>axle(state.x,state.y,state.heading,true),rear:()=>axle(state.x,state.y,state.heading,false),start,reset,skidStats:()=>({left:skidL.length,right:skidR.length,chargeLeft:skidL.filter(s=>s.phase==='charge').length,chargeRight:skidR.filter(s=>s.phase==='charge').length,snapLeft:skidL.filter(s=>s.phase==='snap').length,snapRight:skidR.filter(s=>s.phase==='snap').length,reloadLeft:skidL.filter(s=>s.phase==='reload').length,reloadRight:skidR.filter(s=>s.phase==='reload').length,exitLeft:skidL.filter(s=>s.phase==='exit').length,exitRight:skidR.filter(s=>s.phase==='exit').length,maxAge:Math.max(0,...skidL.map(s=>s.age),...skidR.map(s=>s.age))}),skidData:()=>({left:skidL.map(s=>({...s})),right:skidR.map(s=>({...s}))}),audioState:()=>audio?{context:audio.ac.state,muted,rms:audioRms(),target:lastAudioTarget}:{context:'none',muted,rms:0,target:lastAudioTarget}};reset();resize()})();
