<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#181c1a"><title>Parking Remaster — Snap Drift V4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111412;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#shell{position:relative;width:min(100vw,calc(100vh * 420 / 680),420px);aspect-ratio:420/680;overflow:hidden;background:#202522}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#reset{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(245,245,238,.9);color:#111;font-size:27px;font-weight:800;box-shadow:0 4px 18px #0007}#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.56);color:#fff;font-size:13px;font-weight:800;pointer-events:none;transition:opacity .12s}#hint.hide{opacity:0}</style></head><body><div id="shell"><canvas id="c"></canvas><button id="reset">↻</button><div id="hint">TAP THE CAR</div></div><script>
(()=>{const canvas=document.querySelector('#c'),shell=document.querySelector('#shell'),hint=document.querySelector('#hint'),ctx=canvas.getContext('2d',{alpha:false});
const WORLD={w:420,h:680},CAR={length:98,width:46,wheelbase:68},START={x:156,y:520,heading:-Math.PI/2};
const PHASES=['prekick','blast','catch','exit'];let state,raf,last=0,history=[],smoke=[],marks=[];
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const easeInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function axlePoint(x,y,h,front=true){const d=(front?1:-1)*CAR.wheelbase/2;return{x:x+Math.cos(h)*d,y:y+Math.sin(h)*d}}
function centerFromFront(px,py,h){return{x:px-Math.cos(h)*CAR.wheelbase/2,y:py-Math.sin(h)*CAR.wheelbase/2}}
function reset(){cancelAnimationFrame(raf);state={x:START.x,y:START.y,heading:START.heading,phase:0,phaseT:0,running:false,done:false,startedAt:null,completedAt:null,frontPivot:null,launchStart:null,catchPivot:null,smokeCount:0,maxSlip:0};history=[];smoke=[];marks=[];last=0;hint.classList.remove('hide');draw()}
function resize(){const r=shell.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw()}addEventListener('resize',resize,{passive:true});
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawLot(){const g=ctx.createLinearGradient(0,0,0,WORLD.h);g.addColorStop(0,'#59605c');g.addColorStop(.5,'#444a47');g.addColorStop(1,'#343936');ctx.fillStyle=g;ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.save();ctx.globalAlpha=.11;for(let i=0;i<580;i++){const x=i*89%419,y=i*157%679,v=40+(i*41%52);ctx.fillStyle=`rgb(${v},${v+2},${v+1})`;ctx.fillRect(x,y,1.1,1.1)}ctx.restore();ctx.fillStyle='#c8c2b6';ctx.fillRect(0,72,WORLD.w,18);ctx.fillStyle='#85827b';ctx.fillRect(0,90,WORLD.w,5);ctx.fillStyle='rgba(255,255,255,.028)';ctx.fillRect(0,286,WORLD.w,170);ctx.strokeStyle='rgba(244,240,220,.9)';ctx.lineWidth=4;ctx.lineCap='round';for(const x of [82,156,230,304]){ctx.beginPath();ctx.moveTo(x,445);ctx.lineTo(x,625);ctx.stroke()}ctx.beginPath();ctx.moveTo(82,445);ctx.lineTo(304,445);ctx.stroke();ctx.fillStyle='#aaa59b';for(const x of [119,193,267]){rr(x-20,590,40,8,3);ctx.fill()}ctx.strokeStyle='rgba(244,240,220,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(344,286);ctx.lineTo(344,456);ctx.stroke()}
function rearWheel(side){const r=axlePoint(state.x,state.y,state.heading,false),lat=side*(CAR.width/2-2),nx=-Math.sin(state.heading),ny=Math.cos(state.heading);return{x:r.x+nx*lat,y:r.y+ny*lat}}
function emitSmoke(n=2,strong=1){for(let i=0;i<n;i++){const p=rearWheel(i%2?1:-1);smoke.push({x:p.x+(i%2?2:-2),y:p.y,r:3.2+((history.length+i)%3),a:.28*strong,vx:(i%2?8:-8),vy:-8-((history.length+i)%6)});state.smokeCount++;if(smoke.length>150)smoke.shift()}}
function addMark(){for(const side of [-1,1]){const p=rearWheel(side);marks.push({x:p.x,y:p.y,a:.2});if(marks.length>520)marks.shift()}}
function drawMarks(){ctx.save();ctx.fillStyle='rgba(18,18,16,.23)';for(const m of marks){ctx.beginPath();ctx.arc(m.x,m.y,2.1,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawSmoke(){ctx.save();for(const s of smoke){ctx.globalAlpha=s.a;ctx.fillStyle='#e0e2df';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.restore()}
function drawShadow(){ctx.save();ctx.translate(state.x+6,state.y+8);ctx.rotate(state.heading+Math.PI/2);ctx.filter='blur(7px)';ctx.globalAlpha=.31;ctx.fillStyle='#000';rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.restore();ctx.filter='none'}
function drawCar(){ctx.save();ctx.translate(state.x,state.y);ctx.rotate(state.heading+Math.PI/2);const axle=CAR.wheelbase/2,ww=8,wh=19;let steer=0;if(state.phase===0)steer=-.18;if(state.phase===2)steer=.52;ctx.fillStyle='#111';for(const side of [-1,1]){ctx.save();ctx.translate(side*(CAR.width/2-1),-axle);ctx.rotate(steer);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore();ctx.fillRect(side*(CAR.width/2-1)-ww/2,axle-wh/2,ww,wh)}const body=ctx.createLinearGradient(-CAR.width/2,0,CAR.width/2,0);body.addColorStop(0,'#69090e');body.addColorStop(.16,'#b4141b');body.addColorStop(.52,'#f23f47');body.addColorStop(.83,'#ad1218');body.addColorStop(1,'#5d080c');ctx.fillStyle=body;rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.2;ctx.stroke();const glass=ctx.createLinearGradient(0,-31,0,24);glass.addColorStop(0,'#bfd8dc');glass.addColorStop(.43,'#657f85');glass.addColorStop(1,'#25373b');ctx.fillStyle=glass;rr(-15,-30,30,49,8);ctx.fill();ctx.fillStyle='#f5efd6';ctx.fillRect(-15,-CAR.length/2+4,10,4);ctx.fillRect(5,-CAR.length/2+4,10,4);ctx.fillStyle=(state.phase<2)?'#ff3131':'#8d0c10';ctx.fillRect(-15,CAR.length/2-8,10,4);ctx.fillRect(5,CAR.length/2-8,10,4);ctx.restore()}
function draw(){ctx.setTransform(canvas.width/WORLD.w,0,0,canvas.height/WORLD.h,0,0);drawLot();drawMarks();drawSmoke();drawShadow();drawCar();if(!state.running&&!state.done){ctx.strokeStyle='rgba(255,216,70,.88)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(state.x,state.y,CAR.width*.84,CAR.length*.61,0,0,Math.PI*2);ctx.stroke()}}
function enterPhase(p){state.phase=p;state.phaseT=0;if(p===0)state.frontPivot=axlePoint(state.x,state.y,state.heading,true);if(p===1)state.launchStart={x:state.x,y:state.y,h:state.heading};if(p===2)state.catchPivot=axlePoint(state.x,state.y,state.heading,true)}
function animate(dt){state.phaseT+=dt;
 if(state.phase===0){ // almost stationary rear kick around planted front axle
   const T=.16,t=clamp(state.phaseT/T,0,1),e=easeOutBack(t),h=START.heading+(.50*e);
   const p={x:state.frontPivot.x+2.5*t,y:state.frontPivot.y-1.5*t};Object.assign(state,centerFromFront(p.x,p.y,h),{heading:h});
   emitSmoke(3,1.25);addMark();if(t>=1)enterPhase(1);
 }else if(state.phase===1){ // body stays crossed-up while velocity shoots straight
   const T=.30,t=clamp(state.phaseT/T,0,1),e=easeInOut(t);
   state.x=state.launchStart.x+8*e;state.y=state.launchStart.y-112*e;state.heading=state.launchStart.h+.015*Math.sin(t*Math.PI);
   emitSmoke(2,1);addMark();if(t>=1)enterPhase(2);
 }else if(state.phase===2){ // front axle nearly anchors while rear snaps into exit attitude
   const T=.19,t=clamp(state.phaseT/T,0,1),e=easeOutBack(t),h=state.launchStart.h+(0-state.launchStart.h)*e;
   const p={x:state.catchPivot.x+27*e,y:state.catchPivot.y-3*e};Object.assign(state,centerFromFront(p.x,p.y,h),{heading:h});
   emitSmoke(1,.65);addMark();if(t>=1)enterPhase(3);
 }else{ // immediate straight blast
   const T=.46,t=clamp(state.phaseT/T,0,1),e=1-Math.pow(1-t,2.1);state.x+=520*dt;state.y+=(322-state.y)*(1-Math.pow(.18,dt*60));state.heading*=Math.pow(.15,dt*60);
   if(state.x>458){state.running=false;state.done=true;state.completedAt=performance.now();hint.classList.add('hide')}
 }
}
function step(t){if(!state.running)return;if(!last)last=t;const dt=Math.min(.018,(t-last)/1000);last=t;animate(dt);for(const s of smoke){s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=11*dt;s.a*=Math.pow(.84,dt*60)}smoke=smoke.filter(s=>s.a>.012);const vel=history.length?{x:(state.x-history.at(-1).x)/dt,y:(state.y-history.at(-1).y)/dt}:{x:0,y:0};const speed=Math.hypot(vel.x,vel.y);const slip=speed>20?Math.abs(Math.atan2(vel.y,vel.x)-state.heading):0;state.maxSlip=Math.max(state.maxSlip,slip);history.push({t:+(t-state.startedAt).toFixed(1),phase:PHASES[state.phase],x:+state.x.toFixed(2),y:+state.y.toFixed(2),heading:+state.heading.toFixed(4),vx:+vel.x.toFixed(1),vy:+vel.y.toFixed(1),slip:+slip.toFixed(3)});draw();if(state.running)raf=requestAnimationFrame(step)}
function start(){if(state.running||state.done)return;state.running=true;state.startedAt=performance.now();last=0;hint.classList.add('hide');enterPhase(0);raf=requestAnimationFrame(step)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*WORLD.w/r.width,y=(e.clientY-r.top)*WORLD.h/r.height;if(Math.hypot(x-state.x,y-state.y)<72)start()});document.querySelector('#reset').addEventListener('click',reset);
window.__snapDriftQA={state:()=>({...state,phaseName:PHASES[state.phase]}),history:()=>history.slice(),front:()=>axlePoint(state.x,state.y,state.heading,true),rear:()=>axlePoint(state.x,state.y,state.heading,false),start,reset};reset();resize()})();
</script></body></html>
