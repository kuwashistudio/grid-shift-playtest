<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#202522"><title>Parking Remaster — Reverse Cutback Prototype</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151917;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}body{display:grid;place-items:center}#shell{position:relative;width:min(100vw,calc(100vh * 420 / 680),420px);aspect-ratio:420/680;overflow:hidden;background:#222}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#reset{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(245,245,238,.88);color:#161a18;font-size:27px;font-weight:700;box-shadow:0 4px 18px #0006}#reset:active{transform:scale(.94)}#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.52);color:#fff;font-size:13px;font-weight:800;letter-spacing:.02em;pointer-events:none;transition:opacity .22s}#hint.hide{opacity:0}
</style></head><body><div id="shell"><canvas id="c" aria-label="Reverse and turn parking prototype"></canvas><button id="reset" aria-label="Reset prototype">↻</button><div id="hint">TAP THE CAR</div></div><script>
(()=>{const canvas=document.querySelector('#c'),shell=document.querySelector('#shell'),hint=document.querySelector('#hint'),ctx=canvas.getContext('2d',{alpha:false});
const WORLD={w:420,h:680},CAR={length:96,width:45,wheelbase:67,maxSteer:30*Math.PI/180},START={x:260,y:520,heading:Math.PI/2},PHASES=['reverse_straight','reverse_swing','shift','forward_countersteer','exit'];let state,raf,last=0,history=[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),norm=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
function reset(){cancelAnimationFrame(raf);state={x:START.x,y:START.y,heading:START.heading,speed:0,steer:0,phase:0,running:false,done:false,shiftTime:0,maxSteerSeen:0,startedAt:null,completedAt:null};history=[];last=0;hint.textContent='TAP THE CAR';hint.classList.remove('hide');draw()}
function resize(){const r=shell.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw()} addEventListener('resize',resize,{passive:true});
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawLot(){const g=ctx.createLinearGradient(0,0,0,WORLD.h);g.addColorStop(0,'#5a605d');g.addColorStop(.52,'#454b48');g.addColorStop(1,'#343936');ctx.fillStyle=g;ctx.fillRect(0,0,WORLD.w,WORLD.h);ctx.save();ctx.globalAlpha=.12;for(let i=0;i<560;i++){const x=i*97%419,y=i*163%679,v=38+(i*31%58);ctx.fillStyle=`rgb(${v},${v+3},${v+1})`;ctx.fillRect(x,y,1.15,1.15)}ctx.restore();ctx.fillStyle='#cbc5b8';ctx.fillRect(0,72,WORLD.w,18);ctx.fillStyle='#85847d';ctx.fillRect(0,89,WORLD.w,5);ctx.fillStyle='rgba(255,255,255,.035)';ctx.fillRect(0,300,WORLD.w,145);ctx.strokeStyle='rgba(244,240,220,.9)';ctx.lineWidth=4;ctx.lineCap='round';for(const x of [150,224,298,372]){ctx.beginPath();ctx.moveTo(x,445);ctx.lineTo(x,625);ctx.stroke()}ctx.beginPath();ctx.moveTo(150,445);ctx.lineTo(372,445);ctx.stroke();ctx.fillStyle='#aaa59b';for(const x of [187,261,335]){rr(x-20,590,40,8,3);ctx.fill()}ctx.fillStyle='rgba(20,20,18,.36)';for(const x of [187,261,335])ctx.fillRect(x-19,599,38,3);ctx.strokeStyle='rgba(244,240,220,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(365,300);ctx.lineTo(365,445);ctx.stroke();ctx.fillStyle='rgba(244,240,220,.22)';for(const x of [310,355,400]){ctx.beginPath();ctx.moveTo(x+18,371);ctx.lineTo(x+3,359);ctx.lineTo(x+3,366);ctx.lineTo(x-14,366);ctx.lineTo(x-14,376);ctx.lineTo(x+3,376);ctx.lineTo(x+3,383);ctx.closePath();ctx.fill()}}
function drawShadow(){ctx.save();ctx.translate(state.x+5,state.y+8);ctx.rotate(state.heading+Math.PI/2);ctx.filter='blur(7px)';ctx.globalAlpha=.30;ctx.fillStyle='#000';rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.restore();ctx.filter='none'}
function drawCar(){ctx.save();ctx.translate(state.x,state.y);ctx.rotate(state.heading+Math.PI/2);const axle=CAR.wheelbase/2,ww=8,wh=19;ctx.fillStyle='#111';for(const side of [-1,1]){ctx.save();ctx.translate(side*(CAR.width/2-1),-axle);ctx.rotate(state.steer);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore();ctx.save();ctx.translate(side*(CAR.width/2-1),axle);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore()}const body=ctx.createLinearGradient(-CAR.width/2,0,CAR.width/2,0);body.addColorStop(0,'#761014');body.addColorStop(.18,'#bd171d');body.addColorStop(.5,'#ec3940');body.addColorStop(.82,'#b31419');body.addColorStop(1,'#650b10');ctx.fillStyle=body;rr(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.26)';ctx.lineWidth=1.25;ctx.stroke();const glass=ctx.createLinearGradient(0,-32,0,25);glass.addColorStop(0,'#b9d0d5');glass.addColorStop(.42,'#607980');glass.addColorStop(1,'#26383d');ctx.fillStyle=glass;rr(-15,-30,30,49,8);ctx.fill();ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-13,-25,26,2);ctx.strokeStyle='rgba(55,0,0,.42)';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-17,-35);ctx.lineTo(17,-35);ctx.moveTo(-17,32);ctx.lineTo(17,32);ctx.stroke();ctx.fillStyle='#f3edd4';ctx.fillRect(-15,-CAR.length/2+4,10,4);ctx.fillRect(5,-CAR.length/2+4,10,4);const backing=state.speed<-1,shifting=state.phase===2;ctx.fillStyle=shifting?'#ff2828':'#9c1014';ctx.fillRect(-15,CAR.length/2-8,10,4);ctx.fillRect(5,CAR.length/2-8,10,4);if(backing){ctx.fillStyle='#f5f1df';ctx.fillRect(-4,CAR.length/2-8,8,4)}ctx.restore()}
function draw(){ctx.setTransform(canvas.width/WORLD.w,0,0,canvas.height/WORLD.h,0,0);drawLot();drawShadow();drawCar();if(!state.running&&!state.done){ctx.strokeStyle='rgba(255,216,70,.88)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(state.x,state.y,CAR.width*.84,CAR.length*.61,0,0,Math.PI*2);ctx.stroke()}}
function setPhase(p){state.phase=p;state.shiftTime=0}
function controls(dt){let targetSpeed=0,targetSteer=0;if(state.phase===0){targetSpeed=-65;if(state.y<455)setPhase(1)}else if(state.phase===1){targetSpeed=-58;targetSteer=26*Math.PI/180;if(state.heading<.92||state.y<365)setPhase(2)}else if(state.phase===2){state.shiftTime+=dt;if(Math.abs(state.speed)<2&&state.shiftTime>.50)setPhase(3)}else if(state.phase===3){targetSpeed=68;targetSteer=-28*Math.PI/180;if(state.heading<.18)setPhase(4)}else targetSpeed=90;return {targetSpeed,targetSteer}}
function step(t){if(!state.running)return;if(!last)last=t;const dt=Math.min(.025,(t-last)/1000);last=t;const {targetSpeed,targetSteer}=controls(dt);state.steer+=(targetSteer-state.steer)*Math.min(1,dt*6);state.maxSteerSeen=Math.max(state.maxSteerSeen,Math.abs(state.steer));state.speed+=clamp(targetSpeed-state.speed,-120*dt,120*dt);state.heading=norm(state.heading+state.speed/CAR.wheelbase*Math.tan(state.steer)*dt);state.x+=Math.cos(state.heading)*state.speed*dt;state.y+=Math.sin(state.heading)*state.speed*dt;history.push({t:+(t-state.startedAt).toFixed(1),phase:PHASES[state.phase],x:+state.x.toFixed(2),y:+state.y.toFixed(2),heading:+state.heading.toFixed(4),speed:+state.speed.toFixed(2),steer:+state.steer.toFixed(4)});if(state.phase===4&&state.x>452){state.running=false;state.done=true;state.speed=0;state.completedAt=t;hint.classList.add('hide');draw();return}draw();raf=requestAnimationFrame(step)}
function start(){if(state.running||state.done)return;state.running=true;state.startedAt=performance.now();last=0;hint.classList.add('hide');raf=requestAnimationFrame(step)}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*WORLD.w/r.width,y=(e.clientY-r.top)*WORLD.h/r.height;if(Math.hypot(x-state.x,y-state.y)<72)start()});document.querySelector('#reset').addEventListener('click',reset);
window.__reverseCutbackQA={state:()=>({...state,phaseName:PHASES[state.phase]}),history:()=>history.slice(),start,reset,constants:{WORLD,CAR,START,PHASES}};reset();resize()})();
</script></body></html>
