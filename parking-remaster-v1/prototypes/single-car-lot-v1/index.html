<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#202522">
<title>Parking Remaster — Single Car Motion Prototype</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161a18;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation}
body{display:grid;place-items:center}
#shell{position:relative;width:min(100vw,430px);height:min(100vh,760px);overflow:hidden;background:#222}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#reset{position:absolute;right:14px;top:max(14px,env(safe-area-inset-top));width:48px;height:48px;border:0;border-radius:50%;background:rgba(245,245,238,.88);color:#161a18;font-size:27px;font-weight:700;box-shadow:0 4px 18px #0006;opacity:.9}
#reset:active{transform:scale(.94)}
#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:rgba(0,0,0,.52);color:#fff;font-size:13px;font-weight:700;letter-spacing:.02em;pointer-events:none;transition:opacity .25s}
#hint.hide{opacity:0}
</style>
</head>
<body>
<div id="shell">
<canvas id="c" aria-label="Single car parking motion prototype"></canvas>
<button id="reset" aria-label="Reset prototype">↻</button>
<div id="hint">TAP THE CAR</div>
</div>
<script>
(()=>{
const canvas=document.querySelector('#c'),shell=document.querySelector('#shell'),hint=document.querySelector('#hint');
const ctx=canvas.getContext('2d',{alpha:false});
const WORLD={w:420,h:680};
const CAR={length:94,width:44,wheelbase:66,maxSteer:30*Math.PI/180};
const START={x:120,y:508,heading:-Math.PI/2};
const PATH=[[120,508],[120,445],[120,380],[124,330],[142,286],[178,252],[230,232],[300,228],[375,228],[470,228]];
let state,raf,last=0,history=[];

function reset(){
  state={x:START.x,y:START.y,heading:START.heading,speed:0,steer:0,running:false,done:false,target:1,maxSteerSeen:0,startedAt:null,completedAt:null};
  history=[];
  hint.classList.remove('hide');
  draw();
}
function resize(){
  const r=shell.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
  ctx.setTransform(canvas.width/WORLD.w,0,0,canvas.height/WORLD.h,0,0);
  draw();
}
addEventListener('resize',resize,{passive:true});

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function norm(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function roundedRect(x,y,w,h,r){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
}
function drawLot(){
  const g=ctx.createLinearGradient(0,0,0,WORLD.h);
  g.addColorStop(0,'#555b58');g.addColorStop(.55,'#414744');g.addColorStop(1,'#323735');
  ctx.fillStyle=g;ctx.fillRect(0,0,WORLD.w,WORLD.h);
  // deterministic asphalt grain
  ctx.save();ctx.globalAlpha=.14;
  for(let i=0;i<520;i++){
    const x=(i*73%419)+((i%7)*.17),y=(i*151%679),v=42+(i*29%55);
    ctx.fillStyle=`rgb(${v},${v+2},${v+1})`;ctx.fillRect(x,y,1.1,1.1);
  }
  ctx.restore();
  // curb / boundary
  ctx.fillStyle='#c8c3b8';ctx.fillRect(0,70,WORLD.w,18);
  ctx.fillStyle='#8c8981';ctx.fillRect(0,86,WORLD.w,5);
  // drive aisle
  ctx.fillStyle='rgba(255,255,255,.035)';ctx.fillRect(0,170,WORLD.w,145);
  // parking bays
  ctx.strokeStyle='rgba(243,239,220,.88)';ctx.lineWidth=4;ctx.lineCap='round';
  const xs=[46,120,194,268];
  for(const x of xs){ctx.beginPath();ctx.moveTo(x,338);ctx.lineTo(x,625);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(46,338);ctx.lineTo(268,338);ctx.stroke();
  // exit throat
  ctx.strokeStyle='rgba(243,239,220,.72)';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(330,170);ctx.lineTo(330,315);ctx.stroke();
  // subtle directional chevrons
  ctx.fillStyle='rgba(244,240,220,.20)';
  for(const x of [300,350,400]){ctx.beginPath();ctx.moveTo(x-12,224);ctx.lineTo(x+3,214);ctx.lineTo(x+3,222);ctx.lineTo(x+18,222);ctx.lineTo(x+18,234);ctx.lineTo(x+3,234);ctx.lineTo(x+3,242);ctx.closePath();ctx.fill()}
  // parked-space wheel stops
  ctx.fillStyle='#9a968d';
  for(const x of [83,157,231]){ctx.fillRect(x-18,588,36,7)}
}
function drawShadow(){
  ctx.save();ctx.translate(state.x+5,state.y+8);ctx.rotate(state.heading+Math.PI/2);
  ctx.filter='blur(7px)';ctx.globalAlpha=.32;ctx.fillStyle='#000';roundedRect(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,13);ctx.fill();
  ctx.restore();ctx.filter='none';
}
function drawCar(){
  ctx.save();ctx.translate(state.x,state.y);ctx.rotate(state.heading+Math.PI/2);
  // wheels, front pair steers
  const axle=CAR.wheelbase/2,ww=8,wh=19;
  ctx.fillStyle='#111';
  for(const side of [-1,1]){
    ctx.save();ctx.translate(side*(CAR.width/2-1),-axle);ctx.rotate(state.steer);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore();
    ctx.save();ctx.translate(side*(CAR.width/2-1),axle);ctx.fillRect(-ww/2,-wh/2,ww,wh);ctx.restore();
  }
  // body
  let bg=ctx.createLinearGradient(-CAR.width/2,0,CAR.width/2,0);
  bg.addColorStop(0,'#8f1115');bg.addColorStop(.18,'#d8242b');bg.addColorStop(.52,'#ef4147');bg.addColorStop(.82,'#ba141a');bg.addColorStop(1,'#741014');
  ctx.fillStyle=bg;roundedRect(-CAR.width/2,-CAR.length/2,CAR.width,CAR.length,14);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1.3;ctx.stroke();
  // glass cabin
  let gg=ctx.createLinearGradient(0,-30,0,24);gg.addColorStop(0,'#b9d2d7');gg.addColorStop(.45,'#668088');gg.addColorStop(1,'#293b40');
  ctx.fillStyle=gg;roundedRect(-15,-29,30,48,8);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.20)';ctx.fillRect(-13,-24,26,2);
  // hood/trunk seams
  ctx.strokeStyle='rgba(65,0,0,.45)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(-17,-34);ctx.lineTo(17,-34);ctx.moveTo(-17,31);ctx.lineTo(17,31);ctx.stroke();
  // lights
  ctx.fillStyle='#f8efd1';ctx.fillRect(-15,-CAR.length/2+4,10,4);ctx.fillRect(5,-CAR.length/2+4,10,4);
  ctx.fillStyle='#8a0c0f';ctx.fillRect(-15,CAR.length/2-8,10,4);ctx.fillRect(5,CAR.length/2-8,10,4);
  ctx.restore();
}
function draw(){
  ctx.save();ctx.setTransform(canvas.width/WORLD.w,0,0,canvas.height/WORLD.h,0,0);
  drawLot();drawShadow();drawCar();
  if(!state.running&&!state.done){
    ctx.strokeStyle='rgba(255,216,70,.88)';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(state.x,state.y,CAR.width*.82,CAR.length*.62,0,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
}
function step(t){
  if(!state.running)return;
  if(!last)last=t;let dt=Math.min(.025,(t-last)/1000);last=t;
  const target=PATH[Math.min(state.target,PATH.length-1)];
  const dx=target[0]-state.x,dy=target[1]-state.y,dist=Math.hypot(dx,dy);
  if(dist<34&&state.target<PATH.length-1)state.target++;
  const look=PATH[Math.min(state.target+1,PATH.length-1)];
  const desired=Math.atan2(look[1]-state.y,look[0]-state.x);
  const err=norm(desired-state.heading);
  const targetSteer=clamp(err*1.55,-CAR.maxSteer,CAR.maxSteer);
  state.steer+=(targetSteer-state.steer)*Math.min(1,dt*5.7);
  state.maxSteerSeen=Math.max(state.maxSteerSeen,Math.abs(state.steer));
  let targetSpeed=92-(Math.abs(state.steer)/CAR.maxSteer)*24;
  if(state.target>=PATH.length-1)targetSpeed=98;
  state.speed+=clamp(targetSpeed-state.speed,-125*dt,105*dt);
  // bicycle model: no independent lateral translation
  state.heading+=state.speed/CAR.wheelbase*Math.tan(state.steer)*dt;
  state.x+=Math.cos(state.heading)*state.speed*dt;
  state.y+=Math.sin(state.heading)*state.speed*dt;
  history.push({t:+(t-state.startedAt).toFixed(1),x:+state.x.toFixed(2),y:+state.y.toFixed(2),heading:+state.heading.toFixed(4),speed:+state.speed.toFixed(2),steer:+state.steer.toFixed(4)});
  if(state.x>452){
    state.running=false;state.done=true;state.speed=0;state.completedAt=t;hint.textContent='↻  RESET TO RUN AGAIN';hint.classList.remove('hide');draw();return;
  }
  draw();raf=requestAnimationFrame(step);
}
function start(){
  if(state.running||state.done)return;
  state.running=true;state.startedAt=performance.now();last=0;hint.classList.add('hide');raf=requestAnimationFrame(step);
}
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*WORLD.w/r.width,y=(e.clientY-r.top)*WORLD.h/r.height;
  if(Math.hypot(x-state.x,y-state.y)<70)start();
});
document.querySelector('#reset').addEventListener('click',()=>{cancelAnimationFrame(raf);last=0;reset()});
window.__singleCarQA={
  state:()=>({...state}),
  history:()=>history.slice(),
  start,reset,
  constants:{WORLD,CAR,START,PATH}
};
reset();resize();
})();
</script>
</body>
</html>
