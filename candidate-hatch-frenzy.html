<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>HATCH FRENZY</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#170e2c;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}body{min-height:100vh;display:grid;place-items:center}.app{width:min(100vw,460px);height:100vh;max-height:900px;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;background:radial-gradient(circle at 50% 25%,#4b246f,#170e2c 58%)}.top{height:64px;display:flex;justify-content:space-between;align-items:center}.score{font-size:32px;font-weight:950}.stageNo{font-size:18px;opacity:.75}.arena{position:relative;flex:1;display:grid;place-items:center}.timer{position:absolute;width:min(84vw,370px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#53f2a2 var(--p,100%),#ffffff13 0);filter:drop-shadow(0 20px 28px #0007)}.timer:before{content:'';position:absolute;inset:14px;border-radius:50%;background:#21133e}.egg{position:relative;z-index:4;width:min(58vw,245px);aspect-ratio:.76;border:0;border-radius:50% 50% 47% 47%/58% 58% 42% 42%;background:radial-gradient(circle at 34% 26%,#fff 0 8%,#f7edf9 9% 26%,#f4b8ef 27% 62%,#9f4ab4 63% 100%);box-shadow:0 0 50px #ff7ee988,inset 0 -20px 0 #0001;display:grid;place-items:center;font-size:80px;transition:transform .06s}.egg:active{transform:scale(.94)}.crack{position:absolute;z-index:5;font-size:64px;pointer-events:none;opacity:0}.fever{position:absolute;bottom:7%;width:48%;height:8px;border-radius:10px;background:#ffffff14;overflow:hidden;z-index:6}.feverBar{height:100%;width:0;background:#61e8ff;transition:width .12s}.hp{position:absolute;bottom:12%;width:62%;height:18px;border-radius:20px;background:#ffffff18;overflow:hidden;z-index:6}.bar{height:100%;width:100%;background:#ffd94e;transition:width .12s}.finger{position:absolute;z-index:8;left:61%;top:55%;font-size:58px;animation:tap 1s infinite;pointer-events:none;filter:drop-shadow(0 4px 2px #0008)}.float{position:absolute;z-index:12;font-size:30px;font-weight:1000;pointer-events:none;animation:float .55s forwards}.upgrade{position:absolute;z-index:16;font-size:48px;font-weight:1000;opacity:0;pointer-events:none}.upgrade.show{animation:hatch .95s}.hatch{position:absolute;z-index:15;font-size:110px;opacity:0;pointer-events:none}.hatch.show{animation:hatch .95s}.bug{position:absolute;z-index:20;width:56px;height:56px;border:0;border-radius:50%;background:#ffd94e;display:none;font-size:28px;box-shadow:0 0 25px #ffd94e;animation:buzz .65s ease-in-out infinite alternate}.overlay{position:absolute;inset:0;background:#0c0719ed;z-index:30;display:none;place-items:center}.overlay.show{display:grid}.panel{text-align:center}.big{font-size:44px;font-weight:1000}.again{margin-top:18px;width:116px;height:116px;border:0;border-radius:50%;background:white;font-size:64px}.power{font-size:17px;opacity:.8}.best{font-size:13px;opacity:.45;margin-top:2px}.collection{position:absolute;top:4%;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:7;min-height:26px}.collection span{font-size:22px;filter:drop-shadow(0 3px 2px #0007)}@keyframes tap{50%{transform:translateY(12px) scale(.88)}}@keyframes float{100%{transform:translateY(-90px) scale(1.35);opacity:0}}@keyframes hatch{0%{opacity:0;transform:scale(.3) rotate(-20deg)}35%{opacity:1;transform:scale(1.25) rotate(8deg)}100%{opacity:0;transform:scale(.8) translateY(-110px)}}@keyframes buzz{from{transform:translate(-8px,-6px) rotate(-8deg)}to{transform:translate(8px,8px) rotate(8deg)}}
</style></head><body><div class='app'><div class='top'><div><div class='score' id='score'>0</div><div class='power' id='power'>●</div><div class='best' id='bestMark'></div></div><div class='stageNo' id='stageNo'>🥚</div></div><div class='arena' id='arena'><div class='collection' id='collection'></div><div class='timer' id='timer'></div><button class='egg' id='egg' aria-label='tap'>🥚</button><div class='crack' id='crack'>⚡</div><div class='hp'><div class='bar' id='bar'></div></div><div class='fever'><div class='feverBar' id='feverBar'></div></div><div class='finger' id='finger'>☝</div><button class='bug' id='bug'>★</button><div class='upgrade' id='upgrade'>×2</div><div class='hatch' id='hatch'>🐣</div><div class='overlay' id='overlay'><div class='panel'><div class='big' id='endScore'>0</div><button class='again' id='again'>↻</button></div></div></div></div><script>
(()=>{'use strict';const arena=document.querySelector('#arena'),collection=document.querySelector('#collection'),timer=document.querySelector('#timer'),egg=document.querySelector('#egg'),bar=document.querySelector('#bar'),feverBar=document.querySelector('#feverBar'),finger=document.querySelector('#finger'),bug=document.querySelector('#bug'),hatch=document.querySelector('#hatch'),upgrade=document.querySelector('#upgrade'),scoreEl=document.querySelector('#score'),powerEl=document.querySelector('#power'),bestMark=document.querySelector('#bestMark'),stageEl=document.querySelector('#stageNo'),overlay=document.querySelector('#overlay'),endScore=document.querySelector('#endScore'),again=document.querySelector('#again'),crack=document.querySelector('#crack');let score=0,stage=1,power=1,hp=10,maxHp=10,time=6500,start=0,raf=0,alive=false,taps=0,bugTimer=0,heat=0,lastTap=0,feverUntil=0;const hatchlings=['🐣','🐸','🐙','🦊','🐲','👾','🤖','🦄'];const skins=['radial-gradient(circle at 34% 26%,#fff 0 8%,#f7edf9 9% 26%,#f4b8ef 27% 62%,#9f4ab4 63% 100%)','radial-gradient(circle at 32% 25%,#fff 0 7%,#d9fff2 8% 22%,#6ee7b7 23% 60%,#157f66 61% 100%)','radial-gradient(circle at 34% 26%,#fff 0 7%,#e4efff 8% 22%,#6ea8ff 23% 60%,#2854b5 61% 100%)','radial-gradient(circle at 34% 26%,#fff 0 7%,#fff1b8 8% 22%,#ffb84d 23% 60%,#d9582c 61% 100%)','radial-gradient(circle at 34% 26%,#fff 0 7%,#f6e3ff 8% 22%,#b56cff 23% 60%,#5d2c91 61% 100%)'];let owned=[];function sfx(f=500,d=.05){try{const A=window.AudioContext||window.webkitAudioContext;const a=sfx.a||(sfx.a=new A());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function safeGet(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}}function safeSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}function setup(){alive=true;taps=0;maxHp=stage===1?6:7+stage*4;hp=maxHp;time=Math.max(3200,7800-stage*260);bar.style.width='100%';stageEl.textContent=(stage%5===0?'👑':'🥚'.repeat(Math.min(stage,5)));powerEl.textContent='●'.repeat(Math.min(power,7));bestMark.textContent='★ '+safeGet('hatch_best');finger.style.display=stage===1?'block':'none';heat=0;feverUntil=0;feverBar.style.width='0';bug.style.display='none';egg.textContent=stage%5===0?'✦':'🥚';egg.style.background=skins[(stage-1)%skins.length];egg.style.boxShadow=stage%5===0?'0 0 70px #ffd94e,inset 0 -20px 0 #0001':'0 0 50px #ff7ee988,inset 0 -20px 0 #0001';start=performance.now();cancelAnimationFrame(raf);clearTimeout(bugTimer);scheduleBug();raf=requestAnimationFrame(loop)}function tapEgg(ev){if(!alive)return;finger.style.display='none';const now=performance.now();heat=now-lastTap<260?Math.min(8,heat+1):Math.max(1,heat-2);lastTap=now;if(heat>=8){feverUntil=now+1800;heat=0;sfx(1050,.12)}feverBar.style.width=(heat/8*100)+'%';damage(power*(now<feverUntil?2:1),ev?.clientX,ev?.clientY)}function damage(d,x,y){hp=Math.max(0,hp-d);taps++;score+=d;scoreEl.textContent=score;bar.style.width=(hp/maxHp*100)+'%';egg.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(.92) rotate(-3deg)'},{transform:'scale(1.05) rotate(2deg)'},{transform:'scale(1)'}],{duration:150});crack.style.opacity=Math.random()>.45?'1':'0';setTimeout(()=>crack.style.opacity='0',90);floatText('+'+d,x,y);sfx(420+Math.min(600,taps*12),.04);if(hp<=0)win()}function floatText(txt,x,y){const e=document.createElement('div');e.className='float';e.textContent=txt;const r=egg.getBoundingClientRect(),a=arena.getBoundingClientRect();e.style.left=((x||r.left+r.width*.55)-a.left)+'px';e.style.top=((y||r.top+r.height*.4)-a.top)+'px';arena.appendChild(e);setTimeout(()=>e.remove(),600)}function scheduleBug(){if(stage===1)return;bugTimer=setTimeout(()=>{if(!alive)return;bug.style.display='block';bug.style.left=(12+Math.random()*70)+'%';bug.style.top=(16+Math.random()*55)+'%';setTimeout(()=>{bug.style.display='none';if(alive)scheduleBug()},1200)},1800+Math.random()*1400)}function bugTap(ev){if(!alive)return;ev.stopPropagation();bug.style.display='none';start+=850;timer.animate([{filter:'brightness(1)'},{filter:'brightness(2) hue-rotate(80deg)'},{filter:'brightness(1)'}],{duration:420});damage(Math.max(3,power*3),ev.clientX,ev.clientY);sfx(900,.08);scheduleBug()}function win(){alive=false;cancelAnimationFrame(raf);clearTimeout(bugTimer);bug.style.display='none';score+=50+stage*12;scoreEl.textContent=score;const born=hatchlings[(stage-1)%hatchlings.length];hatch.textContent=born;owned.push(born);collection.innerHTML=owned.slice(-6).map(x=>'<span>'+x+'</span>').join('');hatch.classList.remove('show');void hatch.offsetWidth;hatch.classList.add('show');sfx(760,.2);if(stage%3===0){power++;upgrade.textContent='●'.repeat(Math.min(power,6));upgrade.classList.remove('show');void upgrade.offsetWidth;upgrade.classList.add('show')}stage++;setTimeout(setup,900)}function loop(t){if(!alive)return;const left=Math.min(1,Math.max(0,1-(t-start)/time));timer.style.setProperty('--p',(left*100)+'%');if(left<=0){gameOver();return}raf=requestAnimationFrame(loop)}function gameOver(){alive=false;clearTimeout(bugTimer);bug.style.display='none';const b=Math.max(score,safeGet('hatch_best'));safeSet('hatch_best',b);bestMark.textContent='★ '+b;endScore.textContent=score;overlay.classList.add('show');sfx(90,.25)}function reset(){score=0;stage=1;power=1;owned=[];collection.innerHTML='';scoreEl.textContent=0;overlay.classList.remove('show');setup()}egg.addEventListener('click',tapEgg);bug.addEventListener('click',bugTap);again.addEventListener('click',reset);setup()})();
</script></body></html>
