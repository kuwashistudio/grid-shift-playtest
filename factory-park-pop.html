<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>PARK POP</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0f1720;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:manipulation;overflow:hidden}body{min-height:100vh;display:flex;justify-content:center;align-items:center}.app{width:min(100vw,480px);height:100vh;max-height:900px;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}.top{display:flex;align-items:center;justify-content:space-between;height:72px}.score{font-size:34px;font-weight:900;letter-spacing:-1px}.lights{display:flex;gap:7px}.light{width:16px;height:16px;border-radius:50%;background:#ff4f5e;box-shadow:0 0 12px #ff4f5e}.light.off{opacity:.15;box-shadow:none}.lotWrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center}.lot{position:relative;width:min(90vw,420px);aspect-ratio:1;background:linear-gradient(#475569 1px,transparent 1px),linear-gradient(90deg,#475569 1px,transparent 1px),#1f2937;background-size:20% 20%;border:8px solid #334155;border-radius:26px;overflow:hidden;box-shadow:inset 0 0 0 4px #0b1220}.exit{position:absolute;right:-8px;top:40%;width:22px;height:20%;background:#0f1720;z-index:4}.road{position:absolute;right:-36%;top:40%;width:38%;height:20%;background:#2d3748;border-top:3px dashed #f8fafc55;border-bottom:3px dashed #f8fafc55}.car{position:absolute;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 0 #0005,inset 0 -8px 0 #0002;transition:transform .28s cubic-bezier(.2,.9,.2,1),opacity .25s;z-index:3}.car:before,.car:after{content:"";position:absolute;background:#0b1020;border-radius:6px}.h:before,.h:after{width:14%;height:25%;top:15%}.h:before{left:10%}.h:after{right:10%}.v:before,.v:after{height:14%;width:25%;left:15%}.v:before{top:10%}.v:after{bottom:10%}.car span{width:40%;height:45%;border-radius:9px;background:#dff7ff99}.guide{position:absolute;z-index:8;pointer-events:none;width:72px;height:72px;border:5px solid #fff;border-radius:50%;box-shadow:0 0 0 8px #ffffff22;animation:pulse 1s infinite}.guide:after{content:"☝";position:absolute;font-size:42px;left:14px;top:14px;filter:drop-shadow(0 3px 2px #0007)}@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 18px #ffffff05}}.toast{position:absolute;inset:auto 0 3%;text-align:center;font-size:38px;font-weight:1000;opacity:0;transform:scale(.5);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:scale(1)}.overlay{position:absolute;inset:0;background:#07101be8;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column}.overlay.show{display:flex}.again{width:120px;height:120px;border:0;border-radius:50%;font-size:66px;font-weight:900;background:white;color:#111;box-shadow:0 10px 30px #0008}.best{font-size:24px;opacity:.7;margin-bottom:24px}.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
</style></head><body><div class="app"><div class="top"><div class="score" id="score">0</div><div class="lights" id="lights"></div></div><div class="lotWrap" id="wrap"><div class="lot" id="lot"><div class="exit"></div><div class="road"></div></div><div class="toast" id="toast">✨</div><div class="overlay" id="over"><div class="best" id="best"></div><button class="again" id="again" aria-label="retry">↻</button></div></div></div><script>
(()=>{'use strict';const lot=document.getElementById('lot'),scoreEl=document.getElementById('score'),lights=document.getElementById('lights'),toast=document.getElementById('toast'),over=document.getElementById('over'),bestEl=document.getElementById('best'),again=document.getElementById('again');let score=0,strikes=0,level=0,cars=[],guide=null,locked=false;const C=['#ff5964','#35d07f','#4ca7ff','#ffd54a','#b56cff','#ff8a3d'];const levels=[
[{x:0,y:0,w:2,h:1,dir:'R',c:0},{x:2,y:2,w:2,h:1,dir:'R',c:2},{x:1,y:1,w:1,h:2,dir:'D',c:1},{x:3,y:0,w:1,h:2,dir:'D',c:3}],
[{x:0,y:2,w:2,h:1,dir:'R',c:4},{x:2,y:0,w:1,h:2,dir:'D',c:1},{x:3,y:1,w:2,h:1,dir:'R',c:2},{x:1,y:3,w:1,h:2,dir:'D',c:5},{x:3,y:4,w:2,h:1,dir:'R',c:3}],
[{x:0,y:1,w:2,h:1,dir:'R',c:0},{x:2,y:1,w:1,h:2,dir:'D',c:3},{x:3,y:0,w:2,h:1,dir:'R',c:1},{x:0,y:3,w:2,h:1,dir:'R',c:2},{x:2,y:3,w:2,h:1,dir:'R',c:4},{x:4,y:2,w:1,h:2,dir:'D',c:5}]
];function renderLights(){lights.innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');d.className='light'+(i<strikes?' off':'');lights.appendChild(d)}}function cellPx(){return lot.clientWidth/5}function canExit(car){const others=cars.filter(o=>o!==car&&!o.gone);if(car.dir==='R'){const edge=car.x+car.w;return !others.some(o=>!(o.y+o.h<=car.y||o.y>=car.y+car.h)&&o.x>=edge)}if(car.dir==='L'){return !others.some(o=>!(o.y+o.h<=car.y||o.y>=car.y+car.h)&&o.x+o.w<=car.x)}if(car.dir==='D'){const edge=car.y+car.h;return !others.some(o=>!(o.x+o.w<=car.x||o.x>=car.x+car.w)&&o.y>=edge)}if(car.dir==='U'){return !others.some(o=>!(o.x+o.w<=car.x||o.x>=car.x+car.w)&&o.y+o.h<=car.y)}return false}function build(){locked=false;lot.querySelectorAll('.car,.guide').forEach(x=>x.remove());cars=[];const def=levels[level%levels.length].map(x=>({...x}));def.forEach((d,i)=>{const e=document.createElement('button');e.type='button';e.className='car '+(d.w>d.h?'h':'v');e.style.border='0';e.style.background=C[d.c%C.length];e.innerHTML='<span></span>';e.setAttribute('aria-label','car');lot.appendChild(e);const car={...d,e,i,gone:false};cars.push(car);e.addEventListener('click',()=>tap(car))});place();setTimeout(showGuide,350)}function place(){const p=cellPx();cars.forEach(c=>{c.e.style.left=(c.x*p+5)+'px';c.e.style.top=(c.y*p+5)+'px';c.e.style.width=(c.w*p-10)+'px';c.e.style.height=(c.h*p-10)+'px'})}function showGuide(){if(guide)guide.remove();const target=cars.find(canExit);if(!target)return;guide=document.createElement('div');guide.className='guide';lot.appendChild(guide);const r=target.e.getBoundingClientRect(),lr=lot.getBoundingClientRect();guide.style.left=(r.left-lr.left+r.width/2-36)+'px';guide.style.top=(r.top-lr.top+r.height/2-36)+'px';setTimeout(()=>{if(guide&&guide.parentNode)guide.style.opacity='0'},1900)}function tap(c){if(locked||c.gone)return;if(guide){guide.remove();guide=null}if(canExit(c)){c.gone=true;locked=true;const d=c.dir==='R'?`translateX(${lot.clientWidth*1.6}px) rotate(8deg)`:c.dir==='L'?`translateX(${-lot.clientWidth*1.6}px) rotate(-8deg)`:c.dir==='D'?`translateY(${lot.clientHeight*1.6}px) rotate(8deg)`:`translateY(${-lot.clientHeight*1.6}px) rotate(-8deg)`;c.e.style.transform=d;c.e.style.opacity='.2';score+=10+level*2;scoreEl.textContent=score;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),350);setTimeout(()=>{c.e.remove();locked=false;if(cars.every(x=>x.gone)){level++;score+=50;scoreEl.textContent=score;setTimeout(build,400)}else setTimeout(showGuide,900)},330)}else{strikes++;renderLights();c.e.classList.remove('shake');void c.e.offsetWidth;c.e.classList.add('shake');if(strikes>=3)setTimeout(gameOver,240)}}function gameOver(){locked=true;const best=Math.max(score,+localStorage.getItem('parkpop_best')||0);localStorage.setItem('parkpop_best',best);bestEl.textContent='★ '+best;over.classList.add('show')}function reset(){score=0;strikes=0;level=0;scoreEl.textContent=0;renderLights();over.classList.remove('show');build()}again.addEventListener('click',reset);window.addEventListener('resize',place);renderLights();build();})();
</script></div></body></html>
