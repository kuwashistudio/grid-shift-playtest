<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Parking Remaster</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b2520;touch-action:manipulation;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body::before{content:"";position:fixed;inset:-30px;background:url('assets/bg.jpg') center/cover no-repeat;filter:blur(20px) brightness(.55);transform:scale(1.08)}
#wrap{position:fixed;left:0;top:0;overflow:hidden;box-shadow:0 0 45px #0008;background:#111}
#stage{position:absolute;left:0;top:0;width:941px;height:1672px;transform-origin:0 0;overflow:hidden;user-select:none;-webkit-user-select:none}
#bg{position:absolute;inset:0;width:941px;height:1672px;display:block;pointer-events:none}
.patch,.carSprite{position:absolute;display:block;pointer-events:none;transform-origin:center center}
.patch{z-index:2}
.carSprite{z-index:6;filter:drop-shadow(0 6px 5px rgba(0,0,0,.42))}
.hotspot{position:absolute;z-index:10;border:0;background:transparent;padding:0;margin:0;border-radius:32px;cursor:pointer;outline:none}
.hotspot:active{background:rgba(255,255,255,.03)}
#tutorialRing{position:absolute;z-index:9;left:376px;top:511px;width:125px;height:238px;border-radius:36px;border:4px solid rgba(255,216,61,.0);pointer-events:none;animation:hint 1.5s ease-in-out infinite}
@keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(255,215,48,0)}50%{box-shadow:0 0 0 18px rgba(255,215,48,.16)}}
#clear{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(8,13,12,0);pointer-events:none;opacity:0;transition:opacity .35s}
#clear.show{opacity:1;background:rgba(8,13,12,.20)}
#clear .medal{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7aa 0 8%,#ffd43c 9% 58%,#e3a800 59% 100%);box-shadow:0 16px 45px #0008,inset 0 0 0 10px #fff2a155;display:grid;place-items:center;font-size:96px;color:#fff;text-shadow:0 4px 0 #c99200;transform:scale(.6);transition:transform .42s cubic-bezier(.2,1.3,.3,1)}
#clear.show .medal{transform:scale(1)}
#flash{position:absolute;inset:0;z-index:20;pointer-events:none;background:rgba(255,70,60,0);transition:background .15s}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<img id="bg" src="assets/bg.jpg" alt="">
<div id="tutorialRing"></div>
<div id="flash"></div>
<div id="clear"><div class="medal">✓</div></div>
</div></div>
<script>
(()=>{
const W=941,H=1672,stage=document.querySelector('#stage'),wrap=document.querySelector('#wrap');
function fit(){const vw=innerWidth,vh=innerHeight;const s=Math.min(vw/W,vh/H);const ww=W*s,hh=H*s;wrap.style.width=ww+'px';wrap.style.height=hh+'px';wrap.style.left=((vw-ww)/2)+'px';wrap.style.top=((vh-hh)/2)+'px';stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit,{passive:true}); fit();

const defs=[
 {id:'green_tl', sprite:[129,478,108,211], body:[125,486,230,709], dir:'up'},
 {id:'red_top', sprite:[388,521,109,206], body:[383,525,487,737], dir:'up', first:true},
 {id:'blue_top', sprite:[503,611,232,103], body:[510,617,724,723], dir:'left'},
 {id:'white_tr', sprite:[742,469,117,224], body:[748,481,842,705], dir:'up'},
 {id:'black_ml', sprite:[100,756,124,264], body:[109,759,216,1019], dir:'up'},
 {id:'yellow_mid', sprite:[389,758,232,95], body:[400,759,639,866], dir:'left'},
 {id:'silver_mid', sprite:[384,903,274,105], body:[392,904,650,1008], dir:'left'},
 {id:'white_bl', sprite:[285,1051,107,234], body:[285,1043,389,1284], dir:'up'},
 {id:'blue_bottom', sprite:[416,1199,214,101], body:[424,1204,628,1299], dir:'left'},
 {id:'green_br', sprite:[644,1052,102,232], body:[641,1054,736,1287], dir:'up'}
];
const cars=new Map(); let movedCount=0, audioCtx=null, hintTimer=null;
const vec={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const baseAng={up:-Math.PI/2,down:Math.PI/2,left:Math.PI,right:0};
function intersect(a,b){return !(a[2]<=b[0]||a[0]>=b[2]||a[3]<=b[1]||a[1]>=b[3]);}
function blocked(c){const [dx,dy]=vec[c.dir];const d=64;const a=[c.body[0]+dx*d,c.body[1]+dy*d,c.body[2]+dx*d,c.body[3]+dy*d];for(const o of cars.values()){if(o===c||o.moved)continue;if(intersect(a,o.body))return true;}return false;}
function ensureAudio(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();} if(audioCtx.state==='suspended')audioCtx.resume();}
function engine(){try{ensureAudio();const t=audioCtx.currentTime;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(78,t);osc.frequency.exponentialRampToValueAtTime(142,t+.42);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.045,t+.04);gain.gain.exponentialRampToValueAtTime(.0001,t+.55);osc.connect(gain).connect(audioCtx.destination);osc.start(t);osc.stop(t+.58);}catch(e){}}
function horn(){try{ensureAudio();const t=audioCtx.currentTime;[0,0.055].forEach((d,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='square';o.frequency.value=i?392:330;g.gain.setValueAtTime(.028,t+d);g.gain.exponentialRampToValueAtTime(.0001,t+d+.16);o.connect(g).connect(audioCtx.destination);o.start(t+d);o.stop(t+d+.17);});}catch(e){}}
function addCar(d){const c={...d,moved:false,patch:null,spriteEl:null,hot:null};const [x1,y1,x2,y2]=d.body;const b=document.createElement('button');b.className='hotspot';b.style.left=x1+'px';b.style.top=y1+'px';b.style.width=(x2-x1)+'px';b.style.height=(y2-y1)+'px';b.setAttribute('aria-label','car');b.addEventListener('pointerdown',ev=>{ev.preventDefault();tap(c)});stage.appendChild(b);c.hot=b;cars.set(c.id,c);}
defs.forEach(addCar);
function revealPatch(c,show=true){if(!c.patch){const [x,y,w,h]=c.sprite;const p=document.createElement('img');p.className='patch';p.src=`assets/patches/${c.id}.jpg`;p.style.left=x+'px';p.style.top=y+'px';p.style.width=w+'px';p.style.height=h+'px';p.style.display='none';stage.appendChild(p);c.patch=p;}c.patch.style.display=show?'block':'none';}
function createSprite(c){const [x,y,w,h]=c.sprite;const im=document.createElement('img');im.className='carSprite';im.src=`assets/sprites/${c.id}.png`;im.style.left=x+'px';im.style.top=y+'px';im.style.width=w+'px';im.style.height=h+'px';stage.appendChild(im);c.spriteEl=im;return im;}
function tap(c){if(c.moved)return;document.querySelector('#tutorialRing')?.remove();clearTimeout(hintTimer); if(blocked(c)) bump(c); else exitCar(c);}
function bump(c){if(c.spriteEl)return;horn();navigator.vibrate?.(28);revealPatch(c,true);const s=createSprite(c),[dx,dy]=vec[c.dir];s.animate([{transform:'translate(0,0)'},{transform:`translate(${dx*16}px,${dy*16}px)`},{transform:'translate(0,0)'}],{duration:340,easing:'cubic-bezier(.2,.8,.3,1)'}).finished.then(()=>{s.remove();c.spriteEl=null;revealPatch(c,false);});const f=document.querySelector('#flash');f.style.background='rgba(255,55,45,.08)';setTimeout(()=>f.style.background='rgba(255,70,60,0)',120);}
function bezier(p0,p1,p2,p3,t){const q=1-t;return [q*q*q*p0[0]+3*q*q*t*p1[0]+3*q*t*t*p2[0]+t*t*t*p3[0],q*q*q*p0[1]+3*q*q*t*p1[1]+3*q*t*t*p2[1]+t*t*t*p3[1]];}
function tangent(p0,p1,p2,p3,t){const q=1-t;return [3*q*q*(p1[0]-p0[0])+6*q*t*(p2[0]-p1[0])+3*t*t*(p3[0]-p2[0]),3*q*q*(p1[1]-p0[1])+6*q*t*(p2[1]-p1[1])+3*t*t*(p3[1]-p2[1])];}
function exitCar(c){c.moved=true;c.hot.disabled=true;movedCount++;engine();navigator.vibrate?.(12);revealPatch(c,true);const s=createSprite(c);const [x,y,w,h]=c.sprite;const p0=[x+w/2,y+h/2];const [dx,dy]=vec[c.dir];const p1=[p0[0]+dx*115,p0[1]+dy*115];
 const sideBias=Math.max(-120,Math.min(120,(p1[0]-470)*.22));
 const p2=[470+sideBias,520]; const p3=[470,390];
 const p4=[470,250]; const dur=2400;const start=performance.now();
 function frame(now){const u=Math.min(1,(now-start)/dur);let pos,tan;if(u<.34){const t=u/.34;const q=1-Math.pow(1-t,2);pos=[p0[0]+(p1[0]-p0[0])*q,p0[1]+(p1[1]-p0[1])*q];tan=[p1[0]-p0[0],p1[1]-p0[1]];}else if(u<.88){const t=(u-.34)/.54;pos=bezier(p1,[p1[0]+(470-p1[0])*.35,p1[1]-80],[p2[0],p2[1]+100],p3,t);tan=tangent(p1,[p1[0]+(470-p1[0])*.35,p1[1]-80],[p2[0],p2[1]+100],p3,t);}else{const t=(u-.88)/.12;pos=[p3[0]+(p4[0]-p3[0])*t,p3[1]+(p4[1]-p3[1])*t];tan=[0,-1];}
 const ang=Math.atan2(tan[1],tan[0]);const delta=ang-baseAng[c.dir];s.style.left=(pos[0]-w/2)+'px';s.style.top=(pos[1]-h/2)+'px';s.style.transform=`rotate(${delta}rad)`;if(u<1)requestAnimationFrame(frame);else{s.remove();c.spriteEl=null;if(movedCount===defs.length)complete();else scheduleHint();}}
 requestAnimationFrame(frame);
}
function scheduleHint(){clearTimeout(hintTimer);hintTimer=setTimeout(()=>{const candidate=[...cars.values()].find(c=>!c.moved&&!blocked(c));if(!candidate)return;const [x1,y1,x2,y2]=candidate.body;const ring=document.createElement('div');ring.style.cssText=`position:absolute;z-index:8;left:${x1-7}px;top:${y1-7}px;width:${x2-x1+14}px;height:${y2-y1+14}px;border-radius:34px;box-shadow:0 0 0 0 rgba(255,215,48,.0);pointer-events:none;animation:hint 1.5s ease-in-out 2`;stage.appendChild(ring);setTimeout(()=>ring.remove(),3200);},4500);}
function complete(){setTimeout(()=>{document.querySelector('#clear').classList.add('show');try{ensureAudio();const t=audioCtx.currentTime;[523,659,784].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.05,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.28);o.connect(g).connect(audioCtx.destination);o.start(t+i*.09);o.stop(t+i*.09+.3);});}catch(e){}},450);}
})();
</script>
</body></html>
