<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>COLOR ROCKETS</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#0c1530;color:white;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}body{min-height:100vh;display:grid;place-items:center}.app{width:min(100vw,460px);height:100vh;max-height:900px;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;background:radial-gradient(circle at 50% 5%,#263d79,#0c1530 58%)}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.score{font-size:32px;font-weight:950}.fuel{display:flex;gap:5px;max-width:190px;flex-wrap:wrap;justify-content:flex-end}.fuel i{width:10px;height:10px;border-radius:50%;background:#fff}.fuel i.used{opacity:.13}.fuel.danger i:not(.used){background:#ff6077;box-shadow:0 0 8px #ff6077}.stage{flex:1;position:relative;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:28px 16px;padding:28px 18px}.tube{width:82px;height:188px;border:0;background:transparent;position:relative;padding:0;transition:transform .2s,filter .2s}.glass{position:absolute;inset:8px 8px 0;border:6px solid #dce9ff;border-top:0;border-radius:0 0 28px 28px;overflow:hidden;background:#ffffff09;box-shadow:0 12px 20px #0006}.glass:before{content:'';position:absolute;left:-7px;right:-7px;top:-6px;height:12px;border:6px solid #dce9ff;border-radius:12px}.layer{position:absolute;left:0;right:0;height:25%;transition:bottom .34s ease,transform .34s ease}.tube.selected{transform:translateY(-18px);filter:drop-shadow(0 0 14px #fff)}.tube.complete{animation:rocket .85s forwards}.guide{position:absolute;z-index:15;font-size:54px;pointer-events:none;filter:drop-shadow(0 4px 2px #0008);animation:tap 1s infinite}.arrow{position:absolute;z-index:14;font-size:42px;pointer-events:none;animation:slide 1s infinite}.stream{position:absolute;z-index:18;width:10px;height:10px;border-radius:50%;pointer-events:none;box-shadow:0 0 12px currentColor}.burst{position:absolute;font-size:44px;pointer-events:none;z-index:20;animation:burst .7s forwards}.overlay{position:absolute;inset:0;background:#071028ed;z-index:30;display:none;place-items:center}.overlay.show{display:grid}.panel{text-align:center}.big{font-size:44px;font-weight:1000}.again{margin-top:18px;width:116px;height:116px;border:0;border-radius:50%;font-size:64px;background:white}.level{font-size:16px;opacity:.7}.clearFlash{position:absolute;z-index:24;left:50%;top:43%;transform:translate(-50%,-50%);font-size:42px;letter-spacing:4px;opacity:0;pointer-events:none}.clearFlash.show{animation:stars .9s}@keyframes stars{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80%) scale(.85)}}.invalid{animation:shake .2s}.undo{position:absolute;left:14px;bottom:14px;width:62px;height:62px;border-radius:50%;border:0;background:#ffffff18;color:white;font-size:34px;z-index:18}.undo:disabled{opacity:.2}.undoDots{position:absolute;left:84px;bottom:34px;font-size:13px;letter-spacing:4px;opacity:.75;z-index:18}
@keyframes tap{50%{transform:translateY(10px) scale(.9)}}@keyframes slide{50%{transform:translateX(12px)}}@keyframes rocket{35%{transform:translateY(-35px) scale(1.08)}100%{transform:translateY(-520px) rotate(15deg);opacity:0}}@keyframes burst{100%{transform:translateY(-90px) scale(1.5);opacity:0}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
</style></head><body><div class='app'><div class='top'><div><div class='score' id='score'>0</div><div class='level' id='level'>●</div></div><div class='fuel' id='fuel'></div></div><div class='stage' id='stage'><button class='undo' id='undo' aria-label='undo'>↶</button><div class='undoDots' id='undoDots'></div><div class='guide' id='guide'>☝</div><div class='arrow' id='arrow'>➜</div><div class='clearFlash' id='clearFlash'></div><div class='overlay' id='overlay'><div class='panel'><div class='big' id='endScore'>0</div><button class='again' id='again'>↻</button></div></div></div></div><script>
(()=>{'use strict';const stage=document.querySelector('#stage'),scoreEl=document.querySelector('#score'),levelEl=document.querySelector('#level'),fuelEl=document.querySelector('#fuel'),guide=document.querySelector('#guide'),arrow=document.querySelector('#arrow'),clearFlash=document.querySelector('#clearFlash'),overlay=document.querySelector('#overlay'),endScore=document.querySelector('#endScore'),again=document.querySelector('#again'),undo=document.querySelector('#undo'),undoDots=document.querySelector('#undoDots');const C=['#ff5268','#3ddc97','#4aa8ff','#ffd34e','#b66cff'];let level=0,score=0,tubes=[],sel=null,moves=0,maxMoves=9,tutorial=true,tutorialPhase=0,busy=false,history=[],undos=2;const basePuzzles=[[[0,1,0,1],[1,0,1,0],[],[]],[[0,1,2,0],[2,1,0,2],[1,2,1,0],[],[]],[[0,1,2,3],[2,3,1,0],[3,0,2,1],[1,2,3,0],[],[]],[[0,1,2,3],[3,4,1,2],[2,0,4,1],[4,3,2,0],[1,4,3,0],[],[]]];const VAR=(p,shift=0,rev=false)=>{const q=p.map(a=>a.map(c=>(c+shift)%5));return rev?q.reverse():q};const puzzles=[basePuzzles[0],basePuzzles[1],basePuzzles[2],basePuzzles[3],VAR(basePuzzles[1],1,true),VAR(basePuzzles[2],2,true),VAR(basePuzzles[3],1,true),VAR(basePuzzles[2],3,false),VAR(basePuzzles[3],2,false),VAR(basePuzzles[1],2,false)];const limits=[9,13,17,22,13,17,22,17,22,13];function sfx(f=500,d=.06){try{const A=window.AudioContext||window.webkitAudioContext;const a=sfx.a||(sfx.a=new A());const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function updateHUD(){scoreEl.textContent=score;fuelEl.classList.toggle('danger',maxMoves-moves<=3);undo.disabled=!history.length||undos<=0||busy;undoDots.textContent='●'.repeat(undos)+'○'.repeat(2-undos);levelEl.textContent='●'.repeat(Math.min(level+1,6));fuelEl.innerHTML='';for(let i=0;i<maxMoves;i++){const d=document.createElement('i');if(i<moves)d.className='used';fuelEl.appendChild(d)}}function topColor(t){return t.a[t.a.length-1]}function topRun(t){if(!t.a.length)return 0;const c=topColor(t);let n=0;for(let i=t.a.length-1;i>=0&&t.a[i]===c;i--)n++;return n}function uniform(t){return t.a.length===4&&t.a.every(x=>x===t.a[0])}function canPour(a,b){return a&&b&&a!==b&&a.a.length>0&&b.a.length<4&&(!b.a.length||topColor(a)===topColor(b))}function build(){busy=false;stage.querySelectorAll('.tube,.burst').forEach(x=>x.remove());sel=null;moves=0;history=[];undos=2;maxMoves=limits[level%limits.length];tubes=puzzles[level%puzzles.length].map((arr,i)=>{const b=document.createElement('button');b.className='tube';b.type='button';b.innerHTML='<div class="glass"></div>';stage.insertBefore(b,guide);const t={a:[...arr],b,i,done:false};b.addEventListener('click',()=>tap(t));return t});draw();updateHUD();setTimeout(showTutorial,450)}function draw(){tubes.forEach(t=>{const g=t.b.querySelector('.glass');g.innerHTML='';t.a.forEach((c,i)=>{const d=document.createElement('div');d.className='layer';d.style.background=C[c];d.style.bottom=(i*25)+'%';g.appendChild(d)});t.b.classList.toggle('selected',t===sel)})}function positions(t){const r=t.b.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:r.left-s.left+r.width/2,y:r.top-s.top+r.height/2}}function showTutorial(){guide.style.display='none';arrow.style.display='none';if(!tutorial)return;const a=tubes[0],b=tubes.find(x=>x.a.length===0);if(!a||!b)return;const target=tutorialPhase===0?a:b,p=positions(target);guide.style.display='block';guide.style.left=(p.x-26)+'px';guide.style.top=(p.y-26)+'px';target.b.animate([{filter:'drop-shadow(0 0 0 #fff0)'},{filter:'drop-shadow(0 0 18px #fff)'},{filter:'drop-shadow(0 0 0 #fff0)'}],{duration:950,iterations:Infinity});if(tutorialPhase===1){const pa=positions(a),pb=positions(b);arrow.style.display='block';arrow.style.left=((pa.x+pb.x)/2-22)+'px';arrow.style.top=((pa.y+pb.y)/2-26)+'px'}}function tap(t){if(busy||t.done)return;if(tutorial&&tutorialPhase===0){if(t!==tubes[0]){showTutorial();return}tutorialPhase=1}if(!sel){if(t.a.length){sel=t;draw();sfx(350,.04);if(tutorial)setTimeout(showTutorial,60)}return}if(sel===t){sel=null;draw();return}if(tutorial&&tutorialPhase===1){const b=tubes.find(x=>x.a.length===0);if(t!==b){showTutorial();return}tutorial=false;guide.style.display=arrow.style.display='none'}if(!canPour(sel,t)){t.b.classList.remove('invalid');void t.b.offsetWidth;t.b.classList.add('invalid');sfx(120,.1);return}const from=sel;sel=null;pour(from,t)}function pour(a,b){busy=true;history.push(tubes.map(t=>[...t.a]));const color=topColor(a),n=Math.min(topRun(a),4-b.a.length);const pa=positions(a),pb=positions(b);const tilt=pb.x>=pa.x?18:-18;a.b.animate([{transform:'translateY(-18px)'},{transform:`translateY(-24px) rotate(${tilt}deg)`},{transform:'translateY(-18px)'}],{duration:360,easing:'ease-in-out'});for(let k=0;k<Math.min(4,n+1);k++){const drop=document.createElement('div');drop.className='stream';drop.style.background=C[color];drop.style.color=C[color];drop.style.left=(pa.x-5)+'px';drop.style.top=(pa.y-30)+'px';stage.appendChild(drop);drop.animate([{transform:'translate(0,0) scale(.8)'},{transform:`translate(${pb.x-pa.x}px,${pb.y-pa.y+20}px) scale(1.15)`}],{duration:280,delay:k*45,easing:'ease-in'}).onfinish=()=>drop.remove()}setTimeout(()=>{for(let i=0;i<n;i++){a.a.pop();b.a.push(color)}moves++;score+=n*4;checkComplete(b);draw();busy=false;updateHUD();sfx(520+n*80,.07);if(allSolved()){const left=maxMoves-moves,stars=left>=4?3:left>=2?2:1;score+=120+stars*20;scoreEl.textContent=score;clearFlash.textContent='★'.repeat(stars);clearFlash.classList.remove('show');void clearFlash.offsetWidth;clearFlash.classList.add('show');setTimeout(()=>{level++;tutorial=false;build()},950)}else if(moves>=maxMoves)setTimeout(gameOver,180)},300)}function checkComplete(t){if(!t.done&&uniform(t)){t.done=true;score+=40;t.b.classList.add('complete');const p=positions(t),x=document.createElement('div');x.className='burst';x.textContent='🚀';x.style.left=(p.x-20)+'px';x.style.top=(p.y-20)+'px';stage.appendChild(x);setTimeout(()=>{t.b.style.visibility='hidden'},700)}}function allSolved(){return tubes.every(t=>t.done||t.a.length===0||uniform(t))}function undoMove(){if(busy||!history.length||undos<=0)return;const st=history.pop();undos--;moves=Math.max(0,moves-1);tubes.forEach((t,i)=>{t.a=[...st[i]];t.done=uniform(t);t.b.style.visibility='visible';t.b.classList.remove('complete');if(t.done)t.b.classList.add('complete')});sel=null;draw();updateHUD();sfx(240,.06)}function gameOver(){busy=true;endScore.textContent=score;overlay.classList.add('show');sfx(90,.25)}function reset(){level=0;score=0;tutorial=true;tutorialPhase=0;overlay.classList.remove('show');build()}undo.addEventListener('click',undoMove);again.addEventListener('click',reset);window.addEventListener('resize',()=>{if(tutorial)setTimeout(showTutorial,50)});build()})();
</script></body></html>
