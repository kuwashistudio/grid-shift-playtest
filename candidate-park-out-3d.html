<style>
:root{--scene:#7fbd63;--asphalt:#4b5057;--lot:#8d9298;--curb:#e9e2d2;--ink:#24303a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.sky{position:absolute;left:0;right:0;top:0;height:17%;background:linear-gradient(#d9f2ff,#bfe2f6)}
.house{position:absolute;bottom:0;width:22%;height:65%;border-radius:8px 8px 0 0;box-shadow:inset 0 -9px #0001}.house:after{content:"";position:absolute;inset:18% 13% 12%;background:repeating-linear-gradient(90deg,#effaff 0 13%,transparent 13% 30%),repeating-linear-gradient(#effaff 0 13%,transparent 13% 31%);opacity:.75}.h1{left:3%;background:#e89a55}.h2{left:27%;height:48%;background:#e27878}.h3{right:4%;height:78%;background:#a88bc9}.h4{right:29%;width:14%;height:38%;background:#e6c55d}
.road{position:absolute;left:-18%;right:-18%;top:15%;bottom:3%;border-radius:46px;background:var(--asphalt);box-shadow:inset 0 0 0 7px #383d43}.road:before{content:"";position:absolute;inset:25px;border:3px dashed #f7f8fa77;border-radius:29px}.road:after{content:"";position:absolute;inset:66px;background:#6eb250;border-radius:26px;box-shadow:inset 0 0 0 4px #5a9841}
.crosswalk{position:absolute;z-index:2;width:58px;height:30px;background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 12px);opacity:.85}.cw1{top:19%;left:42%}.cw2{bottom:8%;left:39%}

.shop{position:absolute;z-index:4;left:3%;top:18.8%;width:88px;height:56px;background:#f8eee0;border-radius:7px;box-shadow:0 5px 0 #0002}.shop:before{content:"";position:absolute;left:7px;right:7px;top:4px;height:14px;background:repeating-linear-gradient(90deg,#f05a5a 0 10px,#fff 10px 20px);border-radius:5px}.shop:after{content:"";position:absolute;left:14px;bottom:5px;width:28px;height:27px;background:#72b7dc;border:4px solid #fff}
.hud{position:absolute;z-index:80;top:max(8px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.badge{height:43px;min-width:86px;padding:0 15px;border-radius:23px;background:#fff;color:#28323b;box-shadow:0 5px 14px #0002;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:17px}.coinBadge{gap:7px}.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0 0 16%,#f9c638 17% 64%,#d99c00 65%);border:2px solid #fff3a0}
.lotShell{position:absolute;z-index:10;left:4%;right:4%;top:25%;aspect-ratio:1/1;background:#67ad4c;border-radius:30px;padding:11px;box-shadow:0 18px 34px #0004}.lot{position:relative;width:100%;height:100%;border-radius:18px;background:linear-gradient(155deg,#a8adb1,#858b91 72%);box-shadow:inset 0 0 0 2px #c9cdd055,0 7px 0 #4c8138;overflow:visible}.lot:before{content:"";position:absolute;inset:3%;background:linear-gradient(90deg,transparent 13.8%,#ffffff35 14% 14.5%,transparent 14.7% 28%,#ffffff35 28.2% 28.7%,transparent 28.9% 42.2%,#ffffff35 42.4% 42.9%,transparent 43.1% 56.4%,#ffffff35 56.6% 57.1%,transparent 57.3% 70.6%,#ffffff35 70.8% 71.3%,transparent 71.5% 84.8%,#ffffff35 85% 85.5%,transparent 85.7%);opacity:.65;pointer-events:none}.lot:after{content:"";position:absolute;left:4%;right:4%;top:49.4%;border-top:2px dashed #ffffff3d;pointer-events:none}
.curbGap{display:none}
.car{position:absolute;z-index:30;border:0;padding:0;background:transparent;appearance:none;cursor:pointer;transform-origin:center;will-change:transform}.vehicle{position:absolute;inset:3%;border-radius:19% 19% 24% 24%;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 78%,white),var(--c) 45%,color-mix(in srgb,var(--c) 78%,black));box-shadow:inset 4px 4px 0 #fff4,inset -5px -7px 0 #0002,0 5px 8px #0007;overflow:visible}.car.bus .vehicle{border-radius:12% 12% 17% 17%}.roof{position:absolute;left:18%;right:18%;top:26%;bottom:26%;border-radius:25%;background:color-mix(in srgb,var(--c) 74%,white);box-shadow:inset 0 0 0 2px #ffffff33}.glassFront{position:absolute;left:18%;right:18%;top:13%;height:23%;border-radius:24% 24% 10% 10%;background:linear-gradient(#dff5ff,#70a7bf);border:2px solid #28424e}.glassRear{position:absolute;left:22%;right:22%;bottom:15%;height:17%;border-radius:8% 8% 22% 22%;background:#6e9cb0;border:2px solid #29414c}.driver{position:absolute;left:50%;top:26%;width:10%;aspect-ratio:1;border-radius:50%;background:#f0c9a5;transform:translateX(-50%);box-shadow:0 0 0 2px #6b4a36;opacity:.9}.lamp{position:absolute;top:3%;width:17%;height:8%;border-radius:50%;background:#fff7c7;box-shadow:0 0 7px #fff59d}.lamp.a{left:12%}.lamp.b{right:12%}.brake{position:absolute;bottom:3%;width:16%;height:7%;border-radius:50%;background:#c92f37}.brake.a{left:13%}.brake.b{right:13%}.wheel{position:absolute;width:12%;height:25%;background:#20252a;border-radius:5px;z-index:-1}.w1{left:-4%;top:17%}.w2{right:-4%;top:17%}.w3{left:-4%;bottom:17%}.w4{right:-4%;bottom:17%}.mirror{position:absolute;top:35%;width:9%;height:10%;border-radius:50%;background:var(--c);border:1px solid #0004}.m1{left:-6%}.m2{right:-6%}
.car.free .vehicle{filter:none}.car.blocked .brake{box-shadow:0 0 10px 4px #ff2f3f}.car.blocked .driver{animation:headShake .3s ease}@keyframes headShake{25%{transform:translateX(-70%)}75%{transform:translateX(-30%)}100%{transform:translateX(-50%)}}
.horn{position:absolute;z-index:55;font-size:24px;pointer-events:none;animation:horn .65s forwards;filter:drop-shadow(0 2px 2px #0006)}@keyframes horn{to{transform:translateY(-36px) scale(1.35);opacity:0}}
.smoke{position:absolute;z-index:25;width:14px;height:14px;border-radius:50%;background:#e8edf1cc;filter:blur(.5px);pointer-events:none;animation:smoke .7s forwards}@keyframes smoke{to{transform:translateY(20px) scale(2.4);opacity:0}}
.hint{position:absolute;z-index:60;width:56px;height:56px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 8px #fff3;pointer-events:none;animation:hint 1s infinite}.hint:after{content:"☝";position:absolute;left:9px;top:7px;font-size:32px;filter:drop-shadow(0 2px 2px #0007)}@keyframes hint{50%{transform:scale(1.12);box-shadow:0 0 0 18px #fff0}}
.clearLayer{position:absolute;inset:0;z-index:90;display:none;place-items:center;background:#14212c66}.clearLayer.show{display:grid}.clearCard{background:#fff;color:#25323d;border-radius:28px;padding:22px 28px 26px;text-align:center;box-shadow:0 18px 45px #0005;min-width:225px}.clearTitle{font-size:26px;font-weight:1000}.stars{font-size:45px;letter-spacing:3px;color:#ffc83d;text-shadow:0 2px 0 #d99d00}.next{margin-top:12px;width:84px;height:84px;border:0;border-radius:50%;background:#59c95b;color:#fff;font-weight:1000;font-size:39px;box-shadow:0 7px 0 #3f9b41}.next:active{transform:translateY(4px);box-shadow:0 3px 0 #3f9b41}
@media(max-width:350px){.lotShell{left:2%;right:2%;top:26%}.hud{left:8px;right:8px}.badge{height:40px;min-width:74px;padding:0 11px;font-size:15px}.shop{transform:scale(.86);transform-origin:left top}}
.game{background:linear-gradient(#83c66a,#72b756)}.sky,.house,.shop{display:none!important}.road{left:0;right:0;top:13%;bottom:auto;height:72px;border-radius:0;background:#4c5157;box-shadow:inset 0 7px 0 #373b40,inset 0 -7px 0 #373b40}.road:before{inset:33px 0 auto;border:0;border-top:3px dashed #f7f8fa7d;border-radius:0}.road:after{display:none}.game:after{content:"";position:absolute;z-index:1;left:0;right:0;top:80%;height:74px;background:#4c5157;box-shadow:inset 0 7px 0 #373b40,inset 0 -7px 0 #373b40}.game:before{content:"";position:absolute;z-index:2;left:0;right:0;top:calc(80% + 36px);border-top:3px dashed #f7f8fa7d}.crosswalk{z-index:3;height:36px;width:58px;opacity:.9}.cw1{top:15.1%;left:40%}.cw2{top:81.9%;bottom:auto;left:39%}.tree{z-index:6;width:34px;height:34px;box-shadow:0 5px 0 #0002}.t1{left:2%;top:23%}.t2{right:2%;top:24%}.t3{left:2%;top:70%;bottom:auto}.t4{right:2%;top:71%;bottom:auto}.t5{left:78%;top:17%}.lotShell{left:2%;right:2%;top:23%;padding:21px;border-radius:34px;background:#4c5156;box-shadow:0 20px 34px #0004,inset 0 0 0 5px #373b40;transform:perspective(900px) rotateX(15deg);transform-origin:50% 35%}.lotShell:before{content:"";position:absolute;inset:13px;border:2px dashed #f5f6f777;border-radius:23px;box-shadow:none;pointer-events:none}.lotShell:after{content:"";position:absolute;inset:18px;border-radius:20px;box-shadow:0 0 0 4px #d9d4c8;pointer-events:none;z-index:1}.lot{z-index:2;overflow:visible;border-radius:13px;background:linear-gradient(155deg,#afb4b8,#858b90 72%);box-shadow:inset 0 0 0 2px #d9dcdf55}.lot:before{opacity:.85}.car{filter:drop-shadow(0 7px 5px #0005)}.vehicle{inset:2%;box-shadow:inset 4px 4px 0 #fff5,inset -6px -8px 0 #0002,0 5px 7px #0006}.roof{left:16%;right:16%;top:23%;bottom:25%;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 64%,white),color-mix(in srgb,var(--c) 82%,white))}.glassFront{left:16%;right:16%;top:11%;height:25%;background:linear-gradient(#e6f8ff,#6da8c0);box-shadow:inset 0 2px 0 #fff8}.glassRear{left:20%;right:20%;bottom:12%;height:18%}.vehicle:before{content:"";position:absolute;left:22%;right:22%;top:0;height:7%;border-radius:50%;background:#fff7b8;box-shadow:0 0 7px #fff59d;opacity:.95}.vehicle:after{content:"";position:absolute;left:26%;right:26%;bottom:1%;height:5%;border-radius:50%;background:#d52f3b;opacity:.85}.spark{position:absolute;z-index:72;width:7px;height:7px;border-radius:50%;background:#ffd84f;box-shadow:0 0 8px #fff27b;pointer-events:none;animation:sparkFly .42s ease-out forwards}@keyframes sparkFly{to{transform:translate(var(--sx),var(--sy)) scale(.2);opacity:0}}.barrier{position:absolute;z-index:8;width:34px;height:10px;border-radius:3px;background:repeating-linear-gradient(135deg,#f2c52b 0 7px,#272b30 7px 14px);box-shadow:0 3px 0 #0004;pointer-events:none}.barrier.b1{left:8px;top:9px}.barrier.b2{right:8px;top:9px}.barrier.b3{left:8px;bottom:9px}.barrier.b4{right:8px;bottom:9px}.hud .badge{backdrop-filter:blur(2px)}
@media(max-width:350px){.lotShell{left:1.5%;right:1.5%;top:24.5%;padding:18px}.game:after{top:81%}.game:before{top:calc(81% + 36px)}.cw2{top:82.8%}}
</style>
</head>
<body>
<div class="game" id="game"><div class="sky"><div class="house h1"></div><div class="house h2"></div><div class="house h3"></div><div class="house h4"></div></div><div class="road"></div><div class="crosswalk cw1"></div><div class="crosswalk cw2"></div><div class="shop"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div><div class="tree t4"></div><div class="tree t5"></div><div class="hud"><div class="badge" id="lvl">LEVEL 1</div><div class="badge coinBadge"><i class="coin"></i><span id="coins">0</span></div></div><div class="lotShell"><i class="barrier b1"></i><i class="barrier b2"></i><i class="barrier b3"></i><i class="barrier b4"></i><div class="lot" id="lot"><i class="curbGap top"></i><i class="curbGap bottom"></i><i class="curbGap left"></i><i class="curbGap right"></i></div></div><div class="clearLayer" id="clearLayer"><div class="clearCard"><div class="stars">★★★</div><div class="clearTitle">CLEAR!</div><button class="next" id="next">▶</button></div></div></div>
<script>
(()=>{'use strict';
const N=7,game=document.getElementById('game'),lot=document.getElementById('lot'),lvl=document.getElementById('lvl'),coinsEl=document.getElementById('coins'),clearLayer=document.getElementById('clearLayer'),next=document.getElementById('next');const COLORS=['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#06b6d4','#f97316','#ec4899','#84cc16','#64748b','#eab308'];let AC=null;function audio(){try{return AC||(AC=new(window.AudioContext||window.webkitAudioContext)())}catch{return null}}function tone(freq,dur=.08,type='sine',gain=.035,slide=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur)}function hornSound(){tone(235,.12,'square',.025);setTimeout(()=>tone(190,.1,'square',.018),70)}function driveSound(){tone(135,.18,'sawtooth',.018,120)}
const LEVELS=[[[5,5,'H','L',2],[4,3,'V','D',2],[1,0,'V','D',2],[2,4,'V','D',3],[2,3,'H','L',2],[4,1,'V','D',2],[2,0,'H','R',3],[6,0,'V','D',2],[5,2,'V','D',2],[1,2,'V','D',2],[0,6,'H','R',2],[2,2,'H','L',2],[2,1,'H','R',2],[4,6,'H','R',2]],[[5,1,'H','L',2],[1,4,'H','R',2],[5,3,'H','R',2],[3,0,'H','L',2],[0,3,'H','R',2],[6,5,'V','U',2],[4,5,'H','R',2],[1,1,'V','D',2],[1,0,'H','L',2],[1,5,'H','L',2],[3,6,'H','R',3],[0,0,'V','D',2]],[[0,6,'H','R',2],[4,3,'V','U',3],[3,2,'H','R',2],[2,1,'H','L',2],[1,3,'V','U',2],[2,4,'V','U',3],[6,5,'V','U',2],[0,0,'V','U',2],[3,3,'V','U',2],[0,2,'V','U',2],[5,1,'V','U',2],[1,0,'V','U',2],[5,0,'H','L',2],[2,0,'H','L',2]],[[6,3,'V','U',2],[2,3,'H','R',3],[0,4,'H','R',2],[5,6,'H','L',2],[0,0,'V','D',2],[4,0,'V','D',2],[5,0,'H','R',2],[1,5,'H','L',2],[3,5,'H','L',2],[2,1,'V','D',2],[0,5,'V','D',2],[3,1,'V','D',2],[1,0,'V','U',2],[2,6,'H','L',3],[4,2,'H','L',2],[1,2,'V','D',2]],[[4,2,'H','R',2],[2,4,'V','D',2],[5,3,'H','R',2],[2,3,'H','R',2],[1,1,'H','L',2],[0,0,'V','D',2],[3,6,'H','R',2],[1,0,'H','R',2],[0,4,'V','D',2],[5,5,'V','U',2],[6,0,'V','D',3],[2,2,'H','R',2],[4,0,'H','R',2],[4,3,'V','D',3],[0,6,'H','R',2],[0,2,'H','R',2],[1,4,'V','D',2],[0,3,'H','R',2]]];let level=0,cars=[],coins=0,locked=false,hint=null;
function cells(c){const[x,y,o,,len]=c.data;return o==='H'?Array.from({length:len},(_,i)=>[x+i,y]):Array.from({length:len},(_,i)=>[x,y+i])}function pathClear(c){const[x,y,o,d,len]=c.data,occ=new Set;cars.filter(k=>!k.gone&&k!==c).forEach(k=>cells(k).forEach(([a,b])=>occ.add(a+','+b)));if(d==='R'){for(let a=x+len;a<N;a++)if(occ.has(a+','+y))return false}if(d==='L'){for(let a=x-1;a>=0;a--)if(occ.has(a+','+y))return false}if(d==='D'){for(let b=y+len;b<N;b++)if(occ.has(x+','+b))return false}if(d==='U'){for(let b=y-1;b>=0;b--)if(occ.has(x+','+b))return false}return true}
function carHTML(){return '<div class="vehicle"><span class="wheel w1"></span><span class="wheel w2"></span><span class="wheel w3"></span><span class="wheel w4"></span><i class="mirror m1"></i><i class="mirror m2"></i><div class="roof"></div><div class="glassFront"></div><div class="glassRear"></div><div class="driver"></div><i class="lamp a"></i><i class="lamp b"></i><i class="brake a"></i><i class="brake b"></i></div>'}function makeCar(data,i){const b=document.createElement('button');b.type='button';b.className='car'+(data[4]===3?' bus':'');b.style.setProperty('--c',COLORS[(i+level*3)%COLORS.length]);b.innerHTML=carHTML();lot.appendChild(b);const c={data:[...data],el:b,gone:false};b.addEventListener('click',()=>tap(c));return c}
function layout(){const s=lot.clientWidth/N;cars.forEach(c=>{if(c.gone)return;const[x,y,o,d,len]=c.data;const thickness=s*.93;const w=o==='H'?s*len:thickness,h=o==='V'?s*len:thickness;c.el.style.left=(x*s+(o==='V'?(s-thickness)/2:0))+'px';c.el.style.top=(y*s+(o==='H'?(s-thickness)/2:0))+'px';c.el.style.width=w+'px';c.el.style.height=h+'px';const rot=d==='R'?90:d==='D'?180:d==='L'?-90:0;c.el.querySelector('.vehicle').style.transform=`rotate(${rot}deg)`;c.el.classList.toggle('free',pathClear(c))})}
function showHint(){if(hint)hint.remove();if(level>0)return;const c=cars.find(k=>!k.gone&&pathClear(k));if(!c)return;const r=c.el.getBoundingClientRect(),g=game.getBoundingClientRect();hint=document.createElement('div');hint.className='hint';hint.style.left=(r.left-g.left+r.width/2-28)+'px';hint.style.top=(r.top-g.top+r.height/2-28)+'px';game.appendChild(hint)}function horn(c){const r=c.el.getBoundingClientRect(),g=game.getBoundingClientRect();const h=document.createElement('div');h.className='horn';h.textContent='📣';h.style.left=(r.left-g.left+r.width*.55)+'px';h.style.top=(r.top-g.top-6)+'px';game.appendChild(h);setTimeout(()=>h.remove(),700)}function crashSpark(c){const r=c.el.getBoundingClientRect(),g=game.getBoundingClientRect(),d=c.data[3];let x=r.left-g.left+r.width/2,y=r.top-g.top+r.height/2;if(d==='R')x=r.right-g.left;if(d==='L')x=r.left-g.left;if(d==='D')y=r.bottom-g.top;if(d==='U')y=r.top-g.top;for(let i=0;i<5;i++){const s=document.createElement('i');s.className='spark';s.style.left=(x-3)+'px';s.style.top=(y-3)+'px';s.style.setProperty('--sx',((Math.random()-.5)*42)+'px');s.style.setProperty('--sy',((Math.random()-.5)*42)+'px');game.appendChild(s);setTimeout(()=>s.remove(),460)}}
function blocked(c){const[x,y,o,d,len]=c.data,s=lot.clientWidth/N;let spaces=0;const occ=new Set;cars.filter(k=>!k.gone&&k!==c).forEach(k=>cells(k).forEach(([a,b])=>occ.add(a+','+b)));if(d==='R'){for(let a=x+len;a<N&&!occ.has(a+','+y);a++)spaces++}if(d==='L'){for(let a=x-1;a>=0&&!occ.has(a+','+y);a--)spaces++}if(d==='D'){for(let b=y+len;b<N&&!occ.has(x+','+b);b++)spaces++}if(d==='U'){for(let b=y-1;b>=0&&!occ.has(x+','+b);b--)spaces++}const travel=Math.max(7,spaces*s+Math.min(10,s*.18));let dx=0,dy=0;if(d==='R')dx=travel;if(d==='L')dx=-travel;if(d==='D')dy=travel;if(d==='U')dy=-travel;c.el.classList.add('blocked');horn(c);hornSound();crashSpark(c);navigator.vibrate?.(30);c.el.animate([{transform:'translate(0,0)'},{transform:`translate(${dx}px,${dy}px)`},{transform:'translate(0,0)'}],{duration:360,easing:'cubic-bezier(.2,.8,.2,1)'});setTimeout(()=>c.el.classList.remove('blocked'),380)}function smoke(c){const r=c.el.getBoundingClientRect(),g=game.getBoundingClientRect();for(let i=0;i<4;i++){const s=document.createElement('i');s.className='smoke';s.style.left=(r.left-g.left+r.width/2+(Math.random()-.5)*20)+'px';s.style.top=(r.top-g.top+r.height/2+(Math.random()-.5)*20)+'px';game.appendChild(s);setTimeout(()=>s.remove(),720)}}function exitAnim(c){const d=c.data[3],W=lot.clientWidth,H=lot.clientHeight;let frames;if(d==='R')frames=[{transform:'translate(0,0)'},{transform:`translate(${W*.65}px,0)`,offset:.72},{transform:`translate(${W*.9}px,${H*.1}px) rotate(12deg)`}];if(d==='L')frames=[{transform:'translate(0,0)'},{transform:`translate(${-W*.65}px,0)`,offset:.72},{transform:`translate(${-W*.9}px,${-H*.08}px) rotate(-12deg)`}];if(d==='D')frames=[{transform:'translate(0,0)'},{transform:`translate(0,${H*.65}px)`,offset:.72},{transform:`translate(${W*.1}px,${H*.9}px) rotate(-12deg)`}];if(d==='U')frames=[{transform:'translate(0,0)'},{transform:`translate(0,${-H*.65}px)`,offset:.72},{transform:`translate(${-W*.1}px,${-H*.9}px) rotate(12deg)`}];return c.el.animate(frames,{duration:610,easing:'cubic-bezier(.18,.72,.18,1)',fill:'forwards'})}function tap(c){if(locked||c.gone)return;if(hint){hint.remove();hint=null}if(!pathClear(c)){blocked(c);return}locked=true;c.gone=true;smoke(c);driveSound();exitAnim(c);coins+=5;coinsEl.textContent=coins;navigator.vibrate?.(16);setTimeout(()=>{c.el.remove();locked=false;layout();if(cars.every(k=>k.gone))setTimeout(()=>clearLayer.classList.add('show'),220)},570)}function load(){clearLayer.classList.remove('show');lot.querySelectorAll('.car').forEach(x=>x.remove());cars=[];lvl.textContent='LEVEL '+(level+1);LEVELS[level%LEVELS.length].forEach((d,i)=>cars.push(makeCar(d,i)));requestAnimationFrame(()=>{layout();setTimeout(showHint,450)})}next.addEventListener('click',()=>{level=(level+1)%LEVELS.length;load()});window.addEventListener('resize',layout);window.__PJ={get level(){return level},get cars(){return cars},free:()=>cars.filter(k=>!k.gone&&pathClear(k)),remaining:()=>cars.filter(k=>!k.gone).length,ready:()=>!locked,clickFree:()=>{if(locked)return false;const c=cars.find(k=>!k.gone&&pathClear(k));c?.el.click();return !!c},setLevel:(i)=>{level=((i%LEVELS.length)+LEVELS.length)%LEVELS.length;load();}};load();})();
