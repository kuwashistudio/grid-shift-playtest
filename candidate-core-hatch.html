(()=>{'use strict';const V=6;const arena=document.getElementById('arena'),timer=document.getElementById('timer'),core=document.getElementById('core'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),forms=document.getElementById('forms'),finger=document.getElementById('finger'),face=document.getElementById('face'),weak=document.getElementById('weak'),comboEl=document.getElementById('combo'),feverEl=document.getElementById('fever'),drone=document.getElementById('drone'),shield=document.getElementById('shield'),crack=document.getElementById('crack'),evolve=document.getElementById('evolve'),over=document.getElementById('over'),bestEl=document.getElementById('best'),retry=document.getElementById('retry');let score=0,stage=1,hp=10,maxHp=10,duration=5600,start=0,raf=0,alive=true,taps=0,combo=0,lastTap=0,fever=0,weakAlive=false,weakTimer=0,autoTimer=0,audio=null,shieldHP=0;const faces=['✦','◆','⬢','✺','✹','✷','✸','✧'];const themes=[['radial-gradient(circle at 34% 28%,#fff 0 4%,#ffd45f 5% 16%,#ff7a46 17% 55%,#d52b79 56%)','#ff4f9d99'],['radial-gradient(circle at 35% 28%,#fff 0 4%,#a8f7ff 5% 18%,#4da8ff 19% 58%,#724dff 59%)','#5da8ff99'],['radial-gradient(circle at 35% 28%,#fff 0 4%,#eaff9a 5% 18%,#55e58f 19% 58%,#15946e 59%)','#55e58f99'],['radial-gradient(circle at 35% 28%,#fff 0 4%,#ffe89a 5% 18%,#ffbf3f 19% 58%,#ff5f4d 59%)','#ffbf4d99']];function beep(freq=440,d=.05){if(V<2)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='triangle';g.gain.setValueAtTime(.04,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function buzz(ms=16){if(V>=2&&navigator.vibrate)navigator.vibrate(ms)}function drawForms(){forms.innerHTML='';for(let i=0;i<6;i++){const d=document.createElement('div');d.className='formdot'+(i<Math.min(stage,6)
