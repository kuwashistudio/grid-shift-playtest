name: Parking Remaster iPhone QA Harness

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/index.html'
      - 'parking-remaster-v1/iphone_qa.js'
      - 'parking-remaster-v1/scripts/validate_iphone_qa_harness.py'
      - 'parking-remaster-v1/scripts/iphone_qa_browser_smoke.mjs'
      - '.github/workflows/parking-remaster-iphone-qa-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate harness contract
        working-directory: parking-remaster-v1
        run: python scripts/validate_iphone_qa_harness.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start runtime
        working-directory: parking-remaster-v1
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/parking-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/parking-http.log
          exit 1
      - name: Verify normal mode vs iPhone QA mode
        working-directory: parking-remaster-v1
        run: node scripts/iphone_qa_browser_smoke.mjs
      - name: Upload QA screenshot
        uses: actions/upload-artifact@v4
        with:
          name: parking-remaster-iphone-qa-harness
          path: parking-remaster-v1/iphone-qa-harness.png
          if-no-files-found: error
          retention-days: 7
