name: Parking Remaster EfficientSAM Sprite QA

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/scripts/build_efficient_sam_sprites.py'
      - '.github/workflows/parking-remaster-efficient-sam-sprites.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parking-remaster-efficient-sam-sprites
  cancel-in-progress: true

jobs:
  efficient-sam:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU segmentation stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==2.2.6" "opencv-python-headless==4.12.0.88" "onnxruntime==1.22.1" "Pillow==12.3.0"

      - name: Download pinned official EfficientSAM-Ti split ONNX
        run: |
          mkdir -p parking-remaster-v1/.qa/models
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/yformer/EfficientSAM/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_encoder.onnx" \
            -o parking-remaster-v1/.qa/models/efficient_sam_vitt_encoder.onnx
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/yformer/EfficientSAM/d525f622e6f640acf5a0fc37c7ca1f243da5bde0/weights/efficient_sam_vitt_decoder.onnx" \
            -o parking-remaster-v1/.qa/models/efficient_sam_vitt_decoder.onnx
          test "$(stat -c%s parking-remaster-v1/.qa/models/efficient_sam_vitt_encoder.onnx)" -eq 24799761
          test "$(stat -c%s parking-remaster-v1/.qa/models/efficient_sam_vitt_decoder.onnx)" -eq 16565728

      - name: Build EfficientSAM sprite candidates
        run: python parking-remaster-v1/scripts/build_efficient_sam_sprites.py

      - name: Validate structural invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("parking-remaster-v1/.qa/efficient_sam_sprites/efficient_sam_qa.json").read_text())
          assert q["hard_checks"]["sprite_count"]==10
          assert q["hard_checks"]["expected_sprite_count"]==10
          assert q["hard_checks"]["master_hash_match"] is True
          assert q["model"]["commit"]=="d525f622e6f640acf5a0fc37c7ca1f243da5bde0"
          assert q["model"]["encoder"]["git_blob"]=="6458f72477ae216a1bd68db41ffa14802c8d54f1"
          assert q["model"]["decoder"]["git_blob"]=="f9310202c916fe5a4ec9a6897edae855caf023f4"
          for vid,data in q["vehicles"].items():
              assert data["selected"]["body_coverage"] > 0.80, (vid,data["selected"])
              assert data["selected"]["mask_pixels"] > 1000, (vid,data["selected"])
          red=q["vehicles"]["red_top"]
          assert red["refine"]["removed_yellow_pixels"] > 500, red["refine"]
          assert red["refine"]["refined_body_coverage"] > 0.85, red["refine"]
          prod=json.loads(Path("parking-remaster-v1/VP_SPRITE_PRODUCTION_RESULT.json").read_text())
          assert prod["status"]=="PASS"
          assert prod["sprite_count"]==10
          assert prod["visual_approval"]=="2026-09-19_EfficientSAM_fullsheet_plus_red_distance_refine_1.5"
          for vid,data in prod["sprites"].items():
              assert data["bytes"] > 1000, (vid,data)
          print("PASS EfficientSAM production sprite structural QA")
          PY

      - name: Upload full sprite comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parking-remaster-efficient-sam-sprite-review
          path: parking-remaster-v1/.qa/efficient_sam_sprites/
          if-no-files-found: error
          retention-days: 7

      - name: Persist visually approved production sprites
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking-remaster-v1/assets/sprites parking-remaster-v1/VP_SPRITE_PRODUCTION_RESULT.json
          if git diff --cached --quiet; then
            echo "No sprite production changes"
          else
            git commit -m "Promote EfficientSAM production car sprites [skip ci]"
            git push origin HEAD:parking-remaster-v1-staging-20260917
          fi
