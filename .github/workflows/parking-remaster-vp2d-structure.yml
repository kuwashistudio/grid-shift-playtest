name: Parking Remaster VP2D Structure Model

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/scripts/detect_parking_structure.py'
      - '.github/workflows/parking-remaster-vp2d-structure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vp2d:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic CV dependencies
        run: python -m pip install "numpy==2.2.6" "opencv-python-headless==4.12.0.88"
      - name: Build VP-2D parking structure model
        run: python parking-remaster-v1/scripts/detect_parking_structure.py
      - name: Commit machine-readable model and visual review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking-remaster-v1/PARKING_STRUCTURE_MODEL_V1.json                   parking-remaster-v1/VP2D_RESULT.json                   parking-remaster-v1/assets/qa/vp2d_parking_structure_overlay.jpg                   parking-remaster-v1/assets/qa/vp2d_parking_structure_review.jpg                   parking-remaster-v1/assets/qa/vp2d_parking_structure_review.b64
          git commit -m "Build VP-2D parking structure model [skip ci]"
          git push origin HEAD:parking-remaster-v1-staging-20260917
