name: Parking Remaster VP2F Clean Plate Integrity

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/assets/clean_plate.webp'
      - 'parking-remaster-v1/assets/candidates/clean_plate_structured_v1.webp'
      - 'parking-remaster-v1/scripts/validate_clean_plate_promotion.py'
      - '.github/workflows/parking-remaster-vp2f-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder
        run: python -m pip install "Pillow==11.3.0"
      - name: Validate production clean plate
        run: python parking-remaster-v1/scripts/validate_clean_plate_promotion.py
      - name: Commit integrity result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add parking-remaster-v1/VP2F_CLEAN_PLATE_INTEGRITY_RESULT.json
          if git diff --cached --quiet; then
            echo "No integrity result diff"
          else
            git commit -m "Verify VP-2F clean plate integrity [skip ci]"
            git push origin HEAD:parking-remaster-v1-staging-20260917
          fi
