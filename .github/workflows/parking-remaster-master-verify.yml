name: Parking Remaster Master Verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify canonical master
        working-directory: parking-remaster-v1
        run: python scripts/reconstruct_master.py
