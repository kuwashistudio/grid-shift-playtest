name: Parking Remaster Project State

on:
  workflow_dispatch:
  push:
    branches:
      - parking-remaster-v1-staging-20260917
    paths:
      - 'parking-remaster-v1/project-state/**'
      - 'parking-remaster-v1/VERTICAL_SLICE_BEAT_CHART_V1.json'
      - 'parking-remaster-v1/VERTICAL_SLICE_LEVEL_BRIEFS_V1.json'
      - 'parking-remaster-v1/qa/**'
      - 'parking-remaster-v1/scripts/**'
      - '.github/workflows/parking-remaster-project-state.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate persistent project state
        run: python3 parking-remaster-v1/scripts/validate_project_state.py
      - name: Regression-test persistent project-state invariants
        run: python3 parking-remaster-v1/scripts/test_validate_project_state.py
      - name: Guard durable restart evidence paths
        run: python3 parking-remaster-v1/scripts/validate_restart_evidence.py
      - name: Regression-test durable restart evidence guard
        run: python3 parking-remaster-v1/scripts/test_validate_restart_evidence.py
      - name: Guard Phase 1 authorization chain
        run: python3 parking-remaster-v1/scripts/test_phase1_authorization_guard.py
      - name: Guard finite gate dependency chain
        run: python3 parking-remaster-v1/scripts/test_gate_dependency_contract.py
      - name: Guard rejected legacy gameplay quarantine
        run: python3 parking-remaster-v1/scripts/test_rejected_gameplay_quarantine_contract.py
      - name: Guard P1-006/P1-007 physical-iPhone Human acceptance boundary
        run: python3 parking-remaster-v1/scripts/test_p1_006_007_human_acceptance_contract.py
      - name: Regression-test preproduction Level Data contract
        run: python3 parking-remaster-v1/scripts/test_validate_level_data_contract.py
      - name: Regression-test deterministic Level Data fingerprints
        run: python3 parking-remaster-v1/scripts/test_level_fingerprint.py
      - name: Regression-test deterministic Level Library manifest
        run: python3 parking-remaster-v1/scripts/test_level_library.py
      - name: Guard Level Library preproduction contract
        run: python3 parking-remaster-v1/scripts/test_level_library_preproduction_contract.py
      - name: Regression-test bounded production-cost records
        run: python3 parking-remaster-v1/scripts/test_production_cost_record.py
      - name: Guard representative level-production cost evidence
        run: python3 parking-remaster-v1/scripts/test_validate_level_production_cost_evidence.py
      - name: Validate 14-level Vertical Slice Beat Chart
        run: python3 parking-remaster-v1/scripts/validate_beat_chart.py
      - name: Validate 14-level Vertical Slice brief envelopes
        run: python3 parking-remaster-v1/scripts/validate_vertical_slice_briefs.py
      - name: Audit Vertical Slice beat/brief/failure cross-contract
        run: python3 parking-remaster-v1/scripts/validate_vertical_slice_cross_contract.py
      - name: Regression-test Vertical Slice cross-contract drift
        run: python3 parking-remaster-v1/scripts/test_vertical_slice_cross_contract.py
      - name: Validate privacy-minimal telemetry contract
        run: python3 parking-remaster-v1/scripts/validate_telemetry_spec.py
      - name: Regression-test telemetry privacy/schema guardrails
        run: python3 parking-remaster-v1/scripts/test_validate_telemetry_spec.py
      - name: Regression-test telemetry session evidence invariants
        run: python3 parking-remaster-v1/scripts/test_validate_telemetry_evidence.py
      - name: Regression-test release and rollback manifest guardrails
        run: python3 parking-remaster-v1/scripts/test_validate_release_rollback_manifest.py
      - name: Guard deterministic asset manifest and locked asset hashes
        run: python3 parking-remaster-v1/scripts/test_asset_manifest_preproduction_contract.py
      - name: Regression-test pre-P1-008 visible movement rule contract
        run: python3 parking-remaster-v1/scripts/test_visible_movement_rule_contract.py
      - name: Guard visible geometry numeric semantics
        run: python3 parking-remaster-v1/scripts/test_visible_geometry_numeric_contract.py
      - name: Regression-test bounded Python/JS visible movement parity
        run: python3 parking-remaster-v1/scripts/test_visible_movement_parity.py
      - name: Regression-test pre-P1-008 runtime evidence contract
        run: python3 parking-remaster-v1/scripts/test_visible_movement_runtime_evidence_contract.py
      - name: Regression-test finite iPhone runtime contract
        run: python3 parking-remaster-v1/scripts/test_iphone_runtime_contract.py
      - name: Guard target-iPhone performance evidence contract
        run: python3 parking-remaster-v1/scripts/test_iphone_performance_evidence_contract.py
      - name: Regression-test target-iPhone performance evidence validator
        run: python3 parking-remaster-v1/scripts/test_validate_iphone_performance_evidence.py
      - name: Guard P1-009 fresh-player human evidence contract
        run: python3 parking-remaster-v1/scripts/test_p1_009_human_evidence_contract.py
      - name: Guard shared-exit conflict revalidation before reuse
        run: python3 parking-remaster-v1/scripts/test_shared_exit_conflict_revalidation_contract.py
      - name: Guard deterministic persistence and recovery contract
        run: python3 parking-remaster-v1/scripts/test_persistence_recovery_contract.py
      - name: Regression-test persistence envelope corruption/staleness recovery
        run: python3 parking-remaster-v1/scripts/test_validate_persistence_envelope.py
