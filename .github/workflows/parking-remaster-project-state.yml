name: Parking Remaster Project State

on:
  workflow_dispatch:
  push:
    branches:
      - parking-remaster-v1-staging-20260917
    paths:
      - 'parking-remaster-v1/project-state/**'
      - 'parking-remaster-v1/VERTICAL_SLICE_BEAT_CHART_V1.json'
      - 'parking-remaster-v1/VERTICAL_SLICE_LEVEL_BRIEFS_V1.json'
      - 'parking-remaster-v1/qa/TELEMETRY_SPEC_V1.json'
      - 'parking-remaster-v1/qa/RELEASE_ROLLBACK_MANIFEST_SPEC_V1.json'
      - 'parking-remaster-v1/qa/visible_movement_rule_contract_v1.json'
      - 'parking-remaster-v1/qa/visible_movement_parity_fixture_v1.json'
      - 'parking-remaster-v1/qa/visible_movement_runtime_evidence_contract_v1.json'
      - 'parking-remaster-v1/qa/IPHONE_RUNTIME_CONTRACT_V1.json'
      - 'parking-remaster-v1/qa/P1_009_HUMAN_EVIDENCE_CONTRACT_V1.json'
      - 'parking-remaster-v1/scripts/validate_project_state.py'
      - 'parking-remaster-v1/scripts/test_validate_project_state.py'
      - 'parking-remaster-v1/scripts/test_phase1_authorization_guard.py'
      - 'parking-remaster-v1/scripts/validate_level_data_contract.py'
      - 'parking-remaster-v1/scripts/test_validate_level_data_contract.py'
      - 'parking-remaster-v1/scripts/level_fingerprint.py'
      - 'parking-remaster-v1/scripts/test_level_fingerprint.py'
      - 'parking-remaster-v1/scripts/level_library.py'
      - 'parking-remaster-v1/scripts/test_level_library.py'
      - 'parking-remaster-v1/scripts/production_cost_record.py'
      - 'parking-remaster-v1/scripts/test_production_cost_record.py'
      - 'parking-remaster-v1/scripts/validate_beat_chart.py'
      - 'parking-remaster-v1/scripts/validate_vertical_slice_briefs.py'
      - 'parking-remaster-v1/scripts/validate_telemetry_spec.py'
      - 'parking-remaster-v1/scripts/test_validate_telemetry_spec.py'
      - 'parking-remaster-v1/scripts/validate_release_rollback_manifest.py'
      - 'parking-remaster-v1/scripts/test_validate_release_rollback_manifest.py'
      - 'parking-remaster-v1/scripts/test_visible_movement_rule_contract.py'
      - 'parking-remaster-v1/scripts/check_visible_movement_parity.js'
      - 'parking-remaster-v1/scripts/test_visible_movement_parity.py'
      - 'parking-remaster-v1/scripts/test_visible_movement_runtime_evidence_contract.py'
      - 'parking-remaster-v1/scripts/test_iphone_runtime_contract.py'
      - 'parking-remaster-v1/scripts/test_p1_009_human_evidence_contract.py'
      - '.github/workflows/parking-remaster-project-state.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate persistent project state
        run: python3 parking-remaster-v1/scripts/validate_project_state.py
      - name: Regression-test persistent project-state invariants
        run: python3 parking-remaster-v1/scripts/test_validate_project_state.py
      - name: Guard Phase 1 authorization chain
        run: python3 parking-remaster-v1/scripts/test_phase1_authorization_guard.py
      - name: Regression-test preproduction Level Data contract
        run: python3 parking-remaster-v1/scripts/test_validate_level_data_contract.py
      - name: Regression-test deterministic Level Data fingerprints
        run: python3 parking-remaster-v1/scripts/test_level_fingerprint.py
      - name: Regression-test deterministic Level Library manifest
        run: python3 parking-remaster-v1/scripts/test_level_library.py
      - name: Regression-test bounded production-cost records
        run: python3 parking-remaster-v1/scripts/test_production_cost_record.py
      - name: Validate 14-level Vertical Slice Beat Chart
        run: python3 parking-remaster-v1/scripts/validate_beat_chart.py
      - name: Validate 14-level Vertical Slice brief envelopes
        run: python3 parking-remaster-v1/scripts/validate_vertical_slice_briefs.py
      - name: Validate privacy-minimal telemetry contract
        run: python3 parking-remaster-v1/scripts/validate_telemetry_spec.py
      - name: Regression-test telemetry privacy/schema guardrails
        run: python3 parking-remaster-v1/scripts/test_validate_telemetry_spec.py
      - name: Regression-test release and rollback manifest guardrails
        run: python3 parking-remaster-v1/scripts/test_validate_release_rollback_manifest.py
      - name: Regression-test pre-P1-008 visible movement rule contract
        run: python3 parking-remaster-v1/scripts/test_visible_movement_rule_contract.py
      - name: Regression-test bounded Python/JS visible movement parity
        run: python3 parking-remaster-v1/scripts/test_visible_movement_parity.py
      - name: Regression-test pre-P1-008 runtime evidence contract
        run: python3 parking-remaster-v1/scripts/test_visible_movement_runtime_evidence_contract.py
      - name: Regression-test finite iPhone runtime contract
        run: python3 parking-remaster-v1/scripts/test_iphone_runtime_contract.py
      - name: Guard P1-009 fresh-player human evidence contract
        run: python3 parking-remaster-v1/scripts/test_p1_009_human_evidence_contract.py
