name: Parking Remaster VP2D2 Anchor Candidates

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/scripts/detect_parking_anchors.py'
      - '.github/workflows/parking-remaster-vp2d2-anchors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic CV dependencies
        run: python -m pip install "numpy==2.2.6" "opencv-python-headless==4.12.0.88"
      - name: Build anchor candidates
        run: python parking-remaster-v1/scripts/detect_parking_anchors.py
      - name: Commit candidates and QA overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            parking-remaster-v1/PARKING_MARKING_ANCHOR_CANDIDATES_V1.json \
            parking-remaster-v1/VP2D2_ANCHOR_RESULT.json \
            parking-remaster-v1/assets/qa/vp2d2_anchor_candidates_overlay.jpg \
            parking-remaster-v1/assets/qa/vp2d2_anchor_candidates_review.jpg \
            parking-remaster-v1/assets/qa/vp2d2_anchor_candidates_review.b64 \
            parking-remaster-v1/assets/qa/vp2d2_anchor_review_tile_1.jpg \
            parking-remaster-v1/assets/qa/vp2d2_anchor_review_tile_1.b64 \
            parking-remaster-v1/assets/qa/vp2d2_anchor_review_tile_2.jpg \
            parking-remaster-v1/assets/qa/vp2d2_anchor_review_tile_2.b64 \
            parking-remaster-v1/assets/qa/vp2d2_anchor_review_tile_3.jpg \
            parking-remaster-v1/assets/qa/vp2d2_anchor_review_tile_3.b64
          git commit -m "Build VP-2D2 anchor candidates [skip ci]"
          git push origin HEAD:parking-remaster-v1-staging-20260917
