name: Parking Remaster VP2E Structured Clean Plate Candidate

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/scripts/build_structured_clean_plate_candidate.py'
      - '.github/workflows/parking-remaster-vp2e-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image dependencies
        run: python -m pip install "numpy==2.2.6" "opencv-python-headless==4.12.0.88" "Pillow==11.3.0"
      - name: Build structured clean-plate candidate
        run: python parking-remaster-v1/scripts/build_structured_clean_plate_candidate.py
      - name: Upload direct visual QA
        uses: actions/upload-artifact@v4
        with:
          name: parking-remaster-vp2e-structured-candidate-qa
          path: |
            parking-remaster-v1/assets/master.webp
            parking-remaster-v1/assets/candidates/clean_plate_structured_v1.webp
            parking-remaster-v1/assets/qa/vp2e_structured_clean_plate_review.jpg
            parking-remaster-v1/assets/qa/vp2e_structured_clean_plate_iphone.jpg
            parking-remaster-v1/assets/qa/vp2e_removal_mask_review.jpg
            parking-remaster-v1/assets/qa/vp2e_level1_rebuild_review.jpg
            parking-remaster-v1/assets/qa/vp2e_level1_rebuild_iphone.jpg
            parking-remaster-v1/VP2E_RESULT.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit reproducible candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            parking-remaster-v1/assets/candidates/clean_plate_structured_v1.webp \
            parking-remaster-v1/assets/qa/vp2e_structured_clean_plate_review.jpg \
            parking-remaster-v1/assets/qa/vp2e_structured_clean_plate_iphone.jpg \
            parking-remaster-v1/assets/qa/vp2e_removal_mask_review.jpg \
            parking-remaster-v1/assets/qa/vp2e_level1_rebuild_review.jpg \
            parking-remaster-v1/assets/qa/vp2e_level1_rebuild_iphone.jpg \
            parking-remaster-v1/VP2E_RESULT.json
          if git diff --cached --quiet; then
            echo "No generated diffs to commit"
          else
            git commit -m "Build VP-2E structured clean-plate candidate [skip ci]"
            git push origin HEAD:parking-remaster-v1-staging-20260917
          fi
