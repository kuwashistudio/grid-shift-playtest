name: Parking Remaster VP2G Browser Smoke

on:
  push:
    branches:
      - parking-remaster-v1-staging-20260917
    paths:
      - "parking-remaster-v1/scripts/runtime_browser_smoke.mjs"
      - ".github/workflows/parking-remaster-vp2g-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local runtime
        working-directory: parking-remaster-v1
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/parking-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/parking-http.log
          exit 1
      - name: Run 390px touch smoke
        working-directory: parking-remaster-v1
        run: node scripts/runtime_browser_smoke.mjs
      - name: Upload runtime browser QA
        uses: actions/upload-artifact@v4
        with:
          name: parking-remaster-vp2g-browser-qa
          path: parking-remaster-v1/browser-qa/
          if-no-files-found: error
          retention-days: 7
