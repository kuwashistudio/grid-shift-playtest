name: Parking Remaster master attach

on:
  push:
    branches:
      - parking-remaster-v1-staging-20260917
    paths:
      - .github/workflows/parking-master-attach.yml

permissions:
  contents: write

jobs:
  attach-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917

      - name: Download exact approved master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parking-remaster-v1/assets
          curl -L --fail --retry 2 --retry-delay 1 \
            'https://at.adobe.com/c44dA71lU0vvgFQA' \
            -o parking-remaster-v1/assets/master.webp.tmp

          test "$(wc -c < parking-remaster-v1/assets/master.webp.tmp)" -eq 448118
          echo "535c114a9825fcbea2ca608f06246e5a5f5e954539506fe7e832c5c0b092b8d0  parking-remaster-v1/assets/master.webp.tmp" | sha256sum -c -

          mv parking-remaster-v1/assets/master.webp.tmp parking-remaster-v1/assets/master.webp

      - name: Commit verified master only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- parking-remaster-v1/assets/master.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Attach verified Parking Remaster master asset"
          git push origin HEAD:parking-remaster-v1-staging-20260917
