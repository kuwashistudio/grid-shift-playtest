name: Parking Remaster Level 002 Runtime Progression

on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/index.html'
      - 'parking-remaster-v1/scripts/level002_progression_browser.mjs'
      - '.github/workflows/parking-remaster-level002-progression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local runtime
        working-directory: parking-remaster-v1
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/parking-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/parking-http.log
          exit 1
      - name: Run Level 1 to Level 2 touch progression proof
        working-directory: parking-remaster-v1
        run: node scripts/level002_progression_browser.mjs
      - name: Upload progression QA
        uses: actions/upload-artifact@v4
        with:
          name: parking-remaster-level002-progression
          path: parking-remaster-v1/progression-qa/
          if-no-files-found: error
          retention-days: 7
