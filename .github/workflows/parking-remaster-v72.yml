name: Parking Remaster Smooth Skid + Engine Audio V7.2
on:
  push:
    branches: [parking-remaster-v1-staging-20260917]
    paths:
      - 'parking-remaster-v1/prototypes/single-car-lot-v7-2/**'
      - '.github/workflows/parking-remaster-v72.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: parking-remaster-v1-staging-20260917
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start prototype
        working-directory: parking-remaster-v1/prototypes/single-car-lot-v7-2
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/v72.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Verify smooth skid arcs and non-beep engine audio
        working-directory: parking-remaster-v1/prototypes/single-car-lot-v7-2
        run: node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: parking-remaster-v72-proof
          path: parking-remaster-v1/prototypes/single-car-lot-v7-2/*.png
          retention-days: 7
