</style></head><body><div class="app"><div class="hud"><div class="score" id="score">0</div><div class="right"><div class="streak" id="streak"></div><div class="hearts" id="hearts"></div></div></div><div class="queueWrap"><div class="queue" id="queue"></div></div><div class="stage"><div class="board" id="board"></div><div class="guide" id="guide">☝</div><div class="levelFlash" id="levelFlash">✦</div><div class="overlay" id="over"><div class="best" id="best"></div><button class="retry" id="retry" aria-label="retry">↻</button></div></div><div class="roadWrap"><div class="road" id="road"><div class="curb"></div></div></div></div><script>

[{x:1,y:0,w:1,h:2,d:'U',c:5},{x:3,y:0,w:2,h:1,d:'R',c:1},{x:0,y:2,w:2,h:1,d:'L',c:0},{x:2,y:2,w:1,h:2,d:'D',c:4},{x:4,y:2,w:2,h:1,d:'R',c:2},{x:0,y:5,w:2,h:1,d:'L',c:3},{x:3,y:4,w:1,h:2,d:'D',c:5}],
[{x:0,y:0,w:2,h:1,d:'L',c:2},{x:2,y:0,w:1,h:2,d:'U',c:4},{x:4,y:0,w:2,h:1,d:'R',c:0},{x:0,y:2,w:1,h:2,d:'D',c:1},{x:1,y:3,w:2,h:1,d:'L',c:3},{x:3,y:2,w:2,h:1,d:'R',c:5},{x:5,y:3,w:1,h:2,d:'D',c:2},{x:2,y:5,w:2,h:1,d:'R',c:0}],
[{x:0,y:1,w:2,h:1,d:'L',c:3},{x:2,y:0,w:1,h:2,d:'U',c:0},{x:4,y:1,w:2,h:1,d:'R',c:5},{x:1,y:3,w:2,h:1,d:'L',c:2},{x:3,y:2,w:1,h:2,d:'D',c:1},{x:4,y:4,w:2,h:1,d:'R',c:4},{x:0,y:5,w:2,h:1,d:'L',c:0}],

];const board=document.getElementById('board'),queueEl=document.getElementById('queue'),scoreEl=document.getElementById('score'),heartsEl=document.getElementById('hearts'),streakEl=document.getElementById('streak'),guide=document.getElementById('guide'),road=document.getElementById('road'),over=document.getElementById('over'),bestEl=document.getElementById('best'),retry=document.getElementById('retry'),levelFlash=document.getElementById('levelFlash');let level=0,score=0,strikes=0,streak=0,cars=[],locked=false,target=null,cleared=0,hintTimer=0,audio=null,firstRun=true;
function sound(f,d=.06,type='sine',gain=.045){if(V<5)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function vib(ms){if(V>=5&&navigator.vibrate)navigator.vibrate(ms)}
function arrow(d){return {R:'→',L:'←',U:'↑',D:'↓'}[d]}function canExitPlain(c,list){return list.filter(o=>o!==c&&!o.gone).every(o=>{if(c.d==='R'&&o.x>=c.x+c.w)return o.y+o.h<=c.y||o.y>=c.y+c.h;if(c.d==='L'&&o.x+o.w<=c.x)return o.y+o.h<=c.y||o.y>=c.y+c.h;if(c.d==='D'&&o.y>=c.y+c.h)return o.x+o.w<=c.x||o.x>=c.x+c.w;if(c.d==='U'&&o.y+o.h<=c.y)return o.x+o.w<=c.x||o.x>=c.x+c.w;return true})}function canExit(c){return canExitPlain(c,cars)}
function pickTarget(list,step=0){const avail=list.filter(c=>!c.gone&&canExitPlain(c,list));if(!avail.length)return null;const idx=(level*2+cleared+step)%avail.length;return avail[idx].c}function predict(count=4){const sim=cars.map(c=>({...c,e:null}));const arr=[];for(let k=0;k<count;k++){const avail=sim.filter(c=>!c.gone&&canExitPlain(c,sim));if(!avail.length)break;const col=avail[(level*2+cleared+k)%avail.length].c;arr.push(col);const chosen=avail.find(c=>c.c===col);chosen.gone=true}return arr}
function drawQueue(){const cols=V>=1?predict(V>=3?5:4):[target];queueEl.innerHTML='';cols.forEach((col,i)=>{const p=document.createElement('div');p.className='person'+(i===0?' current':'');p.style.background=C[col];p.innerHTML='<div class="face"></div><div class="body"></div>';queueEl.appendChild(p)});if(V>=1&&firstRun)setTimeout(positionGuide,80)}
function drawHearts(){heartsEl.innerHTML='';for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart'+(i<strikes?' off':'')+(V>=4&&strikes===2&&i===2?' lastLife':'');h.textContent='♥';heartsEl.appendChild(h)}}
function place(){const s=board.clientWidth/N;cars.forEach(c=>{if(c.gone)return;c.e.style.left=(c.x*s+5)+'px';c.e.style.top=(c.y*s+5)+'px';c.e.style.width=(c.w*s-10)+'px';c.e.style.height=(c.h*s-10)+'px'});positionGuide()}
function refreshValid(){cars.forEach(c=>c.e&&c.e.classList.toggle('valid',!c.gone&&canExit(c)&&c.c===target&&(V>=1)));scheduleHint()}
function scheduleHint(){clearTimeout(hintTimer);if(V<1)return;hintTimer=setTimeout(()=>{refreshValidNoTimer();guide.style.display='block';positionGuide()},firstRun?250:2200)}function refreshValidNoTimer(){cars.forEach(c=>c.e&&c.e.classList.toggle('valid',!c.gone&&canExit(c)&&c.c===target))}
function positionGuide(){if(V<1||guide.style.display==='none')return;const t=cars.find(c=>!c.gone&&canExit(c)&&c.c===target);if(!t||!t.e)return;const r=t.e.getBoundingClientRect(),sr=document.querySelector('.stage').getBoundingClientRect();guide.style.left=(r.left-sr.left+r.width*.56-12)+'px';guide.style.top=(r.top-sr.top+r.height*.34-10)+'px'}
function build(){locked=false;clearTimeout(hintTimer);board.innerHTML='';cars=[];const src=levels[level%(V>=3?levels.length:3)];src.forEach((d,i)=>{const e=document.createElement('button');e.type='button';e.className='car '+(d.w>d.h?'h':'v');e.style.background=C[d.c%C.length];e.innerHTML='<span class="wind"></span><span class="arrow">'+arrow(d.d)+'</span>';e.setAttribute('aria-label','car');board.appendChild(e);const c={...d,e,i,gone:false};cars.push(c);e.addEventListener('click',()=>tap(c))});target=pickTarget(cars,0);drawQueue();place();refreshValid();guide.style.display=V>=1&&firstRun?'block':'none';positionGuide()}
function exitTransform(c){const W=board.clientWidth,H=board.clientHeight;return c.d==='R'?`translateX(${W*1.55}px) rotate(4deg)`:c.d==='L'?`translateX(${-W*1.55}px) rotate(-4deg)`:c.d==='D'?`translateY(${H*1.55}px) rotate(4deg)`:`translateY(${-H*1.55}px) rotate(-4deg)`}
function boardFx(c,sym='✦'){const f=document.createElement('div');f.className='fx';f.textContent=sym;f.style.left=(c.e.offsetLeft+c.e.offsetWidth*.5-10)+'px';f.style.top=(c.e.offsetTop-6)+'px';board.appendChild(f);setTimeout(()=>f.remove(),700)}
function ride(col){if(V<2)return;const rc=document.createElement('div');rc.className='rideCar rideGo';rc.style.background=C[col];rc.innerHTML='<div class="rideWind"></div>';road.appendChild(rc);const p0=queueEl.firstElementChild;if(p0){const r=p0.getBoundingClientRect(),rr=road.getBoundingClientRect();const fp=document.createElement('div');fp.className='flyingPerson';fp.style.left=r.left+'px';fp.style.top=r.top+'px';fp.style.background=C[col];document.body.appendChild(fp);requestAnimationFrame(()=>{fp.style.transform=`translate(${rr.left+rr.width*.42-r.left-21}px,${rr.top+16-r.top-21}px) scale(.65)`;fp.style.opacity='.85'});setTimeout(()=>fp.remove(),430)}setTimeout(()=>rc.remove(),1050)}
function updateStreak(){if(V<3){streakEl.textContent='';return}streakEl.textContent=streak>1?'×'+streak:'';if(V>=4&&streak>0&&streak%6===0&&strikes>0){strikes--;drawHearts();const h=[...heartsEl.children].find(x=>!x.classList.contains('off'));if(h)h.animate([{transform:'scale(.5)'},{transform:'scale(1.55)'},{transform:'scale(1)'}],{duration:520});sound(960,.13,'triangle',.05)}}
function success(c){locked=true;firstRun=false;guide.style.display='none';clearTimeout(hintTimer);c.gone=true;streak++;cleared++;score+=(V>=3?10*Math.min(6,streak):10)+(V>=3&&streak>=4?10:0);scoreEl.textContent=score;updateStreak();sound(480+Math.min(streak,7)*55,.07,'sine',.045);vib(12);boardFx(c,streak>=4?'⚡':'✦');ride(c.c);c.e.style.transform=exitTransform(c);c.e.style.opacity='.08';setTimeout(()=>{c.e.remove();locked=false;if(cars.every(x=>x.gone)){score+=100+level*10;scoreEl.textContent=score;level++;cleared=0;streak=0;updateStreak();sound(860,.14,'triangle',.06);vib(28);levelFlash.classList.remove('show');void levelFlash.offsetWidth;levelFlash.classList.add('show');setTimeout(build,650)}else{target=pickTarget(cars,0);drawQueue();refreshValid()}},370)}
function fail(c,type){streak=0;updateStreak();strikes++;drawHearts();sound(type==='color'?145:105,.11,'square',.035);vib(50);c.e.classList.remove(type==='color'?'wrong':'blocked');void c.e.offsetWidth;c.e.classList.add(type==='color'?'wrong':'blocked');board.classList.remove('shakeBoard');void board.offsetWidth;if(V>=4)board.classList.add('shakeBoard');const p=queueEl.firstElementChild;if(p&&type==='color')p.animate([{transform:'scale(1.08)'},{transform:'scale(1.28) rotate(-6deg)'},{transform:'scale(1.08) rotate(6deg)'},{transform:'scale(1.08)'}],{duration:380});refreshValid();if(strikes>=3)setTimeout(gameOver,300)}
function tap(c){if(locked||c.gone)return;clearTimeout(hintTimer);guide.style.display='none';const clear=canExit(c);if(clear&&c.c===target)success(c);else fail(c,c.c!==target?'color':'blocked')}

retry.addEventListener('click',reset);window.addEventListener('resize',place);drawHearts();build();window.__qa={getState:()=>({level,score,strikes,streak,target,cleared,cars:cars.map(c=>({i:c.i,c:c.c,gone:c.gone,can:canExit(c)}))}),tap:(i)=>{const c=cars.find(x=>x.i===i);if(c)c.e.click()},reset};
