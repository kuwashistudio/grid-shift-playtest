<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#08101f">
  <title>GRID SHIFT — v1.2</title>
  <link rel="stylesheet" href="style1.css">
  <link rel="stylesheet" href="style2.css">
  <link rel="stylesheet" href="style3.css">
  <link rel="stylesheet" href="style4.css">
  <link rel="stylesheet" href="style5.css">
  <link rel="stylesheet" href="hotfix-v12.css">
</head>
<body data-build="v1.2">
  <div id="app">
    <header class="topbar">
      <button id="modeBtn" class="round-btn" aria-label="Choose game mode"><span class="menu-lines" aria-hidden="true"></span></button>
      <div class="score-hero" aria-label="Score">
        <svg id="blitzClock" class="blitz-clock" viewBox="0 0 72 72" aria-hidden="true"><circle class="blitz-track" cx="36" cy="36" r="31"></circle><circle id="blitzProgress" class="blitz-progress" cx="36" cy="36" r="31"></circle></svg>
        <strong id="score">0</strong><div id="modeStat" class="context-stat" aria-hidden="true"></div>
      </div>
      <button id="quickRestart" class="round-btn restart-btn" aria-label="Restart current run"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 7.2A8 8 0 1 0 20 12h-2.2a5.8 5.8 0 1 1-1.1-3.4L14 11h7V4l-2.6 3.2Z"/></svg></button>
      <button id="muteBtn" class="round-btn sound-btn" aria-label="Sound on">♪</button>
    </header>
    <main class="game-shell">
      <div class="sr-state" aria-hidden="true"><span id="best">0</span><span id="modeName">CLASSIC</span><span id="sizeName">10×10</span><span id="chain">CHAIN —</span><span id="modeHint"></span></div>
      <div class="board-wrap"><div id="board" class="board" aria-label="10 by 10 game grid"></div><div id="status" class="sr-status" aria-live="polite"></div></div>
      <div class="tray-zone"><div id="tray" class="tray" aria-label="Three available pieces"></div><div id="dragHint" class="drag-hint" aria-hidden="true">↻</div></div>
    </main>
  </div>
  <div id="modeOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Choose game mode"><div class="panel"><div class="panel-head"><div><h1>GRID SHIFT</h1></div><button id="closeModes" class="round-btn" aria-label="Close">×</button></div><div id="sizeRow" class="size-row" aria-hidden="true"></div><div id="modeGrid" class="mode-grid"></div><button id="restartBtn" class="secondary menu-reset">NEW RUN</button></div></div>
  <div id="confirmOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Restart current run"><div class="panel compact"><div class="eyebrow">CURRENT RUN IS SAVED UNTIL RESET</div><h1>NEW RUN?</h1><p>Best score stays.</p><button id="confirmRestart" class="primary danger-btn">RESET BOARD</button><button id="cancelRestart" class="secondary">CANCEL</button></div></div>
  <div id="gameOverOverlay" class="overlay" role="dialog" aria-modal="true" aria-label="Run over"><div class="panel compact"><div class="eyebrow" id="gameOverLabel">RUN OVER</div><h2 id="gameOverTitle">0</h2><p id="gameOverText">BEST 0</p><div class="gameover-actions"><button id="againBtn" class="primary gameover-icon" aria-label="Play again">↻</button><button id="gameOverModes" class="secondary gameover-icon" aria-label="Choose mode">▦</button></div></div></div>
  <script src="script1.js"></script>
  <script src="script2.js"></script>
  <script src="app1.js"></script>
  <script src="app2.js"></script>
  <script src="app3.js"></script>
  <script src="hotfix-v12.js"></script>
</body>
</html>
