<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>COLOR LAUNCH</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#11182b;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}body{min-height:100vh;display:flex;justify-content:center}.app{width:min(100vw,480px);height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column}.top{height:72px;display:flex;justify-content:space-between;align-items:center}.score{font-size:34px;font-weight:900}.moves{display:flex;gap:6px}.dot{width:12px;height:12px;background:#fff;border-radius:50%}.dot.used{opacity:.12}.stage{flex:1;position:relative;display:grid;grid-template-columns:repeat(3,1fr);align-content:center;justify-items:center;gap:28px 18px}.tube{position:relative;width:78px;height:190px;border:7px solid #dce9ff;border-top:0;border-radius:0 0 32px 32px;background:#ffffff08;overflow:hidden;transition:.2s;filter:drop-shadow(0 10px 8px #0006);padding:0}.tube:before{content:"";position:absolute;left:-8px;right:-8px;top:-8px;height:14px;border:7px solid #dce9ff;border-radius:10px}.layer{position:absolute;left:0;right:0;height:25%;transition:.35s cubic-bezier(.2,.9,.2,1)}.selected{transform:translateY(-18px);filter:drop-shadow(0 0 16px white)}.done{animation:launch .75s forwards}@keyframes launch{45%{transform:translateY(-45px) scale(1.08)}100%{transform:translateY(-500px) rotate(16deg);opacity:0}}.guide{position:absolute;width:72px;height:72px;border:4px solid white;border-radius:50%;z-index:10;pointer-events:none;animation:pulse 1s infinite}.guide:after{content:"☝";font-size:40px;position:absolute;left:14px;top:12px}@keyframes pulse{50%{transform:scale(1.15);box-shadow:0 0 0 18px #fff1}}.arc{position:absolute;z-index:9;font-size:44px;pointer-events:none;animation:bob 1s infinite}@keyframes bob{50%{transform:translateX(12px)}}.over{position:absolute;inset:0;background:#09111fe8;display:none;z-index:20;align-items:center;justify-content:center;flex-direction:column}.over.show{display:flex}.again{width:120px;height:120px;border:0;border-radius:50%;font-size:64px;background:white}.best{font-size:24px;opacity:.75;margin-bottom:22px}.spark{position:absolute;font-size:42px;pointer-events:none;animation:pop .55s forwards}@keyframes pop{to{transform:translateY(-80px) scale(1.5);opacity:0}}
</style></head><body><div class="app"><div class="top"><div class="score" id="score">0</div><div class="moves" id="moves"></div></div><div class="stage" id="stage"><div class="over" id="over"><div class="best" id="best"></div><button class="again" id="again">↻</button></div></div><script>
(()=>{'use strict';const stage=document.getElementById('stage'),scoreEl=document.getElementById('score'),movesEl=document.getElementById('moves'),over=document.getElementById('over'),bestEl=document.getElementById('best'),again=document.getElementById('again');const COLORS=['#ff5b6e','#44d487','#4da3ff','#ffd74e','#ae68ff'];let tubes=[],sel=null,score=0,level=0,moves=0,maxMoves=12,guide=null;const puzzles=[[[0,1,0,1],[1,0,1,0],[],[]],[[0,1,2,0],[2,1,0,2],[1,2,1,0],[],[]],[[0,1,2,3],[2,3,1,0],[3,0,2,1],[1,2,3,0],[],[]]];function renderMoves(){movesEl.innerHTML='';for(let i=0;i<maxMoves;i++){const d=document.createElement('div');d.className='dot'+(i<moves?' used':'');movesEl.appendChild(d)}}function make(){stage.querySelectorAll('.tube,.guide,.arc,.spark').forEach(x=>x.remove());sel=null;moves=0;maxMoves=12+level*2;const src=puzzles[Math.min(level,puzzles.length-1)].map(a=>[...a]);tubes=src.map((arr,i)=>{const b=document.createElement('button');b.type='button';b.className='tube';stage.appendChild(b);const t={arr,b,i,done:false};b.addEventListener('click',()=>tap(t));return t});draw();renderMoves();setTimeout(tutorial,350)}function draw(){tubes.forEach(t=>{t.b.innerHTML='';t.arr.forEach((c,i)=>{const d=document.createElement('div');d.className='layer';d.style.background=COLORS[c];d.style.bottom=(i*25)+'%';t.b.appendChild(d)});t.b.classList.toggle('selected',sel===t)});checkSolved()}function canPour(a,b){if(!a.arr.length||b.arr.length>=4)return false;const c=a.arr[a.arr.length-1];return !b.arr.length||b.arr[b.arr.length-1]===c}function pour(a,b){const c=a.arr[a.arr.length-1];let n=0;for(let i=a.arr.length-1;i>=0&&a.arr[i]===c;i--)n++;n=Math.min(n,4-b.arr.length);for(let i=0;i<n;i++){a.arr.pop();b.arr.push(c)}moves++;score+=n*3;scoreEl.textContent=score;renderMoves();draw();if(moves>=maxMoves&&!allSolved())setTimeout(gameOver,250)}function tap(t){if(t.done)return;if(guide){guide.remove();guide=null;stage.querySelectorAll('.arc').forEach(x=>x.remove())}if(!sel){if(t.arr.length){sel=t;draw()}}else if(sel===t){sel=null;draw()}else if(canPour(sel,t)){const a=sel;sel=null;pour(a,t)}else{t.b.animate([{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'none'}],{duration:220})}}function isUniform(t){return t.arr.length===4&&t.arr.every(x=>x===t.arr[0])}function allSolved(){return tubes.every(t=>!t.arr.length||isUniform(t))}function checkSolved(){tubes.forEach(t=>{if(!t.done&&isUniform(t)){t.done=true;score+=25;scoreEl.textContent=score;const r=t.b.getBoundingClientRect(),sr=stage.getBoundingClientRect();const s=document.createElement('div');s.className='spark';s.textContent='✨';s.style.left=(r.left-sr.left+24)+'px';s.style.top=(r.top-sr.top+30)+'px';stage.appendChild(s);t.b.classList.add('done')}});if(allSolved()&&tubes.some(t=>t.arr.length)){score+=100;scoreEl.textContent=score;setTimeout(()=>{level++;make()},850)}}function tutorial(){if(level>0)return;const a=tubes[0],b=tubes[3];const sr=stage.getBoundingClientRect(),ra=a.b.getBoundingClientRect(),rb=b.b.getBoundingClientRect();guide=document.createElement('div');guide.className='guide';guide.style.left=(ra.left-sr.left+3)+'px';guide.style.top=(ra.top-sr.top+75)+'px';stage.appendChild(guide);const arc=document.createElement('div');arc.className='arc';arc.textContent='→';arc.style.left=((ra.right+rb.left)/2-sr.left-18)+'px';arc.style.top=(ra.top-sr.top+75)+'px';stage.appendChild(arc);let phase=0;const id=setInterval(()=>{if(!guide||!guide.parentNode){clearInterval(id);return}const r=phase?rb:ra;guide.style.left=(r.left-sr.left+3)+'px';phase=1-phase},900)}function gameOver(){const best=Math.max(score,+localStorage.getItem('colorlaunch_best')||0);localStorage.setItem('colorlaunch_best',best);bestEl.textContent='★ '+best;over.classList.add('show')}function reset(){score=0;level=0;scoreEl.textContent=0;over.classList.remove('show');make()}again.addEventListener('click',reset);make();})();
</script></div></body></html>
