<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1020"><title>FUSE FALL</title>
<style>
:root{--bg:#0b1020;--panel:#151c34;--text:#f7f8fc;--muted:#8290b4;--line:rgba(255,255,255,.08);--glow:#8cf7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 0,#15264a 0,#0b1020 42%,#080c18 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center;align-items:stretch;touch-action:manipulation;overscroll-behavior:none}button{font:inherit}#app{width:min(100vw,520px);height:100dvh;min-height:560px;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}.top{height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{font-size:13px;font-weight:950;letter-spacing:.18em;color:#c4ccef}.score{text-align:center;line-height:1}.score b{display:block;font-size:35px;letter-spacing:-.04em}.score span{display:block;font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.16em;margin-top:4px}.best{text-align:right;font-size:21px;font-weight:950}.best small{display:block;font-size:15px;color:#ffd76d;line-height:1;margin-bottom:4px}.nextStrip{height:46px;display:flex;align-items:center;justify-content:center;gap:14px}.nextTile,.mini{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:950;font-size:14px;color:#0c1020;box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),0 6px 18px rgba(0,0,0,.18)}.arrow{font-size:18px;color:#5f6f9d;font-weight:950}.maxWrap{display:flex;align-items:center;gap:7px;color:#7f8eb5;font-size:11px;font-weight:900}.boardWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.boardShell{position:relative;width:min(100%,calc((100dvh - 160px)*.69));aspect-ratio:5/7}.board{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);gap:6px;padding:7px;border-radius:24px;background:linear-gradient(180deg,#18213d,#10172a);border:1px solid var(--line);box-shadow:0 20px 55px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.03);overflow:hidden}.cell{border-radius:13px;background:rgba(255,255,255,.032);border:1px solid rgba(255,255,255,.035);display:grid;place-items:center;min-width:0;min-height:0;position:relative}.tile{width:88%;height:88%;border-radius:12px;display:grid;place-items:center;font-weight:950;color:#0b1020;font-size:clamp(14px,4.7vw,24px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.42),0 6px 14px rgba(0,0,0,.24);transform:scale(.96)}.tile.drop{animation:dropIn .18s cubic-bezier(.2,.8,.2,1)}.tile.merge{animation:merge .30s cubic-bezier(.2,.9,.2,1)}@keyframes dropIn{0%{transform:translateY(-70%) scale(.86);opacity:.5}100%{transform:translateY(0) scale(.96);opacity:1}}@keyframes merge{0%{transform:scale(.72)}55%{transform:scale(1.2)}100%{transform:scale(.96)}}.tapLayer{position:absolute;inset:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;z-index:3}.colHit{border:0;border-radius:14px;background:transparent;position:relative}.colHit.target{background:linear-gradient(180deg,rgba(140,247,255,.18),rgba(140,247,255,.035));box-shadow:inset 0 0 0 2px rgba(140,247,255,.72),0 0 30px rgba(76,226,255,.15);animation:targetPulse 1s ease-in-out infinite}@keyframes targetPulse{50%{box-shadow:inset 0 0 0 3px rgba(255,255,255,.88),0 0 38px rgba(76,226,255,.34)}}.guideTile{position:absolute;z-index:5;top:-13px;width:52px;height:52px;border-radius:15px;display:none;place-items:center;color:#0b1020;font-weight:950;font-size:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 12px 26px rgba(0,0,0,.28);transform:translateX(-50%);pointer-events:none}.guideTile.show{display:grid;animation:bob .95s ease-in-out infinite}@keyframes bob{0%,100%{transform:translate(-50%,-3px)}50%{transform:translate(-50%,10px)}}.finger{position:absolute;z-index:6;display:none;transform:translate(-50%,-50%);font-size:34px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.4));pointer-events:none}.finger.show{display:block;animation:tapFinger 1.05s ease-in-out infinite}@keyframes tapFinger{0%,100%{transform:translate(-50%,-48%) scale(1)}55%{transform:translate(-50%,-28%) scale(.9)}}.fingerRing{position:absolute;z-index:5;display:none;width:54px;height:54px;border:3px solid rgba(255,255,255,.75);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.fingerRing.show{display:block;animation:ring 1.05s ease-out infinite}@keyframes ring{0%{transform:translate(-50%,-50%) scale(.45);opacity:.9}80%,100%{transform:translate(-50%,-50%) scale(1.2);opacity:0}}.burst{position:absolute;z-index:7;width:24px;height:24px;border:4px solid #fff;border-radius:50%;pointer-events:none;opacity:0}.burst.go{animation:burst .42s ease-out}@keyframes burst{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}.danger{position:absolute;left:8px;right:8px;top:calc(7px + (100% - 14px)/7);height:2px;background:linear-gradient(90deg,transparent,rgba(255,99,120,.5),transparent);opacity:0;pointer-events:none;z-index:2}.danger.on{opacity:1;animation:dangerPulse .8s ease-in-out infinite}@keyframes dangerPulse{50%{opacity:.35}}.bottom{height:50px;display:flex;align-items:center;justify-content:center;position:relative}.restart{position:absolute;right:0;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;font-size:20px;font-weight:900}.combo{min-width:80px;text-align:center;font-size:20px;font-weight:950;color:#fff;opacity:.25;transform:scale(.9);transition:.15s}.combo.hot{opacity:1;transform:scale(1.15)}.overlay{position:fixed;inset:0;background:rgba(5,8,17,.78);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:22px;z-index:10}.overlay.show{display:flex}.modal{width:min(340px,100%);background:#151c34;border:1px solid var(--line);border-radius:28px;padding:24px;text-align:center;box-shadow:0 28px 70px rgba(0,0,0,.45)}.modal h1{font-size:56px;margin:0;letter-spacing:-.05em}.modal .bestBig{margin:5px 0 20px;color:#aeb8d8;font-size:16px;font-weight:900}.again{width:82px;height:82px;border-radius:50%;border:0;background:#fff;color:#0b1020;font-size:38px;font-weight:950;box-shadow:0 12px 32px rgba(0,0,0,.3);animation:againPulse 1.1s ease-in-out infinite}@keyframes againPulse{50%{transform:scale(1.07)}}.toast{position:fixed;left:50%;top:24%;transform:translate(-50%,0);z-index:9;font-size:29px;font-weight:950;pointer-events:none;opacity:0;text-shadow:0 4px 16px rgba(0,0,0,.6)}.toast.go{animation:toast .7s ease}@keyframes toast{0%{opacity:0;transform:translate(-50%,12px) scale(.75)}25%{opacity:1;transform:translate(-50%,0) scale(1.08)}100%{opacity:0;transform:translate(-50%,-28px) scale(1)}}@media(max-height:650px){#app{gap:4px}.top{height:48px}.nextStrip{height:38px}.boardShell{width:min(100%,calc((100dvh - 130px)*.69))}.bottom{height:38px}.restart{width:36px;height:36px}.guideTile{width:44px;height:44px}}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="brand">FUSE FALL</div><div class="score"><b id="score">0</b><span>●</span></div><div class="best"><small>★</small><span id="best">0</span></div></div>
  <div class="nextStrip"><div id="next" class="nextTile">2</div><div class="arrow">↓</div><div class="maxWrap">◆ <div id="maxTile" class="mini">2</div></div></div>
  <div class="boardWrap"><div class="boardShell" id="boardShell"><div id="board" class="board"></div><div id="tapLayer" class="tapLayer"></div><div id="guideTile" class="guideTile">2</div><div id="finger" class="finger">☝</div><div id="fingerRing" class="fingerRing"></div><div id="burst" class="burst"></div><div id="danger" class="danger"></div></div></div>
  <div class="bottom"><div id="combo" class="combo">×2</div><button id="restart" class="restart" aria-label="Restart">↻</button></div>
</div>
<div id="overlay" class="overlay"><div class="modal"><h1 id="finalScore">0</h1><div class="bestBig">★ <span id="finalBest">0</span></div><button id="again" class="again" aria-label="Play again">↻</button></div></div><div id="toast" class="toast"></div>
<script>
(()=>{"use strict";
const R=7,C=5,colors={2:"#7EE7F2",4:"#89F0BC",8:"#D6F07B",16:"#FFD274",32:"#FF9A78",64:"#FF79A7",128:"#C995FF",256:"#8AA8FF",512:"#F1F4FF",1024:"#FFD86B",2048:"#FFFFFF"};
const $=id=>document.getElementById(id),boardEl=$("board"),tapLayer=$("tapLayer"),scoreEl=$("score"),bestEl=$("best"),nextEl=$("next"),maxTileEl=$("maxTile"),guideTile=$("guideTile"),finger=$("finger"),fingerRing=$("fingerRing"),burst=$("burst"),danger=$("danger"),comboEl=$("combo"),overlay=$("overlay"),finalScore=$("finalScore"),finalBest=$("finalBest"),toast=$("toast"),boardShell=$("boardShell");
let grid,score,nextValue,maxValue,locked=false,lastChanged=new Set(),lastDropped=null,tutorial=0,targetCol=2,audioCtx=null,best=Number(localStorage.getItem("fusefall_best")||0);bestEl.textContent=best;
const key=(r,c)=>r+"-"+c,sleep=ms=>new Promise(x=>setTimeout(x,ms));
function empty(){return Array.from({length:R},()=>Array(C).fill(0))}
function weighted(){let x=Math.random(),pressure=filled()/ (R*C);if(maxValue>=64&&x<.10)return 8;if(pressure>.72&&x<.24)return 4;return x<.74?2:4}
function filled(){let n=0;for(const row of grid)for(const v of row)if(v)n++;return n}
function style(el,v){el.style.background=colors[v]||"#fff";el.textContent=v>=1024?(v===1024?"1K":v===2048?"2K":String(v)):String(v)}
function tone(freq,dur=.07,gain=.035){try{audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur)}catch(_){}}
function render(){boardEl.innerHTML="";for(let r=0;r<R;r++)for(let c=0;c<C;c++){const cell=document.createElement("div");cell.className="cell";const v=grid[r][c];if(v){const tile=document.createElement("div");tile.className="tile"+(lastChanged.has(key(r,c))?" merge":"")+(lastDropped===key(r,c)?" drop":"");style(tile,v);cell.appendChild(tile)}boardEl.appendChild(cell)}scoreEl.textContent=score;bestEl.textContent=Math.max(best,score);style(nextEl,nextValue);style(maxTileEl,maxValue);danger.classList.toggle("on",grid[0].some(Boolean)||grid[1].some(Boolean));updateGuide()}
function landing(c){for(let r=R-1;r>=0;r--)if(!grid[r][c])return r;return-1}
function nb(r,c){const a=[];if(r>0)a.push([r-1,c]);if(r<R-1)a.push([r+1,c]);if(c>0)a.push([r,c-1]);if(c<C-1)a.push([r,c+1]);return a}
function comp(sr,sc,v){const seen=new Set([key(sr,sc)]),q=[[sr,sc]],out=[];while(q.length){const [r,c]=q.shift();out.push([r,c]);for(const [nr,nc] of nb(r,c)){const k=key(nr,nc);if(!seen.has(k)&&grid[nr][nc]===v){seen.add(k);q.push([nr,nc])}}}return out}
function gravity(){for(let c=0;c<C;c++){const vals=[];for(let r=R-1;r>=0;r--)if(grid[r][c])vals.push(grid[r][c]);for(let r=R-1,i=0;r>=0;r--,i++)grid[r][c]=vals[i]||0}}
function anchor(a,pc){a.sort((x,y)=>(y[0]-x[0])||(Math.abs(x[1]-pc)-Math.abs(y[1]-pc)));return a[0]}
function flash(text){toast.textContent=text;toast.classList.remove("go");void toast.offsetWidth;toast.classList.add("go")}
function burstAt(r,c){const rect=boardShell.getBoundingClientRect(),x=((c+.5)/C)*rect.width,y=((r+.5)/R)*rect.height;burst.style.left=x+"px";burst.style.top=y+"px";burst.classList.remove("go");void burst.offsetWidth;burst.classList.add("go")}
function updateGuide(){[...tapLayer.children].forEach((b,i)=>b.classList.toggle("target",tutorial<2&&i===targetCol));const guided=tutorial<2;if(guided){const x=((targetCol+.5)/C)*100;guideTile.classList.add("show");finger.classList.add("show");fingerRing.classList.add("show");style(guideTile,nextValue);guideTile.style.left=x+"%";finger.style.left=x+"%";finger.style.top="19%";fingerRing.style.left=x+"%";fingerRing.style.top="23%"}else{guideTile.classList.remove("show");finger.classList.remove("show");fingerRing.classList.remove("show")}}
async function resolve(sr,sc){let chain=0,pos=[sr,sc],v=grid[sr][sc];while(true){const [r,c]=pos;if(grid[r]?.[c]!==v)break;const group=comp(r,c,v);if(group.length<2)break;chain++;const [kr,kc]=anchor(group,c);for(const p of group)grid[p[0]][p[1]]=0;const nv=v*2;grid[kr][kc]=nv;score+=v*group.length*chain;maxValue=Math.max(maxValue,nv);lastChanged=new Set([key(kr,kc)]);lastDropped=null;comboEl.textContent="×"+(chain+1);comboEl.classList.add("hot");tone(360+chain*110,.09,.045);navigator.vibrate?.(chain>1?[10,20,12]:12);burstAt(kr,kc);flash(chain>1?"×"+(chain+1):"✦");render();await sleep(180);gravity();lastChanged=new Set();render();await sleep(90);v=nv;let found=null;for(let rr=R-1;rr>=0&&!found;rr--)for(let cc=0;cc<C;cc++)if(grid[rr][cc]===v&&comp(rr,cc,v).length>=2){found=[rr,cc];break}if(!found)break;pos=found}setTimeout(()=>comboEl.classList.remove("hot"),260)}
function over(){for(let c=0;c<C;c++)if(landing(c)>=0)return false;return true}
async function drop(c){if(locked)return;if(tutorial<2&&c!==targetCol){[...tapLayer.children][targetCol].classList.remove("target");void tapLayer.offsetWidth;updateGuide();navigator.vibrate?.(6);return}const r=landing(c);if(r<0){navigator.vibrate?.([20,25,20]);tone(120,.12,.03);return}locked=true;const placed=nextValue;grid[r][c]=placed;lastDropped=key(r,c);maxValue=Math.max(maxValue,placed);tone(190,.045,.02);if(tutorial===0)nextValue=4;else if(tutorial===1)nextValue=2;else nextValue=weighted();render();await sleep(100);await resolve(r,c);lastChanged=new Set();lastDropped=null;if(tutorial===0){tutorial=1;targetCol=1;grid[R-1][1]=4;nextValue=4;render();await sleep(120)}else if(tutorial===1){tutorial=2;flash("✦ ✦");nextValue=weighted();render();await sleep(160)}else render();if(score>best){best=score;localStorage.setItem("fusefall_best",String(best));bestEl.textContent=best}if(over()){finalScore.textContent=score;finalBest.textContent=Math.max(best,score);overlay.classList.add("show");try{window.FuseFallPlatform?.showInterstitial?.("run_over")}catch(_){}}locked=false}
function start(){grid=empty();score=0;maxValue=2;nextValue=2;locked=false;lastChanged=new Set();lastDropped=null;tutorial=0;targetCol=2;overlay.classList.remove("show");grid[R-1][2]=2;render()}
for(let c=0;c<C;c++){const b=document.createElement("button");b.className="colHit";b.setAttribute("aria-label","Column "+(c+1));b.onclick=()=>drop(c);tapLayer.appendChild(b)}
$("again").onclick=start;$("restart").onclick=()=>{if(!locked)start()};start();
})();
</script>
</body></html>
