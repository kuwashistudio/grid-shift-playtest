<style>
:root{--bg:#0c1020;--panel:#151b31;--text:#f6f7fb;--muted:#8f9ab8;--line:rgba(255,255,255,.08)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;justify-content:center;align-items:stretch;touch-action:manipulation;overscroll-behavior:none}#app{width:min(100vw,520px);height:100dvh;min-height:560px;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}.top{height:62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.brand{font-size:13px;font-weight:900;letter-spacing:.18em;color:#b7c0dd}.score{text-align:center;line-height:1}.score b{display:block;font-size:35px;letter-spacing:-.04em}.score span{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.16em}.best{text-align:right;font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}.best b{display:block;color:var(--text);font-size:17px;margin-top:3px}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.card{height:54px;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px}.card small{font-size:9px;color:var(--muted);font-weight:900;letter-spacing:.12em}.nextTile,.mini{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:950;font-size:13px;color:#0d1020;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}.comboBox strong{font-size:19px}.comboBox.hot{animation:pulse .35s ease}@keyframes pulse{50%{transform:scale(1.08)}}.boardWrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{width:min(100%,calc((100dvh - 210px)*.69));aspect-ratio:5/7;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);gap:6px;padding:7px;border-radius:24px;background:linear-gradient(180deg,#171f39,#11172a);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.28);position:relative}.cell{border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.04);display:grid;place-items:center;min-width:0;min-height:0}.tile{width:88%;height:88%;border-radius:12px;display:grid;place-items:center;font-weight:950;color:#0c1020;font-size:clamp(14px,4.6vw,24px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 5px 13px rgba(0,0,0,.22);transform:scale(.96)}.tile.merge{animation:merge .24s ease}@keyframes merge{50%{transform:scale(1.14)}}.aimers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,calc((100dvh - 210px)*.69));height:44px;margin:0 auto}.aim{border:0;border-radius:12px;background:rgba(255,255,255,.04);color:#6f7a9c;font-size:16px;font-weight:900}.aim:active{background:rgba(255,255,255,.11);color:#fff;transform:translateY(1px)}.footer{display:flex;justify-content:space-between;align-items:center;height:38px}.hint{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em}.iconBtn{width:38px;height:38px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:white;border-radius:12px;font-size:17px}.overlay{position:fixed;inset:0;background:rgba(5,8,17,.76);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.show{display:flex}.modal{width:min(360px,100%);background:#161d33;border:1px solid var(--line);border-radius:25px;padding:24px;text-align:center;box-shadow:0 28px 70px rgba(0,0,0,.4)}.modal .eyebrow{font-size:10px;letter-spacing:.18em;color:var(--muted);font-weight:900}.modal h1{font-size:50px;margin:8px 0 2px;letter-spacing:-.05em}.modal p{margin:0 0 18px;color:#aab3cf;font-weight:700}.primary{width:100%;height:52px;border:0;border-radius:15px;background:#fff;color:#0c1020;font-weight:950;font-size:16px}.legend{position:fixed;in <div id="app"><div class="top"><div class="brand">FUSE FALL</div><div class="score"><b id="score">0</b><span>SCORE</span></div><div class="best">BEST<b id="best">0</b></div></div><div class="meta"><div class="card"><small>NEXT</small><div id="next" class="nextTile">2</div></div><div id="comboBox" class="card comboBox"><small>CHAIN</small><strong id="combo">—</strong></div><div class="card"><small>MAX</small><div id="maxTile" class="mini">2</div></div></div><div class="boardWrap"><div id="board" class="board" aria-label="Fuse Fall board"></div></div><div id="aimers" class="aimers" aria-label="Choose drop column"></div><div class="footer"><div class="hint">TAP A COLUMN · MATCH 2+</div><button id="restart" class="iconBtn" aria-label="Restart">↻</button></div></div>
<div id="overlay" class="overlay"><div class="modal"><div class="eyebrow">RUN OVER</div><h1 id="finalScore">0</h1><p id="finalText">BEST 0</p><button id="again" class="primary">AGAIN</button></div></div><div class="legend"><div id="pop" class="pop"></div></div>
<script>(()=>{"use strict";const R=7,C=5,colors={2:"#7EE7F2",4:"#89F0BC",8:"#D6F07B",16:"#FFD274",32:"#FF9A78",64:"#FF79A7",128:"#C995FF",256:"#8AA8FF",512:"#F1F4FF",1024:"#FFD86B",2048:"#FFFFFF"};const boardEl=document.getElementById("board"),aimers=document.getElementById("aimers"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best"),nextEl=document.getElementById("next"),comboEl=document.getElementById("combo"),comboBox=document.getElementById("comboBox"),maxTileEl=document.getElementById("maxTile"),overlay=document.getElementById("overlay"),finalScore=document.getElementById("finalScore"),finalText=document.getElementById("finalText"),pop=document.getElementById("pop");let grid,score,nextValue,maxValue,locked=false,lastChanged=new Set(),best=Number(localStorage.getItem("fusefall_best")||0);bestEl.textContent=best;const key=(r,c)=>r+"-"+c,sleep=ms=>new Promise(x=>setTimeout(x,ms));function empty(){return Array.from({length:R},()=>Array(C).fill(0))}function weighted(){let x=Math.random();return maxValue>=64&&x<.08?8:x<.72?2:4}function style(el,v){el.style.background=colors[v]||"#fff";el.textContent=v>=1024?(v===1024?"1K":v===2048?"2K":String(v)):String(v)}function render(){boardEl.innerHTML="";for(let r=0;r<R;r++)for(let c=0;c<C;c++){let cell=document.createElement("div");cell.className="cell";let v=grid[r][c];if(v){let tile=document.createElement("div");tile.className="tile"+(lastChanged.has(key(r,c))?" merge":"");style(tile,v);cell.appendChild(tile)}boardEl.appendChild(cell)}scoreEl.textContent=score;bestEl.textContent=Math.max(best,score);style(nextEl,nextValue);style(maxTileEl,maxValue)}function landing(c){for(let r=R-1;r>=0;r--)if(!grid[r][c])return r;return-1}function nb(r,c){let a=[];if(r>0)a.push([r-1,c]);if(r<R-1)a.push([r+1,c]);if(c>0)a.push([r,c-1]);if(c<C-1)a.push([r,c+1]);return a}function comp(sr,sc,v){let seen=new Set([key(sr,sc)]),q=[[sr,sc]],out=[];while(q.length){let [r,c]=q.shift();out.push([r,c]);for(let [nr,nc]of nb(r,c)){let k=key(nr,nc);if(!seen.has(k)&&grid[nr][nc]===v){seen.add(k);q.push([nr,nc])}}}return out}function gravity(){for(let c=0;c<C;c++){let vals=[];for(let r=R-1;r>=0;r--)if(grid[r][c])vals.push(grid[r][c]);for(let r=R-1,i=0;r>=0;r--,i++)grid[r][c]=vals[i]||0}}function anchor(a,pc){a.sort((x,y)=>(y[0]-x[0])||(Math.abs(x[1]-pc)-Math.abs(y[1]-pc)));return a[0]}function show(t){pop.textContent=t;pop.classList.remove("go");void pop.offsetWidth;pop.classList.add("go")}async function resolve(sr,sc){let chain=0,pos=[sr,sc],v=grid[sr][sc];while(true){let [r,c]=pos;if(grid[r]?.[c]!==v)break;let group=comp(r,c,v);if(group.length<2)break;chain++;let [kr,kc]=anchor(group,c);for(let p of group)grid[p[0]][p[1]]=0;let nv=v*2;grid[kr][kc]=nv;score+=v*group.length*chain;maxValue=Math.max(maxValue,nv);lastChanged=new Set([key(kr,kc)]);comboEl.textContent="×"+chain;comboBox.classList.remove("hot");void comboBox.offsetWidth;comboBox.classList.add("hot");show(chain>1?"CHAIN ×"+chain:"FUSE!");render();await sleep(150);gravity();lastChanged=new Set();render();await sleep(80);v=nv;let found=null;for(let rr=R-1;rr>=0&&!found;rr--)for(let cc=0;cc<C;cc++)if(grid[rr][cc]===v&&comp(rr,cc,v).length>=2){found=[rr,cc];break}if(!found)break;pos=found}comboEl.textContent=chain?"×"+chain:"—"}function over(){for(let c=0;c<C;c++)if(landing(c)>=0)return false;return true}async function drop(c){if(locked)return;let r=landing(c);if(r<0){show("FULL");navigator.vibrate?.(25);return}locked=true;grid[r][c]=nextValue;maxValue=Math.max(maxValue,nextValue);lastChanged=new Set([key(r,c)]);nextValue=weighted();render();navigator.vibrate?.(8);await sleep(80);await resolve(r,c);lastChanged=new Set();render();if(score>best){best=score;localStorage.setItem("fusefall_best",String(best));bestEl.textContent=best}if(over()){finalScore.textContent=score;finalText.textContent="BEST "+Math.max(best,score);overlay.classList.add("show")}locked=false}function start(){grid=empty();score=0;maxValue=2;nextValue=2;locked=false;lastChanged=new Set();comboEl.textContent="—";overlay.classList.remove("show");render()}for(let c=0;c<C;c++){let b=document.createElement("button");b.className="aim";b.textContent="▼";b.setAttribute("aria-label","Drop in column "+(c+1));b.onclick=()=>drop(c);aimers.appendChild(b)}document.getElementById("again").onclick=start;document.getElementById("restart").onclick=()=>{if(!locked)start()};start()})();</script></body></html>
