<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no'><title>GRIDLOCK RUSH</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#102034;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}body{min-height:100vh;display:grid;place-items:center}.app{width:min(100vw,460px);height:100vh;max-height:900px;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column;background:linear-gradient(#17314f,#0c1727)}.top{height:64px;display:flex;align-items:center;justify-content:space-between}.score{font-weight:950;font-size:32px}.combo{font-weight:900;font-size:18px;opacity:.85}.hearts{font-size:24px;letter-spacing:3px}.play{position:relative;flex:1;display:grid;place-items:center}.lot{position:relative;width:min(92vw,410px);aspect-ratio:1;background:#3e4958;border-radius:28px;border:8px solid #253244;box-shadow:inset 0 0 0 2px #ffffff22,0 20px 40px #0007;overflow:visible}.lot:before{content:'';position:absolute;inset:0;background:linear-gradient(#ffffff12 2px,transparent 2px),linear-gradient(90deg,#ffffff12 2px,transparent 2px);background-size:16.666% 16.666%;pointer-events:none}.gate{position:absolute;background:#263445;z-index:1}.gate.r{right:-44px;top:41.66%;width:52px;height:16.66%;border-radius:0 14px 14px 0}.gate.l{left:-44px;top:41.66%;width:52px;height:16.66%;border-radius:14px 0 0 14px}.gate.d{bottom:-44px;left:41.66%;height:52px;width:16.66%;border-radius:0 0 14px 14px}.gate.u{top:-44px;left:41.66%;height:52px;width:16.66%;border-radius:14px 14px 0 0}.gate:after{position:absolute;color:#f7d54a;font-size:23px}.gate.r:after{content:'➜';right:6px;top:50%;transform:translateY(-50%)}.gate.l:after{content:'⬅';left:6px;top:50%;transform:translateY(-50%)}.gate.d:after{content:'⬇';bottom:4px;left:50%;transform:translateX(-50%)}.gate.u:after{content:'⬆';top:4px;left:50%;transform:translateX(-50%)}.car{position:absolute;border:0;border-radius:14px;box-shadow:0 7px 0 #0005,inset 0 -7px 0 #0002;transition:transform .34s cubic-bezier(.2,.9,.25,1),opacity .28s;display:grid;place-items:center;padding:0}.car:after{content:'';position:absolute;width:45%;height:50%;border-radius:8px;background:#dff7ff99}.dir{position:relative;z-index:2;font-size:25px;font-weight:1000;color:#fff;text-shadow:0 3px 2px #0007}.car.hint{animation:wiggle .85s ease-in-out infinite}.car.bad{animation:shake .22s}.guide{position:absolute;z-index:10;pointer-events:none;font-size:56px;filter:drop-shadow(0 4px 2px #0008);animation:tap 1s infinite}.impact{position:absolute;z-index:18;font-size:48px;pointer-events:none;opacity:0}.impact.show{animation:boom .5s}.banner{position:absolute;top:7%;font-size:34px;font-weight:1000;opacity:0;transform:scale(.4);pointer-events:none;z-index:15;text-shadow:0 4px 0 #0004}.banner.show{animation:boom .65s}.overlay{position:absolute;inset:0;background:#08111eea;z-index:30;display:none;place-items:center}.overlay.show{display:grid}.panel{text-align:center}.big{font-size:50px;font-weight:1000}.again{margin-top:18px;width:116px;height:116px;border:0;border-radius:50%;background:white;color:#162032;font-size:64px;font-weight:900}.level{font-size:16px;opacity:.65}.bestMark{font-size:13px;opacity:.45;margin-top:2px}.confetti{position:absolute;z-index:22;font-size:28px;pointer-events:none;animation:conf .8s forwards}@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}.roadline{position:absolute;right:-43px;top:49%;width:45px;border-top:2px dashed #fff7}
@keyframes wiggle{50%{transform:translateX(8px)}}@keyframes tap{50%{transform:translateY(10px) scale(.9)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes boom{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.85) translateY(-35px)}}
</style></head><body><div class='app'><div class='top'><div><div class='score' id='score'>0</div><div class='level' id='level'>●</div><div class='bestMark' id='bestMark'></div></div><div class='combo' id='combo'></div><div class='hearts' id='hearts'></div></div><div class='play'><div class='lot' id='lot'><div class='gate r'></div><div class='gate l'></div><div class='gate d'></div><div class='gate u'></div><div class='roadline'></div></div><div class='guide' id='guide'>☝</div><div class='impact' id='impact'>💥</div><div class='banner' id='banner'>COMBO!</div><div class='overlay' id='overlay'><div class='panel'><div class='big' id='endScore'>0</div><button class='again' id='again'>↻</button></div></div></div></div><script>
(()=>{'use strict';const lot=document.querySelector('#lot'),scoreEl=document.querySelector('#score'),comboEl=document.querySelector('#combo'),heartsEl=document.querySelector('#hearts'),levelEl=document.querySelector('#level'),bestMark=document.querySelector('#bestMark'),guide=document.querySelector('#guide'),banner=document.querySelector('#banner'),impact=document.querySelector('#impact'),overlay=document.querySelector('#overlay'),endScore=document.querySelector('#endScore'),again=document.querySelector('#again');const colors=['#ff5f62','#3ddc97','#4aa8ff','#ffd34e','#b66cff','#ff8c42'];let score=0,level=0,hearts=3,streak=0,lastGood=0,cars=[],locked=false,tutorial=true,graceUsed=false;const baseLevels=[
[{x:0,y:2,w:2,h:1,d:'R',c:0},{x:2,y:0,w:1,h:2,d:'D',c:1},{x:3,y:2,w:2,h:1,d:'R',c:2},{x:1,y:4,w:1,h:2,d:'D',c:3}],
[{x:0,y:1,w:2,h:1,d:'R',c:4},{x:2,y:1,w:1,h:2,d:'D',c:0},{x:3,y:0,w:2,h:1,d:'R',c:1},{x:0,y:4,w:2,h:1,d:'R',c:2},{x:3,y:4,w:2,h:1,d:'R',c:5}],
[{x:0,y:2,w:2,h:1,d:'R',c:2},{x:2,y:1,w:1,h:2,d:'D',c:3},{x:3,y:2,w:2,h:1,d:'R',c:0},{x:0,y:0,w:1,h:2,d:'D',c:4},{x:4,y:0,w:1,h:2,d:'D',c:1},{x:1,y:4,w:2,h:1,d:'R',c:5}],
[{x:0,y:1,w:2,h:1,d:'R',c:0},{x:2,y:0,w:1,h:2,d:'D',c:1},{x:3,y:1,w:2,h:1,d:'R',c:4},{x:0,y:3,w:2,h:1,d:'R',c:2},{x:2,y:3,w:2,h:1,d:'R',c:5},{x:4,y:2,w:1,h:2,d:'D',c:3},{x:1,y:5,w:2,h:1,d:'R',c:1}]
];const MH=l=>l.map(o=>({...o,x:6-o.x-o.w,d:o.d==='R'?'L':o.d==='L'?'R':o.d,c:(o.c+2)%6}));const MV=l=>l.map(o=>({...o,y:6-o.y-o.h,d:o.d==='D'?'U':o.d==='U'?'D':o.d,c:(o.c+4)%6}));const levels=[...baseLevels,...baseLevels.map(MH),...baseLevels.map(MV)];function sfx(freq=500,d=.05){try{const A=window.AudioContext||window.webkitAudioContext;const a=sfx.a||(sfx.a=new A());const o=a.createOscillator(),g=a.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function vibrate(x){try{navigator.vibrate&&navigator.vibrate(x)}catch(e){}}function safeGet(k){try{return +localStorage.getItem(k)||0}catch(e){return 0}}function safeSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}function updateHUD(){scoreEl.textContent=score;bestMark.textContent='★ '+safeGet('gridlock_best');heartsEl.textContent='●'.repeat(hearts)+'○'.repeat(3-hearts);levelEl.textContent='●'.repeat(Math.min(level+1,6));comboEl.textContent=streak>=2?'×'+Math.min(streak,5):''}function px(){return lot.clientWidth/6}function canExit(c){if(c.gone)return false;const os=cars.filter(o=>o!==c&&!o.gone);if(c.d==='R'){const edge=c.x+c.w;return !os.some(o=>!(o.y+o.h<=c.y||o.y>=c.y+c.h)&&o.x>=edge)}if(c.d==='L'){return !os.some(o=>!(o.y+o.h<=c.y||o.y>=c.y+c.h)&&o.x+o.w<=c.x)}if(c.d==='D'){const edge=c.y+c.h;return !os.some(o=>!(o.x+o.w<=c.x||o.x>=c.x+c.w)&&o.y>=edge)}return !os.some(o=>!(o.x+o.w<=c.x||o.x>=c.x+c.w)&&o.y+o.h<=c.y)}function place(){const p=px();cars.forEach(c=>{c.e.style.left=(c.x*p+4)+'px';c.e.style.top=(c.y*p+4)+'px';c.e.style.width=(c.w*p-8)+'px';c.e.style.height=(c.h*p-8)+'px'});hint()}function build(){locked=false;lot.querySelectorAll('.car').forEach(e=>e.remove());cars=[];levels[level%levels.length].forEach((d,i)=>{const e=document.createElement('button');e.className='car';e.style.background=colors[d.c%colors.length];e.setAttribute('aria-label','car');e.innerHTML='<span class="dir">'+({R:'➜',L:'⬅',D:'⬇',U:'⬆'}[d.d]||'')+'</span>';lot.appendChild(e);const c={...d,e,i,gone:false};cars.push(c);e.addEventListener('click',()=>tap(c))});updateHUD();requestAnimationFrame(place)}function hint(){cars.forEach(c=>{c.e.classList.remove('hint');c.e.dataset.clear=canExit(c)?'1':'0'});const clear=cars.filter(canExit);if((tutorial||hearts===1)&&clear[0]){clear[0].e.classList.add('hint');const r=clear[0].e.getBoundingClientRect();guide.style.display='block';guide.style.left=(r.left+r.width*.55)+'px';guide.style.top=(r.top+r.height*.55)+'px'}else guide.style.display='none'}function tap(c){if(locked||c.gone)return;tutorial=false;guide.style.display='none';if(!canExit(c)){if(level===0&&!graceUsed){graceUsed=true;streak=0;}else{hearts--;}streak=0;updateHUD();const r=c.e.getBoundingClientRect(),lr=lot.getBoundingClientRect();impact.style.left=(r.left-lr.left+r.width*.55)+'px';impact.style.top=(r.top-lr.top+r.height*.2)+'px';impact.classList.remove('show');void impact.offsetWidth;impact.classList.add('show');c.e.classList.remove('bad');void c.e.offsetWidth;c.e.classList.add('bad');sfx(120,.12);vibrate(50);if(hearts<=0)setTimeout(gameOver,250);return}const now=performance.now();streak=now-lastGood<1800?streak+1:1;lastGood=now;const mult=Math.min(streak,5);score+=10*mult;updateHUD();if(streak>=3){banner.classList.remove('show');void banner.offsetWidth;banner.classList.add('show')}c.gone=true;locked=true;sfx(520+streak*70,.08);vibrate(15);const dist=lot.clientWidth*1.6;c.e.style.transform=c.d==='R'?`translateX(${dist}px) rotate(7deg)`:c.d==='L'?`translateX(${-dist}px) rotate(-7deg)`:c.d==='D'?`translateY(${dist}px) rotate(7deg)`:`translateY(${-dist}px) rotate(-7deg)`;c.e.style.opacity='.12';setTimeout(()=>{c.e.remove();locked=false;if(cars.every(x=>x.gone)){score+=80;for(let i=0;i<12;i++){const q=document.createElement('div');q.className='confetti';q.textContent=i%2?'✦':'●';q.style.left=(45+Math.random()*10)+'%';q.style.top='46%';q.style.setProperty('--x',(Math.random()*220-110)+'px');q.style.setProperty('--y',(Math.random()*180-110)+'px');lot.appendChild(q);setTimeout(()=>q.remove(),850)}level++;hearts=Math.min(3,hearts+1);updateHUD();setTimeout(build,520)}else hint()},360)}function gameOver(){locked=true;const b=Math.max(score,safeGet('gridlock_best'));safeSet('gridlock_best',b);bestMark.textContent='★ '+b;endScore.textContent=score;overlay.classList.add('show');sfx(90,.3)}function reset(){score=0;level=0;hearts=3;streak=0;tutorial=true;graceUsed=false;overlay.classList.remove('show');build()}again.addEventListener('click',reset);window.addEventListener('resize',place);build()})();
</script></body></html>
