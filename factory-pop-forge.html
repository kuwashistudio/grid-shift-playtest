<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>POP FORGE</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#160f2b;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;touch-action:manipulation}body{min-height:100vh;display:flex;justify-content:center}.app{width:min(100vw,480px);height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.score{font-size:34px;font-weight:1000}.stageNo{font-size:24px;opacity:.65}.arena{position:relative;flex:1;display:flex;align-items:center;justify-content:center}.ring{position:absolute;width:min(82vw,360px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#ff4f7d var(--p,100%),#ffffff12 0);display:grid;place-items:center;filter:drop-shadow(0 18px 25px #0008)}.ring:before{content:"";width:88%;height:88%;border-radius:50%;background:#1a1435;position:absolute}.orb{position:relative;z-index:3;width:54%;aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 4%,#ffd95a 5% 18%,#ff7a3d 19% 56%,#d91f74 57% 100%);box-shadow:0 0 45px #ff5a8d, inset 0 -18px 0 #0002;display:grid;place-items:center;transition:transform .08s}.orb:active{transform:scale(.94)}.face{font-size:64px;filter:drop-shadow(0 3px 1px #0007)}.hp{position:absolute;bottom:12%;width:66%;height:20px;border-radius:20px;background:#fff1;overflow:hidden;z-index:5}.bar{height:100%;width:100%;background:#5ff29f;transition:width .12s}.finger{position:absolute;left:59%;top:58%;z-index:8;font-size:56px;animation:tap 1s infinite;pointer-events:none;filter:drop-shadow(0 4px 2px #0008)}@keyframes tap{0%,100%{transform:translateY(-6px) scale(1)}50%{transform:translateY(12px) scale(.88)}}.pop{position:absolute;font-size:34px;font-weight:1000;pointer-events:none;animation:float .55s forwards;z-index:9}@keyframes float{to{transform:translateY(-90px) scale(1.3);opacity:0}}.flash{animation:flash .4s}@keyframes flash{50%{filter:brightness(2)}}.over{position:absolute;inset:0;background:#0b0717e8;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column}.over.show{display:flex}.again{width:120px;height:120px;border:0;border-radius:50%;font-size:66px;background:white}.best{font-size:24px;opacity:.75;margin-bottom:24px}.evolve{position:absolute;top:12%;font-size:70px;opacity:0;pointer-events:none}.evolve.show{animation:evolve .9s}@keyframes evolve{0%{opacity:0;transform:scale(.4) rotate(-30deg)}35%{opacity:1;transform:scale(1.3) rotate(8deg)}100%{opacity:0;transform:scale(.8) translateY(-80px)}}
</style></head><body><div class="app"><div class="top"><div class="score" id="score">0</div><div class="stageNo" id="stageNo">●</div></div><div class="arena" id="arena"><div class="ring" id="ring"><button class="orb" id="orb" aria-label="tap"><div class="face" id="face">😮</div></button><div class="hp"><div class="bar" id="bar"></div></div></div><div class="finger" id="finger">☝</div><div class="evolve" id="evolve">⚡</div><div class="over" id="over"><div class="best" id="best"></div><button class="again" id="again">↻</button></div></div><script>
(()=>{'use strict';const arena=document.getElementById('arena'),ring=document.getElementById('ring'),orb=document.getElementById('orb'),bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),stageEl=document.getElementById('stageNo'),finger=document.getElementById('finger'),face=document.getElementById('face'),evolve=document.getElementById('evolve'),over=document.getElementById('over'),bestEl=document.getElementById('best'),again=document.getElementById('again');let score=0,stage=1,hp=10,maxHp=10,time=5200,start=0,raf=0,alive=true,taps=0;const faces=['😮','😈','🤖','👾','🐲','🌞','🧿'];function setup(){alive=true;taps=0;maxHp=8+stage*3;hp=maxHp;time=Math.max(2600,5600-stage*240);bar.style.width='100%';stageEl.textContent='●'.repeat(Math.min(stage,6));face.textContent=faces[(stage-1)%faces.length];ring.style.setProperty('--p','100%');finger.style.display='block';start=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function tap(){if(!alive)return;finger.style.display='none';taps++;const dmg=1+(stage>3&&taps%7===0?2:0);hp=Math.max(0,hp-dmg);score+=1;scoreEl.textContent=score;bar.style.width=(hp/maxHp*100)+'%';orb.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:150});const p=document.createElement('div');p.className='pop';p.textContent=taps%7===0?'⚡':'+';const r=orb.getBoundingClientRect(),a=arena.getBoundingClientRect();p.style.left=(r.left-a.left+r.width*.45+Math.random()*30)+'px';p.style.top=(r.top-a.top+r.height*.4)+'px';arena.appendChild(p);setTimeout(()=>p.remove(),600);if(hp<=0)win()}function win(){alive=false;cancelAnimationFrame(raf);score+=50+stage*10;scoreEl.textContent=score;evolve.classList.remove('show');void evolve.offsetWidth;evolve.classList.add('show');stage++;setTimeout(setup,650)}function loop(t){if(!alive)return;const left=Math.max(0,1-(t-start)/time);ring.style.setProperty('--p',(left*100)+'%');if(left<=0){gameOver();return}raf=requestAnimationFrame(loop)}function gameOver(){alive=false;cancelAnimationFrame(raf);const best=Math.max(score,+localStorage.getItem('popforge_best')||0);localStorage.setItem('popforge_best',best);bestEl.textContent='★ '+best;over.classList.add('show')}function reset(){score=0;stage=1;scoreEl.textContent=0;over.classList.remove('show');setup()}orb.addEventListener('click',tap);again.addEventListener('click',reset);setup();})();
</script></div></body></html>
