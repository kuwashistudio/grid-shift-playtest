];let level=0,score=0,strikes=0,cars=[],locked=false,combo=0,lastGood=0,hintTimer=0,rush=0,audio=null;function beep(freq=440,d=.05){if(V<2)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function buzz(ms=18){if(V>=2&&navigator.vibrate)navigator.vibrate(ms)}function drawHearts(){heartsEl.innerHTML='';for(let i=0;i<3;i++){const h=document.createElement('div');h.className='heart'+(i<strikes?' off':'')+(V>=4&&strikes===2&&i===2?' last':'');heartsEl.appendChild(h)}}function drawDots(){levelDots.innerHTML='';for(let i=0;i<5;i++){const d=document.createElement('div');d.className='dot'+(i===level%5?' on':'');levelDots.appendChild(d)}}function canExit(c){return cars.filter(o=>o!==c&&!o.gone).every(o=>{if(c.d==='R'&&o.x>=c.x+c.w)return o.y+o.h<=c.y||o.y>=c.y+c.h;if(c.d==='L'&&o.x+o.w<=c.x)return o.y+o.h<=c.y||o.y>=c.y+c.h;if(c.d==='D'&&o.y>=c.y+c.h)return o.x+o.w<=c.x||o.x>=c.x+c.w;if(c.d==='U'&&o.y+o.h<=c.y)return o.x+o.w<=c.x||o.x>=c.x+c.w;return true})}function arrow(d){return {R:'→',L:'←',U:'↑',D:'↓'}[d]}function place(){const s=board.clientWidth/6,pad=board.clientWidth<340?2:5;cars.forEach(c=>{if(c.gone)return;c.e.style.left=(c.x*s+pad)+'px';c.e.style.top=(c.y*s+pad)+'px';c.e.style.width=(c.w*s-pad*2)+'px';c.e.style.height=(c.h*s-pad*2)+'px'});positionGuide()}function positionGuide(){if(V<1||guide.style.display==='none')return;const target=cars.find(c=>!c.gone&&canExit(c));if(!target)return;const r=target.e.getBoundingClientRect(),b=board.getBoundingClientRect();guide.style.left=(r.left-b.left+r.width*.55)+'px';guide.style.top=(r.top-b.top+r.height*.42)+'px'}function scheduleHint(){clearTimeout(hintTimer);if(V<4)return;hintTimer=setTimeout(()=>{const f=cars.f
